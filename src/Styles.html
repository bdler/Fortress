<style>
:root {
  --bg: #0b0f1e;
  --panel: #1c2747;
  --panel2: #121a33;
  --line: #070b18;
  --gold: #ffd23f;
  --gold2: #ff9d1a;
  --ink: #f4f6ff;
  --muted: #9aa7c7;
  --go: #37c95b;
  --alt: #3a8dff;
  --danger: #ff5252;
  --hudh: 112px;
  --kr: 'Black Han Sans', 'Jua', sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
  font-family: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; user-select: none; -webkit-user-select: none; }
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.hidden { display: none !important; }
button { font-family: inherit; }
input { user-select: text; -webkit-user-select: text; }
kbd { display: inline-block; min-width: 1.6em; padding: 1px 6px; border-radius: 5px; background: linear-gradient(#3a4878, #26315a); border: 1px solid #56679c;
  border-bottom-width: 3px; font-family: inherit; font-size: .85em; text-align: center; color: #fff; box-shadow: 0 2px 0 rgba(0,0,0,.4); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #34437a; border-radius: 8px; border: 2px solid #121a33; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- 버튼 ---------- */
.btn { position: relative; overflow: hidden; border: 3px solid var(--line); border-radius: 14px; padding: 10px 18px; font-size: 18px; color: #3a2400; cursor: pointer;
  background: linear-gradient(#ffe57a, var(--gold) 45%, var(--gold2)); box-shadow: inset 0 2px 0 rgba(255,255,255,.6), inset 0 -3px 0 rgba(0,0,0,.12), 0 5px 0 #7a4b00, 0 8px 14px rgba(0,0,0,.4);
  transition: transform .1s, box-shadow .1s, filter .12s; text-shadow: 0 1px 0 rgba(255,255,255,.5); }
.btn::after { content: ''; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent);
  transform: skewX(-20deg); opacity: 0; pointer-events: none; }
.btn:hover:not(:disabled) { filter: brightness(1.08) saturate(1.1); transform: translateY(-2px); }
.btn:hover:not(:disabled)::after { opacity: 1; animation: btnShine .7s ease; }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: inset 0 2px 0 rgba(255,255,255,.6), 0 1px 0 #7a4b00, 0 3px 8px rgba(0,0,0,.4); filter: brightness(.95); }
.btn:disabled { filter: grayscale(.8) brightness(.7); cursor: default; }
.btn.alt { color: #fff; background: linear-gradient(#7cc0ff, var(--alt) 45%, #1d5fd0); box-shadow: inset 0 2px 0 rgba(255,255,255,.45), inset 0 -3px 0 rgba(0,0,0,.15), 0 5px 0 #0d2f73, 0 8px 14px rgba(0,0,0,.4); text-shadow: 0 1px 0 rgba(0,0,0,.4); }
.btn.alt:active:not(:disabled) { box-shadow: inset 0 2px 0 rgba(255,255,255,.45), 0 1px 0 #0d2f73, 0 3px 8px rgba(0,0,0,.4); }
.btn.go { color: #fff; background: linear-gradient(#8ef0a4, var(--go) 45%, #1d8f3a); box-shadow: inset 0 2px 0 rgba(255,255,255,.45), inset 0 -3px 0 rgba(0,0,0,.15), 0 5px 0 #0c4d1d, 0 8px 14px rgba(0,0,0,.4); text-shadow: 0 1px 0 rgba(0,0,0,.4); }
.btn.go:active:not(:disabled) { box-shadow: inset 0 2px 0 rgba(255,255,255,.45), 0 1px 0 #0c4d1d, 0 3px 8px rgba(0,0,0,.4); }
.btn.big { font-size: 24px; padding: 14px 28px; }
.btn.sm { font-size: 14px; padding: 5px 12px; border-radius: 10px; border-width: 2px; }
.btn small { display: block; font-size: 13px; opacity: .8; margin-top: 2px; }
@keyframes btnShine { from { left: -60%; } to { left: 130%; } }
.ibtn { width: 44px; height: 44px; border-radius: 12px; border: 2px solid #000; background: linear-gradient(#3b4b82, #202a50); color: #fff; font-size: 22px; cursor: pointer;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.18), 0 4px 0 #000; transition: transform .1s, filter .1s; }
.ibtn:hover { filter: brightness(1.2); transform: rotate(20deg); }
.ibtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #000; }
.ibtn.sm { width: 34px; height: 34px; font-size: 16px; border-radius: 9px; box-shadow: 0 3px 0 #000; }
.ibtn.sm:hover { transform: none; }

/* ---------- 공통 화면 ---------- */
.screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.screen.show { display: flex; animation: scrFade .35s ease both; }
.screen.show > .panel { animation: panelIn .45s cubic-bezier(.2,1.25,.4,1) both; }
@keyframes scrFade { from { opacity: 0; } }
@keyframes panelIn { from { opacity: 0; transform: translateY(26px) scale(.97); } }
.panel { position: relative; background: linear-gradient(var(--panel), var(--panel2)); border: 3px solid var(--line); border-radius: 20px;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.12), inset 0 0 0 2px rgba(120,150,255,.12), 0 10px 0 rgba(0,0,0,.45), 0 20px 50px rgba(0,0,0,.5); padding: 18px; }
.panel::before { content: ''; position: absolute; inset: 6px; border-radius: 15px; pointer-events: none;
  background: radial-gradient(ellipse at 50% -10%, rgba(120,160,255,.14), transparent 55%); }
.panel h2 { margin: 0; font-family: var(--kr); font-weight: normal; letter-spacing: 1px; font-size: 28px; color: var(--gold);
  text-shadow: 0 3px 0 #6b3d00, 0 0 18px rgba(255,190,40,.35); white-space: nowrap; }
.h-ic { font-size: .8em; filter: drop-shadow(0 2px 0 #000); }
.panel.narrow { width: min(680px, 100%); }

/* ---------- 타이틀 ---------- */
#scr-title { flex-direction: column; gap: 26px; overflow: hidden;
  background: radial-gradient(ellipse at 50% 40%, rgba(0,0,0,0) 25%, rgba(5,8,20,.7) 100%), linear-gradient(rgba(5,8,25,.35), rgba(5,8,25,0) 30%, rgba(5,8,25,.2)); }
.rays { position: absolute; left: 50%; top: 30%; width: 1600px; height: 1600px; margin: -800px 0 0 -800px; pointer-events: none; opacity: .22;
  background: repeating-conic-gradient(from 0deg, rgba(255,220,120,.55) 0deg 6deg, transparent 6deg 18deg);
  -webkit-mask: radial-gradient(circle, #000 0, transparent 55%); mask: radial-gradient(circle, #000 0, transparent 55%); animation: spin 60s linear infinite; }
.gfx-low .rays { animation: none; }
@keyframes spin { to { transform: rotate(360deg); } }
#title-parade { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: clamp(96px, 24vh, 200px); pointer-events: none; z-index: 0; }
.title-top { position: absolute; top: 14px; right: 14px; display: flex; gap: 8px; z-index: 2; }
.logo { position: relative; z-index: 1; text-align: center; animation: logoIn .9s cubic-bezier(.2,1.6,.4,1) both; }
.logo-sub { display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 15px; letter-spacing: 6px; color: #fff; text-shadow: 0 2px 4px #000; opacity: .92; }
.logo-sub i { display: block; width: 60px; height: 2px; background: linear-gradient(90deg, transparent, #ffd23f); }
.logo-sub i:last-child { transform: scaleX(-1); }
.logo-wrap { position: relative; display: inline-block; animation: logoFloat 4s ease-in-out infinite; }
.logo-main { position: relative; margin: 0; font-family: 'Black Han Sans', 'Arial Black', sans-serif; font-weight: normal; font-size: clamp(64px, 13vw, 150px); line-height: .95; letter-spacing: 4px;
  background: linear-gradient(#ffffff 0%, #fff4b8 18%, #ffd23f 40%, #ff9d1a 58%, #ffe7a0 62%, #c2410c 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  -webkit-text-stroke: 3px #3a1700; filter: drop-shadow(0 3px 0 #7a3a00) drop-shadow(0 6px 0 #3a1700) drop-shadow(0 14px 18px rgba(0,0,0,.55)); }
.logo-main::after { content: attr(data-text); position: absolute; inset: 0; background: linear-gradient(100deg, transparent 42%, rgba(255,255,255,.95) 50%, transparent 58%);
  background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 0; animation: shine 3.5s infinite; }
.spark { position: absolute; width: 22px; height: 22px; pointer-events: none; opacity: 0;
  background: radial-gradient(circle, #fff 0 12%, transparent 13%), linear-gradient(0deg, transparent 45%, #fff 50%, transparent 55%), linear-gradient(90deg, transparent 45%, #fff 50%, transparent 55%);
  filter: drop-shadow(0 0 6px #fff6b0); animation: sparkle 2.6s infinite; }
.spark.s1 { left: 4%; top: 12%; } .spark.s2 { left: 36%; top: -6%; animation-delay: .7s; } .spark.s3 { left: 70%; top: 58%; animation-delay: 1.3s; width: 16px; height: 16px; }
.spark.s4 { left: 93%; top: 6%; animation-delay: 1.9s; } .spark.s5 { left: 18%; top: 70%; animation-delay: 2.3s; width: 14px; height: 14px; }
@keyframes sparkle { 0%, 100% { opacity: 0; transform: scale(.2) rotate(0); } 12% { opacity: 1; transform: scale(1.1) rotate(45deg); } 26% { opacity: 0; transform: scale(.3) rotate(90deg); } }
@keyframes logoFloat { 50% { transform: translateY(-6px); } }
.logo-kr { font-family: var(--kr); font-size: clamp(26px, 4.5vw, 44px); color: #fff; text-shadow: 0 3px 0 #1d3570, 0 0 20px rgba(80,160,255,.6); margin-top: 6px; }
.logo-kr .rib { display: inline-block; padding: 0 16px; background: linear-gradient(#ff6a5a, #d62b3a); border: 3px solid #3a0710; border-radius: 10px; transform: rotate(-3deg);
  text-shadow: 0 3px 0 #6a0d19; box-shadow: 0 4px 0 #3a0710; }
.logo-kr b { color: #7ee0ff; font-weight: normal; }
.menu { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 14px; align-items: stretch; width: min(380px, 90vw); }
.menu > * { animation: fadeUp .55s both; }
.menu > :nth-child(1) { animation-delay: .35s; } .menu > :nth-child(2) { animation-delay: .45s; } .menu > :nth-child(3) { animation-delay: .55s; } .menu > :nth-child(4) { animation-delay: .65s; }
.mbtn { display: flex; align-items: center; gap: 14px; text-align: left; }
.mbtn .mi { font-size: 34px; width: 50px; height: 50px; display: grid; place-items: center; border-radius: 12px; background: rgba(255,255,255,.28); box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); flex: none; }
.mbtn .mt { flex: 1; line-height: 1.1; }
.mbtn:hover .mi { animation: wiggle .5s ease; }
@keyframes wiggle { 25% { transform: rotate(-12deg) scale(1.1); } 75% { transform: rotate(10deg) scale(1.1); } }
.menu-row { display: flex; gap: 10px; }
.menu-row .btn { flex: 1; font-size: 16px; padding: 9px 10px; color: #fff; background: linear-gradient(#56628f, #333e68 50%, #232c50); box-shadow: inset 0 2px 0 rgba(255,255,255,.25), 0 5px 0 #0d1330, 0 8px 14px rgba(0,0,0,.4); text-shadow: 0 1px 0 #000; }
.foot { position: absolute; top: 12px; left: 14px; font-size: 12px; color: rgba(255,255,255,.55); text-shadow: 0 1px 2px #000; z-index: 1; }
.ver { display: inline-block; padding: 1px 7px; margin-right: 4px; border-radius: 6px; background: rgba(255,210,63,.18); color: var(--gold); border: 1px solid rgba(255,210,63,.4); }
@keyframes logoIn { from { transform: scale(.4) translateY(-40px); opacity: 0; } }
@keyframes fadeUp { from { transform: translateY(30px); opacity: 0; } }
@keyframes shine { 0% { background-position: 150% 0; } 60%, 100% { background-position: -50% 0; } }

/* ---------- 로비 ---------- */
#scr-lobby, #scr-onlineLobby, #scr-online, #scr-result { background: radial-gradient(ellipse at 50% 30%, rgba(20,30,70,.45), rgba(5,8,20,.75)); backdrop-filter: blur(3px); }
.gfx-low #scr-lobby, .gfx-low #scr-onlineLobby, .gfx-low #scr-online, .gfx-low #scr-result { backdrop-filter: none; }
.panel.lobby { width: min(1240px, 100%); max-height: 100%; overflow: auto; padding: 14px 16px; }
.lobby-h { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-bottom: 12px; gap: 10px; position: relative; }
.lobby-h > :first-child { justify-self: start; }
.lobby-h > :last-child { justify-self: end; }
.lobby-tip { color: var(--muted); font-size: 14px; }
.roomcode { display: flex; align-items: center; gap: 10px; }
.roomcode small { color: var(--muted); font-size: 14px; }
.roomcode .code, .lobby-h .code { display: inline-block; padding: 2px 18px; border-radius: 12px; background: linear-gradient(#0a1024, #111a3a); border: 3px solid #3a4a80; color: #7ee0ff;
  font-family: var(--kr); font-size: 34px; letter-spacing: 10px; cursor: pointer; text-shadow: 0 0 14px rgba(126,224,255,.75); box-shadow: inset 0 3px 8px rgba(0,0,0,.5), 0 0 0 2px rgba(126,224,255,.15); transition: transform .15s; }
.roomcode .code:hover { transform: scale(1.05); }
.roomcode .code.copied { border-color: #4bdc72; color: #b8ffc9; }
.cnt { font-size: 20px; color: var(--muted); display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,.25); padding: 4px 12px; border-radius: 12px; }
.cnt b { color: #fff; font-size: 24px; }
.cnt-l { font-size: 14px; }
#net { width: 12px; height: 12px; border-radius: 50%; background: #666; display: inline-block; border: 2px solid rgba(0,0,0,.5); }
#net.ok { background: #4bdc72; box-shadow: 0 0 8px #4bdc72; animation: pulseDot 2s infinite; }
#net.bad { background: #ff5252; box-shadow: 0 0 8px #ff5252; animation: blink 1s infinite; }
@keyframes pulseDot { 50% { box-shadow: 0 0 2px #4bdc72, 0 0 0 5px rgba(75,220,114,.15); } }

.slots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.slot { position: relative; border-radius: 16px; padding: 10px; border: 3px solid var(--line); overflow: hidden;
  background: linear-gradient(180deg, color-mix(in srgb, var(--pc) 32%, #1a2344) 0%, #151d3a 40%, #111831 100%);
  box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--pc) 45%, transparent), inset 0 2px 0 rgba(255,255,255,.15), 0 6px 0 rgba(0,0,0,.35);
  display: flex; flex-direction: column; gap: 7px; animation: slotIn .35s both; }
.slot::before { content: ''; position: absolute; left: -30%; top: -40px; width: 160%; height: 90px; background: radial-gradient(ellipse, color-mix(in srgb, var(--pc) 35%, transparent), transparent 70%); pointer-events: none; }
.slot > * { position: relative; }
.slots > :nth-child(2) { animation-delay: .05s; } .slots > :nth-child(3) { animation-delay: .1s; } .slots > :nth-child(4) { animation-delay: .15s; }
@keyframes slotIn { from { opacity: 0; transform: translateY(12px); } }
.slot.you { box-shadow: inset 0 0 0 2px var(--pc), 0 0 24px color-mix(in srgb, var(--pc) 55%, transparent), 0 6px 0 rgba(0,0,0,.35); }
.slot.you::after { content: 'YOU'; position: absolute; top: 12px; right: -24px; transform: rotate(40deg); background: var(--pc); color: #111; font-size: 11px; padding: 1px 26px; letter-spacing: 2px; }
.slot.empty { background: repeating-linear-gradient(135deg, #141b33 0 12px, #10162b 12px 24px); min-height: 240px; animation: none; }
.slot.empty::before { display: none; }
.slot-h { display: flex; align-items: center; gap: 7px; min-height: 30px; }
.slot-h .pn { font-family: var(--kr); background: linear-gradient(color-mix(in srgb, var(--pc) 70%, #fff), var(--pc)); color: #111; border-radius: 8px; padding: 1px 9px; font-size: 18px; box-shadow: 0 3px 0 var(--pd); border: 2px solid rgba(0,0,0,.5); }
.slot-h .chip { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, var(--pc) 45%, var(--pd)); border: 2px solid #000; }
.slot-h em { font-style: normal; color: var(--muted); font-size: 15px; flex: 1; }
.slot-h .kind { font-weight: normal; font-size: 13px; padding: 2px 8px; border-radius: 20px; background: rgba(255,255,255,.12); color: #dfe6ff; }
.slot-h .kind.cpu { background: rgba(160,120,255,.25); color: #d7c8ff; }
.slot-h .kind.you { background: var(--pc); color: #111; }
.slot-h .crown { font-weight: normal; font-size: 18px; filter: drop-shadow(0 2px 0 #000); animation: logoFloat 2s ease-in-out infinite; }
.slot-h .x { background: #3a1a26; color: #ff9aa9; border: 2px solid #000; border-radius: 8px; width: 28px; height: 28px; cursor: pointer; transition: background .1s; }
.slot-h .x:hover { background: #6a2030; color: #fff; }
.slot .nm, .slot .nm-in { font-size: 19px; color: #fff; background: rgba(0,0,0,.3); border-radius: 9px; padding: 4px 10px; border: 2px solid rgba(255,255,255,.08); width: 100%; font-family: inherit; min-height: 34px; }
.slot .nm-in:focus { outline: none; border-color: var(--pc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pc) 30%, transparent); }
.tsel { display: grid; grid-template-columns: 26px minmax(0, 1fr) 26px; align-items: center; gap: 4px; }
.pv { position: relative; border-radius: 14px; overflow: hidden; border: 2px solid rgba(0,0,0,.5); aspect-ratio: 16/10;
  background: radial-gradient(ellipse at 50% 100%, color-mix(in srgb, var(--pc) 40%, transparent), transparent 65%),
              radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.12), transparent 60%), linear-gradient(#2c3b6c, #121936);
  box-shadow: inset 0 0 18px rgba(0,0,0,.5); }
.pv::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px); background-size: 16px 16px; }
.pv canvas.tprev { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.pv-idx { position: absolute; left: 0; right: 0; bottom: 5px; display: flex; justify-content: center; gap: 4px; }
.pv-idx i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.25); }
.pv-idx i.on { background: var(--pc); box-shadow: 0 0 6px var(--pc); width: 14px; border-radius: 4px; }
.pv-hp { position: absolute; left: 6px; top: 5px; font-size: 11px; color: #cfe; background: rgba(0,0,0,.45); padding: 1px 7px; border-radius: 8px; }
.pv-hp b { color: #fff; font-weight: normal; }
.dice { position: absolute; right: 5px; top: 5px; width: 30px; height: 30px; border-radius: 9px; border: 2px solid #000; background: linear-gradient(#fff, #d8def0); font-size: 16px; cursor: pointer;
  box-shadow: 0 3px 0 #000; transition: transform .15s; padding: 0; }
.dice:hover { transform: rotate(-20deg) scale(1.1); }
.dice:active { transform: rotate(180deg) scale(.9); }
.arr { height: 52px; padding: 0; border-radius: 10px; border: 2px solid #000; background: linear-gradient(#4b5c99, #253159); color: #fff; font-size: 13px; cursor: pointer; box-shadow: inset 0 2px 0 rgba(255,255,255,.2), 0 3px 0 #000; }
.arr:hover { background: linear-gradient(color-mix(in srgb, var(--pc) 70%, #fff), var(--pd)); }
.arr:active { transform: scale(.92) translateY(2px); box-shadow: none; }
.tname { font-family: var(--kr); font-size: 23px; text-align: center; color: #fff; text-shadow: 0 2px 0 #000, 0 0 12px color-mix(in srgb, var(--pc) 50%, transparent); line-height: 1; }
.tname small { font-family: 'Jua', sans-serif; font-size: 12px; color: var(--pl, var(--pc)); letter-spacing: 3px; }
.tinfo { display: grid; grid-template-columns: 118px minmax(0, 1fr); align-items: center; gap: 6px; background: rgba(0,0,0,.2); border-radius: 12px; padding: 2px 8px 2px 2px; }
canvas.radar { width: 118px; height: 101px; display: block; }
.tdesc { font-size: 13px; color: #b9c4e4; line-height: 1.35; }
.wcards { display: flex; flex-direction: column; gap: 4px; }
.wc { display: flex; align-items: center; gap: 7px; padding: 4px 7px; border-radius: 10px; background: linear-gradient(90deg, rgba(0,0,0,.32), rgba(0,0,0,.15)); border: 1px solid rgba(255,255,255,.06); }
.wc .wk { flex: none; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 7px; background: #2d3a66; font-size: 13px; color: #fff; border: 1px solid rgba(0,0,0,.6); }
.wc .wm { min-width: 0; flex: 1; }
.wc .wm > b { display: block; font-weight: normal; font-size: 14px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wt { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 1px; }
.wt em { font-style: normal; font-size: 11px; color: #ffd9a8; }
.wt em small { font-size: 10px; opacity: .8; }
.wt em.rd { color: #a8d8ff; }
.tg { font-style: normal; font-size: 10px; padding: 0 5px; border-radius: 6px; background: rgba(255,255,255,.1); color: #dfe6ff; line-height: 15px; }
.tg.wind { background: rgba(120,220,255,.18); color: #9fe6ff; } .tg.pierce { background: rgba(210,77,255,.2); color: #e9b5ff; }
.tg.split { background: rgba(255,157,26,.2); color: #ffc98a; } .tg.home { background: rgba(255,82,82,.2); color: #ffb0b0; }
.tg.ice { background: rgba(143,227,255,.2); color: #c8f2ff; } .tg.sp { background: rgba(255,210,63,.25); color: #ffe89a; }
.wc.ss { background: linear-gradient(90deg, rgba(255,190,40,.28), rgba(255,120,20,.08)); border-color: rgba(255,210,63,.45); box-shadow: inset 0 0 12px rgba(255,210,63,.12); position: relative; overflow: hidden; }
.wc.ss .wk { background: linear-gradient(#ffe066, #ff9d1a); color: #3a2400; font-family: var(--kr); font-size: 11px; }
.wc.ss .wm > b { color: var(--gold); }
.wc.ss::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 40%, rgba(255,255,255,.18) 50%, transparent 60%); background-size: 250% 100%; animation: shine 3s infinite; pointer-events: none; }
.gfx-low .wc.ss::after { animation: none; }
.teams { display: flex; gap: 4px; }
.tb { flex: 1; border: 2px solid #000; border-radius: 8px; padding: 4px; background: #222b4a; color: #aab; cursor: pointer; font-size: 14px; }
.tb.on { background: var(--tc); color: #111; box-shadow: 0 0 10px color-mix(in srgb, var(--tc) 60%, transparent); }
