<script>
/* =========================================================
 *  Game: 게임 상태, 턴 진행, 입력, 로컬/온라인 백엔드, CPU AI,
 *        아이템 · 감정표현 · 기분(mood) · 전적(stats)
 * ========================================================= */

const G = {
  canvas: null, ctx: null, dpr: 1, scale: 1, ox: 0, oy: 0,
  screen: 'title', attract: false, silent: false,
  seed: 0, themeId: 'grass', theme: THEMES.grass, teamMode: false, beginner: false,
  players: [], terrain: null, painter: null, bg: null, heights: null,
  clouds: [], ambient: [], fx: null,
  queue: [], log: [], busy: false, anim: null, turn: null, ctl: null, backend: null,
  live: null, playedTurns: new Set(), wind: 0, t: 0, lastTime: 0, endInfo: null, endT: 0,
  needResync: false, lastConfig: null, turnOrder: []
};

/* ---------------- 입력 ---------------- */
const Input = { left: false, right: false, up: false, down: false, fire: false };
const KEYMAP = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', Space: 'fire', ' ': 'fire' };

function setupInput() {
  window.addEventListener('keydown', e => {
    Sound.init();
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
    const k = KEYMAP[e.code] || KEYMAP[e.key];
    if (k && G.screen === 'play') { Input[k] = true; e.preventDefault(); }
    if (G.screen === 'play') {
      if (e.key === '1' || e.key === 'q' || e.key === 'Q') selectWeapon(0);
      if (e.key === '2' || e.key === 'w' || e.key === 'W') selectWeapon(1);
      if (e.key === '3' || e.key === 'e' || e.key === 'E') selectWeapon(2);
      if (e.key === 'Tab' || e.key === 'p' || e.key === 'P') { e.preventDefault(); skipMyTurn(); }
      if (e.key === 'Escape' && cancelCharge()) e.preventDefault();
      const ik = ['4', '5', '6'].indexOf(e.key);
      if (ik >= 0 && !e.repeat) selectItem(ITEM_IDS[ik]);
      const ek = ['7', '8', '9', '0'].indexOf(e.key);
      if (ek >= 0 && !e.repeat) sendEmote(ek);
    }
  });
  window.addEventListener('keyup', e => {
    const k = KEYMAP[e.code] || KEYMAP[e.key];
    if (k) Input[k] = false;
  });
  window.addEventListener('blur', () => { for (const k in Input) Input[k] = false; });
  document.addEventListener('pointerdown', () => Sound.init(), { once: false });
  $$('[data-touch]').forEach(b => {
    const k = b.dataset.touch;
    const on = e => { e.preventDefault(); Input[k] = true; b.classList.add('on'); Sound.init(); };
    const off = e => { e.preventDefault(); Input[k] = false; b.classList.remove('on'); };
    b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointerleave', off); b.addEventListener('pointercancel', off);
  });
  // 힘 채우기 취소 버튼 (터치): 발사 버튼을 누른 채 다른 손가락으로 누른다
  $$('[data-cancel]').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); Sound.init(); cancelCharge(); }));
}

/* ---------------- 백엔드: 로컬 (한 PC에서 여럿 + CPU) ---------------- */
class LocalBackend {
  constructor(config) {
    this.local = true;
    this.players = config.players.map(p => Object.assign({}, p, { alive: true, delay: Math.floor(Math.random() * 60), lastTurn: -1 }));
    this.teamMode = config.teamMode; this.turnNo = 0; this.ended = false;
    this.beginner = config.beginner === true;   // 비기너 모드 (바람 ±2, 규칙은 start 이벤트로 전파)
    const theme = config.theme === 'random' ? THEME_IDS[Math.floor(Math.random() * THEME_IDS.length)] : config.theme;
    G.queue.push({ type: 'start', seed: Math.floor(Math.random() * 2147483647), theme, teamMode: config.teamMode, beginner: this.beginner,
      players: this.players.map(p => ({ id: p.id, name: p.name, tank: p.tank, team: config.teamMode ? p.team : 0, slot: p.slot, cpu: p.cpu })) });
    this.nextTurn();
  }
  controls(p) { return true; }
  side(p) { return this.teamMode && p.team ? 'T' + p.team : p.id; }
  nextTurn() {
    const alive = this.players.filter(p => p.alive);
    alive.sort((a, b) => (a.delay - b.delay) || (a.lastTurn - b.lastTurn) || (a.slot - b.slot));
    this.turnNo++;
    const windMax = (this.beginner ? RULES_BEGINNER : RULES_NORMAL).windMax;
    G.queue.push({ type: 'turn', pid: alive[0].id, no: this.turnNo, wind: Math.round((Math.random() * 2 - 1) * windMax), order: alive.map(p => p.id) });
  }
  checkEnd() {
    const sides = new Set(this.players.filter(p => p.alive).map(p => this.side(p)));
    if (sides.size > 1) return false;
    const k = [...sides][0];
    G.queue.push({ type: 'end', winners: this.players.filter(p => this.side(p) === k).map(p => p.id) });
    this.ended = true;
    return true;
  }
  submitShot(actor, no, params, result) {
    G.queue.push({ type: 'shot', pid: actor, no, params, result });
    const a = this.players.find(p => p.id === actor);
    result.players.forEach(rp => { const p = this.players.find(q => q.id === rp.id); p.alive = rp.alive; p.delay += Math.min(400, rp.freeze || 0); });
    a.delay += params.delayAdd; a.lastTurn = no;
    if (!this.checkEnd()) this.nextTurn();
  }
  skip(actor, no, pos) {
    G.queue.push({ type: 'skip', pid: actor, no, pos });
    const a = this.players.find(p => p.id === actor);
    a.delay += SKIP_DELAY; a.lastTurn = no;
    if (!this.checkEnd()) this.nextTurn();
  }
  sendLive() { }
  emote(p, i) { applyEmote(p.id, i); return true; }
  leave() { }
}

/* ---------------- 백엔드: 온라인 (Google Apps Script) ---------------- */
const Net = {
  available() { return !!(window.google && google.script && google.script.run); },
  call(fn, ...args) {
    return new Promise((res, rej) => {
      google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(e && e.message ? e : new Error(String(e))))[fn](...args);
    });
  }
};

class OnlineBackend {
  constructor(sess) {
    this.local = false; this.code = sess.code; this.pid = sess.pid; this.token = sess.token;
    this.since = 0; this.room = null; this.inflight = false; this.stopped = false; this.lastLive = 0; this.liveKey = '';
    this.poll();
  }
  /** 방 정보. 다른 곳(방장의 hostUpdate 응답 등)이 B.room = ... 으로 갱신하면 세대(roomEpoch)가 올라가서,
   *  그보다 먼저 보낸 낡은 폴링 응답이 나중에 도착해도 방 정보를 되돌리지 못한다. */
  get room() { return this._room; }
  set room(v) { this._room = v; this.roomEpoch = (this.roomEpoch || 0) + 1; }
  controls(p) { return p.id === this.pid || (p.cpu && this.room && this.room.hostId === this.pid); }
  isHost() { return this.room && this.room.hostId === this.pid; }
  poll() {
    if (this.stopped) return;
    if (this.inflight) return;
    this.inflight = true;
    const epoch = this.roomEpoch;
    Net.call('poll', this.code, this.pid, this.token, this.since).then(res => {
      if (this.roomEpoch === epoch) this._room = res.room;   // 이 폴링을 보낸 뒤 방 정보가 이미 더 새 값으로 바뀌었으면 (낡은 스냅샷) 덮어쓰지 않음
      for (const ev of res.events) {
        if (ev.i !== this.since) break;
        this.since = ev.i + 1;
        // 감정표현은 포격 애니메이션 뒤에 줄 세우지 않고 바로 표시 (로그에도 넣지 않음)
        if (ev.type === 'emote') { if (ev.from !== this.pid && G.screen === 'play') applyEmote(ev.pid, ev.i); continue; }
        G.queue.push(ev);
      }
      G.live = res.live;
      if (G.screen === 'onlineLobby') renderOnlineLobby();
      setNetStatus(true);
    }).catch(e => {
      setNetStatus(false, e.message);
      if (/인증|찾을 수 없/.test(e.message)) { this.stopped = true; toast(e.message); }
    }).finally(() => {
      this.inflight = false;
      if (!this.stopped) setTimeout(() => this.poll(), G.screen === 'play' ? 800 : 1300);
    });
  }
  async send(fn, ...args) {
    for (let i = 0; i < 3; i++) {
      try { return await Net.call(fn, this.code, this.pid, this.token, ...args); }
      catch (e) { if (i === 2) throw e; await new Promise(r => setTimeout(r, 700 * (i + 1))); }
    }
  }
  submitShot(actor, no, params, result) {
    this.send('submit', { type: 'shot', actor, no, params, result }).then(r => { if (!r.ok) { toast('서버가 이 포격을 거절했습니다. 동기화합니다.'); G.needResync = true; } })
      .catch(e => { toast('전송 실패: ' + e.message); G.needResync = true; });
  }
  skip(actor, no, pos) { this.send('submit', { type: 'skip', actor, no, pos }).catch(e => toast('전송 실패: ' + e.message)); }
  sendLive(data) {
    const now = performance.now(), key = JSON.stringify(data);
    if (now - this.lastLive < 350 || key === this.liveKey) return;
    this.lastLive = now; this.liveKey = key;
    Net.call('sendLive', this.code, this.pid, this.token, data).catch(() => { });
  }
  emote(p, i) {
    // 즉시 내 화면에 표시하고 서버로 전달 (서버 에코는 from 으로 걸러냄)
    applyEmote(p.id, i);
    Net.call('emote', this.code, this.pid, this.token, i, p.id).catch(() => { });
    return true;
  }
  leave() { this.stopped = true; Net.call('leaveRoom', this.code, this.pid, this.token).catch(() => { }); }
}

/* ---------------- 매치 초기화 ---------------- */
function initMatch(ev) {
  // 규칙은 지형/탱크를 만들기 전에 (모든 클라이언트가 start 이벤트에서 똑같이 얻는다 — 재동기화 때도 동일)
  G.beginner = ev.beginner === true;
  setRules(G.beginner);
  G.seed = ev.seed; G.themeId = ev.theme; G.theme = THEMES[ev.theme]; G.teamMode = ev.teamMode;
  const gen = genTerrain(ev.seed);
  G.heights = gen.heights;
  G.terrain = new TerrainMask(gen.mask);
  G.painter = new TerrainPainter(gen.mask, gen.heights, ev.theme, ev.seed);
  G.terrain.painter = G.painter;
  G.bg = buildBackground(ev.theme, ev.seed);
  G.fx = new Effects(G);
  makeClouds();
  const xs = spawnXs(ev.seed, ev.players.length);
  G.players = ev.players.map((sp, i) => {
    const x = xs[i], y = Math.round(gen.heights[x]), T = TANKS[sp.tank];
    return {
      id: sp.id, name: sp.name, tank: sp.tank, team: sp.team || 0, slot: sp.slot, cpu: !!sp.cpu, pc: PCOLORS[sp.slot % 4],
      x, y, vy: 0, facing: x < W / 2 ? 1 : -1, angle: 45, hp: T.hp, maxHp: T.hp, hpShow: T.hp, alive: true, sunk: false,
      ss: 0, freeze: 0, falling: false, fallFrom: y, dealt: 0, totalDealt: 0, tread: 0, recoil: 0, hurtT: 0, frozenT: 0,
      seedOff: i * 1.37, lastPower: null, left: false,
      mood: null, moodT: 0, movingT: 0, emote: null, emoteAt: -99,
      items: startItems(), stats: newStats()
    };
  });
  G.anim = null; G.turn = null; G.ctl = null; G.busy = false; G.playedTurns = new Set(); G.endInfo = null; G.live = null;
  G.turnOrder = [];
  G.startEv = ev;
  if (!G.attract && Sound.setAmbient) Sound.setAmbient(G.themeId);
}

function newStats() { return { shots: 0, hits: 0, kills: 0, maxHit: 0, dealt: 0, taken: 0, heals: 0, items: 0 }; }

/** 포격 한 번의 결과 요약 (params + result 만 사용 → 모든 클라이언트 동일) */
function shotSummary(params, result, aliveBefore) {
  const sh = findPlayer(params.pid);
  const S = { shooter: sh, kills: [], victims: [], dealt: 0, enemyHit: false, selfHit: 0, item: validItem(params.item) };
  if (S.item === 'dual' && sh && TANKS[sh.tank].weapons[params.weapon].ss) S.item = null;
  result.players.forEach(rp => {
    const q = findPlayer(rp.id);
    if (!q) return;
    const taken = rp.taken || 0;
    if (q === sh) { S.dealt = rp.dealt || 0; S.selfHit = taken; }
    else if (taken > 0) { S.victims.push(q); if (sh && isEnemy(sh, q)) S.enemyHit = true; }
    if (q !== sh && aliveBefore[q.id] && !rp.alive && sh && isEnemy(sh, q)) S.kills.push(q);
  });
  return S;
}

/** 전적 + 아이템 개수 반영 (playShot 이후 finishShot, resyncFromLog 에서 호출) */
function applyShotStats(params, result, S) {
  const sh = S.shooter;
  if (sh) {
    const st = sh.stats;
    st.shots++; if (S.enemyHit) st.hits++;
    st.kills += S.kills.length; st.dealt += S.dealt; st.maxHit = Math.max(st.maxHit, S.dealt);
    if (S.item) st.items++;
    if (S.item === 'heal') st.heals++;
  }
  result.players.forEach(rp => { const q = findPlayer(rp.id); if (q) q.stats.taken += rp.taken || 0; });
}

/** 아이템 소모 (쏜 순간 모두에게 동일하게) */
function consumeItem(params) {
  const sh = findPlayer(params.pid), id = validItem(params.item);
  if (!sh || !id) return;
  if (id === 'dual' && TANKS[sh.tank].weapons[params.weapon].ss) return;
  if (sh.items[id] > 0) sh.items[id]--;
}

function aliveMap() { const m = {}; G.players.forEach(p => m[p.id] = p.alive); return m; }

function findPlayer(id) { return G.players.find(p => p.id === id); }

function rebuildTerrain(ops) {
  const gen = genTerrain(G.seed);
  G.terrain = new TerrainMask(gen.mask);
  G.painter = new TerrainPainter(gen.mask, gen.heights, G.themeId, G.seed);
  G.terrain.painter = G.painter;
  ops.forEach(op => G.terrain.apply(op));
}

function applyResult(result) {
  result.players.forEach(rp => {
    const p = findPlayer(rp.id);
    if (!p) return;
    p.x = rp.x; p.y = rp.y; p.hp = rp.hp; p.alive = rp.alive && !p.left; p.sunk = rp.sunk; p.ss = rp.ss;
    p.vy = 0; p.falling = false;
  });
}

function opsEqual(a, b) {
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) {
    if (a[i][0] !== b[i][0] || Math.abs(a[i][1] - b[i][1]) > 1 || Math.abs(a[i][2] - b[i][2]) > 1 || a[i][3] !== b[i][3]) return false;
  }
  return true;
}

/** 로그를 처음부터 다시 적용해 상태를 맞춤 (서버 거절 등 비상시) */
function resyncFromLog() {
  const start = G.log.find(e => e.type === 'start');
  if (!start) return;
  const turnEv = G.turn;
  initMatch(start);
  const ops = [];
  for (const ev of G.log) {
    if (ev.type === 'shot') {
      ev.result.ops.forEach(o => ops.push(o));
      const sp = findPlayer(ev.pid); if (sp) { sp.facing = ev.params.facing; sp.angle = ev.params.angle; sp.lastPower = ev.params.power; }
      const before = aliveMap();
      consumeItem(ev.params);
      applyResult(ev.result);
      applyShotStats(ev.params, ev.result, shotSummary(ev.params, ev.result, before));
      ev.result.players.forEach(rp => { const p = findPlayer(rp.id); if (p) p.totalDealt += rp.dealt || 0; });
    } else if (ev.type === 'leave') { const p = findPlayer(ev.pid); if (p) { p.left = true; p.alive = false; } }
    if (ev.type === 'turn') { G.playedTurns.add(ev.no - 1); G.turnOrder = (ev.order || [ev.pid]).slice(); }
  }
  rebuildTerrain(ops);
  G.players.forEach(p => p.hpShow = p.hp);
  if (turnEv) G.turn = Object.assign({}, turnEv);
  G.ctl = null;
  toast('게임 상태를 다시 동기화했습니다.');
}

/* ---------------- 이벤트 처리 ---------------- */
function pumpEvents() {
  while (!G.busy && G.queue.length) {
    const ev = G.queue.shift();
    if (G.needResync && ev.type !== 'start') { G.needResync = false; G.log.push(ev); resyncFromLog(); G.log.pop(); }
    if (ev.type === 'emote') { applyEmote(ev.pid, ev.i); continue; }
    if (ev.type !== 'start') G.log.push(ev);
    handleEvent(ev);
  }
  if (G.needResync && !G.busy && !G.queue.length && G.log.length) { G.needResync = false; resyncFromLog(); }
}

function handleEvent(ev) {
  switch (ev.type) {
    case 'start':
      G.log = [ev];
      initMatch(ev);
      assistCall('reset');
      if (!G.attract) showScreen('play');
      banner(THEMES[ev.theme].name + ' 맵', (G.teamMode ? '팀전 시작!' : '개인전 시작!') + (G.beginner ? ' · 🐣 비기너 모드' : ''));
      G.busy = true;
      { const tok = G.startEv; setTimeout(() => { if (G.startEv === tok) G.busy = false; }, G.attract ? 300 : 1400); }
      break;
    case 'turn': beginTurn(ev); break;
    case 'shot': {
      const p = findPlayer(ev.pid);
      if (G.turn && G.turn.no === ev.no) G.turn.done = true;
      if (G.playedTurns.has(ev.no)) {
        // 내가 쏜 포격: 이미 재생했음 → 결과만 확인
        if (!G.anim) { if (!opsEqual(G.terrain.ops.slice(-ev.result.ops.length), ev.result.ops)) G.needResync = true; }
        break;
      }
      if (G.ctl && G.ctl.pid === ev.pid) G.ctl = null;
      if (p) playShot(ev.params, ev.result);
      break;
    }
    case 'skip': {
      const p = findPlayer(ev.pid);
      if (G.turn && G.turn.no === ev.no) G.turn.done = true;
      if (G.ctl && G.ctl.pid === ev.pid) { G.ctl = null; Sound.moving(false); }
      // 이동 후 턴을 넘긴 경우: 최종 위치를 모두가 똑같이 맞춤
      if (p && ev.pos && isFinite(ev.pos.x) && isFinite(ev.pos.y)) {
        p.x = clamp(+ev.pos.x, 18, W - 18); p.y = +ev.pos.y; p.facing = ev.pos.facing === -1 ? -1 : 1; p.angle = clamp(+ev.pos.angle || 0, 0, 90);
      }
      if (p && !G.playedTurns.has(ev.no)) toast(`${p.name}: ${ev.reason === 'away' ? '응답 없음' : '시간 초과'} → 턴 넘김`);
      else if (p) toast(`${p.name}: 턴 넘김`);
      break;
    }
    case 'leave': {
      const p = findPlayer(ev.pid);
      if (p) { p.left = true; p.alive = false; toast(`${p.name} 님이 나갔습니다.`); G.turnOrder = G.turnOrder.filter(id => id !== p.id); }
      break;
    }
    case 'end': endMatch(ev); break;
  }
}

function beginTurn(ev) {
  G.wind = ev.wind;
  const p = findPlayer(ev.pid);
  G.turn = { pid: ev.pid, no: ev.no, wind: ev.wind, timeLeft: RULES.turnTime };
  G.turnOrder = (Array.isArray(ev.order) && ev.order.length ? ev.order : [ev.pid]).filter(id => { const q = findPlayer(id); return q && q.alive; });
  G.ctl = null;
  if (!G.attract && Sound.setWind) Sound.setWind(ev.wind);
  if (!p) return;
  if (G.backend.controls(p)) {
    const w = TANKS[p.tank];
    G.ctl = { pid: p.id, weapon: 0, power: 0, charging: false, fuel: w.fuel, fuelUsed: 0, delayT: G.attract ? 0.3 : 0.9, done: false,
              ai: p.cpu ? { phase: 'think', t: rand(0.5, 1.1) } : null, lastTick: 99, item: null, warned: false };
  }
  const mine = G.ctl && !p.cpu;
  if (mine) assistCall('onTurn', p, G.ctl);
  pilotSay(p, 'turn', ev.no * 13 + 1, 0.45);
  if (!G.attract) {
    Sound.play(mine ? 'myturn' : 'turn');
    banner(mine ? (G.backend.local && humanCount() > 1 ? `${p.name}의 차례!` : '내 차례!') : `${p.name}의 차례`, `바람 ${windText(ev.wind)}`, p.pc.c);
  }
  updateHud(true);
}

/** 조준 도우미 훅 (Assist.html). 없거나 예외가 나도 게임 루프는 멈추지 않는다. */
let assistBroken = false;
function assistCall(name, ...args) {
  if (assistBroken || typeof Assist === 'undefined' || !Assist || typeof Assist[name] !== 'function') return;
  try { Assist[name](...args); }
  catch (e) { assistBroken = true; console.error('Assist.' + name + ' 오류 — 조준 도우미를 끕니다', e); try { Assist.level = 0; } catch (_) { /* 무시 */ } }
}

function humanCount() { return G.players.filter(p => !p.cpu).length; }
function windText(w) { return w === 0 ? '없음' : (w < 0 ? '◀ ' : '') + Math.abs(w) + (w > 0 ? ' ▶' : ''); }

/* ---------------- 포격 재생 ---------------- */
function playShot(params, result) {
  const p = findPlayer(params.pid);
  p.x = params.x; p.y = params.y; p.facing = params.facing; p.angle = params.angle; p.lastPower = params.power;
  G.players.forEach(q => { q.freeze = 0; q.dealt = 0; q.taken = 0; q.healed = 0; q.vy = 0; q.falling = false; q.fallFrom = q.y; });
  const world = makeWorld(G.terrain, G.players, params.wind, params.seed, G.fx);
  G.anim = { world, params, result, opsStart: G.terrain.ops.length, acc: 0, settleT: 0, t: 0, alive: aliveMap() };
  G.busy = true;
  const w = TANKS[p.tank].weapons[params.weapon];
  let item = validItem(params.item);
  if (item === 'dual' && w.ss) item = null;
  consumeItem(params);
  if (w.ss && !G.attract) { Sound.play('ss'); banner('SS ' + w.name + '!', p.name, '#ffd23f'); }
  else if (item && !G.attract) { const it = ITEMS[item]; Sound.play(item === 'heal' ? 'heal' : 'item'); toast(`${p.name}: ${it.icon} ${it.name}!`); }
  fireShot(world, params.pid, params.weapon, params.angle, params.power, params.item);
}

function updateAnim(dt) {
  const A = G.anim;
  A.acc += Math.min(dt, 0.05); A.t += dt;
  while (A.acc >= SIM_DT) { stepWorld(A.world, SIM_DT); A.acc -= SIM_DT; }
  if (worldSettled(A.world) && A.world.t > 0.2) {
    A.settleT += dt;
    if (A.settleT > 0.9) finishShot();
  } else if (A.t > 40) finishShot();
}

function finishShot() {
  const A = G.anim; G.anim = null;
  const local = G.terrain.ops.slice(A.opsStart);
  if (!opsEqual(local, A.result.ops)) {
    const base = G.terrain.ops.slice(0, A.opsStart);
    rebuildTerrain(base.concat(A.result.ops));
  }
  applyResult(A.result);
  A.result.players.forEach(rp => { const p = findPlayer(rp.id); if (p) p.totalDealt += rp.dealt || 0; });
  const S = shotSummary(A.params, A.result, A.alive);
  applyShotStats(A.params, A.result, S);
  reactToShot(S);
  G.busy = false;
  updateHud(true);
}

/* ---------------- 기분(mood) & 감정표현 ---------------- */
function setMood(p, m, t) { if (p) { p.mood = m; p.moodT = t; } }

/**
 * 캐릭터 대사 말풍선 (화면 효과 전용). 확률과 대사 선택 모두 key 로 결정되므로
 * 온라인의 모든 클라이언트가 같은 순간 같은 대사를 본다. 진짜 이모트가 떠 있으면 덮어쓰지 않는다.
 */
function pilotSay(p, kind, key, prob) {
  if (!p || p.left || G.attract || typeof PILOTS === 'undefined' || !PILOTS[p.tank]) return;
  if (kind !== 'win' && !p.alive) return;
  if (p.emote && p.emote.i >= 0 && p.emote.t > 0.4) return;
  if (hash2(key | 0, (p.slot || 0) + 11, 57) >= prob) return;
  const text = pilotLine(p.tank, kind, key * 4 + (p.slot || 0));
  if (text) p.emote = { i: -1, text, icon: PILOTS[p.tank].icon, t: kind === 'win' ? 5 : 2.6, say: kind };
}

/** 포격 결과에 대한 반응: 쏜 사람 smug/happy/sad, 맞은 사람 angry, CPU 는 가끔 말풍선 */
function reactToShot(S) {
  const sh = S.shooter;
  S.victims.forEach(v => { if (v.alive) setMood(v, 'angry', 2.5); });
  if (sh && sh.alive) setMood(sh, S.kills.length ? 'smug' : S.enemyHit ? 'happy' : 'sad', 3);
  // 캐릭터 대사: 쏜 사람(명중/빗나감) + 가장 많이 맞은 사람
  const key = (G.turn ? G.turn.no : 0) * 13 + 5;
  if (sh) pilotSay(sh, S.kills.length || S.dealt >= 150 ? 'hit' : S.enemyHit ? 'hit' : 'miss', key, S.kills.length || S.dealt >= 150 ? 0.85 : 0.55);
  const vic = S.victims.filter(v => v !== sh && v.alive).sort((a, b) => (b.taken || 0) - (a.taken || 0))[0];
  if (vic) pilotSay(vic, 'hurt', key + 1, 0.6);
  if (G.screen !== 'play' && !G.attract) return;
  // CPU 말풍선 (내가 조종하는 CPU만 → 온라인에선 방장이 대표로 전송)
  const cpuSay = (p, i, prob) => { if (p && p.cpu && p.alive && G.backend.controls(p) && Math.random() < prob) setTimeout(() => emoteAs(p, i), 400 + Math.random() * 700); };
  if (sh && sh.cpu) {
    if (S.kills.length || S.dealt >= 250) cpuSay(sh, Math.random() < 0.5 ? 1 : 2, 0.55);
    else if (!S.enemyHit) cpuSay(sh, 3, 0.35);
  }
  const hurt = S.victims.filter(v => v.cpu && v !== sh);
  if (hurt.length) { const v = hurt[Math.floor(Math.random() * hurt.length)]; cpuSay(v, sh && sh.cpu ? 4 : (Math.random() < 0.5 ? 4 : 2), 0.3); }
}

/** 말풍선 표시 (모든 클라이언트, 화면 효과만) */
function applyEmote(pid, i) {
  const p = findPlayer(pid);
  i = Math.floor(+i);
  if (!p || !(i >= 0 && i < EMOTES.length) || p.left) return;
  p.emote = { i, text: EMOTES[i].text, icon: EMOTES[i].icon, t: EMOTE_TIME };
  p.emoteAt = G.t;
  if (!G.attract) Sound.play('emote');
}

/** p 로서 감정표현 보내기 (쿨다운 포함) */
function emoteAs(p, i) {
  if (!p || !G.backend || !G.players.length || G.players.indexOf(p) < 0) return false;
  if (G.endInfo && !G.backend.local) return false;
  if (!(i >= 0 && i < EMOTES.length)) return false;
  if (G.t - (p.emoteAt || -99) < EMOTE_GAP) return false;
  p.emoteAt = G.t;
  return G.backend.emote ? G.backend.emote(p, i) : false;
}

/** 사람 플레이어의 감정표현 (7/8/9/0 키, HUD 버튼) */
function sendEmote(i) {
  if (G.screen !== 'play' || !G.backend || !G.players.length) return;
  let p = null;
  if (G.backend.local) {
    const cp = curPlayer();
    p = cp && !cp.cpu && cp.alive ? cp : G.players.find(q => !q.cpu && q.alive) || G.players.find(q => !q.cpu);
  } else p = findPlayer(G.backend.pid);
  if (p) emoteAs(p, i);
}

/* ---------------- 조작 (사람 / CPU) ---------------- */
function curPlayer() { return G.turn ? findPlayer(G.turn.pid) : null; }

function selectWeapon(i) {
  const c = G.ctl, p = curPlayer();
  if (!c || !p || p.cpu || c.charging || c.done) return;
  if (i === 2 && p.ss < 100) { Sound.play('bounce'); toast('SS 게이지가 가득 차야 쓸 수 있습니다.'); return; }
  c.weapon = i;
  if (i === 2 && c.item === 'dual') { c.item = null; toast('필살기에는 듀얼을 쓸 수 없습니다.'); }
  Sound.play('click'); updateHud(true);
}

/** 아이템 선택/해제 (이번 턴에 하나만) */
function selectItem(id) {
  const c = G.ctl, p = curPlayer();
  if (!c || !p || p.cpu || c.charging || c.done || !ITEMS[id]) return;
  if (c.item === id) { c.item = null; Sound.play('click'); updateHud(true); return; }
  if (!p.items || !(p.items[id] > 0)) { Sound.play('bounce'); toast(`${ITEMS[id].name} 아이템을 다 썼습니다.`); return; }
  if (id === 'dual' && TANKS[p.tank].weapons[c.weapon].ss) { Sound.play('bounce'); toast('필살기에는 듀얼을 쓸 수 없습니다.'); return; }
  if (id === 'heal' && p.hp >= p.maxHp) { Sound.play('bounce'); toast('체력이 가득 차 있습니다.'); return; }
  c.item = id; Sound.play('select'); updateHud(true);
}

/** 힘 채우기 취소: 비기너 · 로컬 연습에서만 (온라인 일반 방은 원작대로 — 떼면 발사) */
function canCancelCharge() { return G.beginner === true || !!(G.backend && G.backend.local); }
/** 힘을 채우는 중에 잘못 눌렀을 때 (각도가 안 맞았거나 너무 세게 채웠을 때) 발사하지 않고 처음부터. Esc / 터치 ✋ 버튼 */
function cancelCharge() {
  const c = G.ctl, p = curPlayer();
  if (!c || !p || p.cpu || c.ai || c.done || !c.charging || G.busy || !canCancelCharge()) return false;
  c.charging = false; c.power = 0; c.lastChg = -1;
  if (Input.fire) c.fireHeld = true;           // 손가락/키를 뗄 때까지 다시 충전되지 않도록
  Sound.play('click'); toast('✋ 취소했어요! 다시 눌러서 힘을 채워요');
  updateHud(true);
  return true;
}

function skipMyTurn() {
  const c = G.ctl, p = curPlayer();
  if (!c || !p || p.cpu || c.done || c.charging || G.busy) return;
  doSkip();
}

function updateControl(dt) {
  if (!G.turn) return;
  if (!G.busy) G.turn.timeLeft -= dt;
  const c = G.ctl;
  if (!c || G.busy || c.done) return;
  const p = findPlayer(c.pid);
  if (!p || !p.alive) { G.ctl = null; return; }
  if (c.delayT > 0) { c.delayT -= dt; return; }
  if (c.ai) aiUpdate(c, p, dt); else humanUpdate(c, p, dt);
  if (!c.done && G.turn.timeLeft <= 0) { if (c.charging) doFire(); else doSkip(); }
  if (!c.done && !c.ai && !c.warned && G.turn.timeLeft <= 5) { c.warned = true; Sound.play('turnwarn'); }
  if (!c.done && !c.ai && G.turn.timeLeft < 5.5 && Math.ceil(G.turn.timeLeft) !== c.lastTick) { c.lastTick = Math.ceil(G.turn.timeLeft); Sound.play('tick'); }
  if (!c.done && !G.backend.local) {
    G.backend.sendLive({ actor: p.id, x: p.x, y: p.y, facing: p.facing, angle: Math.round(p.angle), weapon: c.weapon, power: c.charging ? Math.round(c.power) : 0, item: c.item || null });
  }
}

function walk(c, p, dir, dt) {
  if (c.fuel <= 0) { p.facing = dir; return false; }
  const d = moveTank(G.terrain.mask, p, dir, Math.min(3, 72 * dt));
  if (d > 0) { c.fuel = Math.max(0, c.fuel - d * 0.5); c.fuelUsed += d * 0.5; p.tread += d; p.movingT = 0.15; return true; }
  p.facing = dir;
  return false;
}

function humanUpdate(c, p, dt) {
  let moving = false;
  if ((Input.left || Input.right) && !(Input.left && Input.right) && !c.charging) moving = walk(c, p, Input.left ? -1 : 1, dt);
  Sound.moving(moving);
  if (Input.up || Input.down) {
    c.angHold = (c.angHold || 0) + dt;
    const sp = c.angHold < 0.35 ? 12 : 40;
    p.angle = clamp(p.angle + (Input.up ? 1 : -1) * sp * dt, 0, 90);
  } else { c.angHold = 0; }
  if (Input.fire && !c.charging && !c.fireHeld) { c.charging = true; c.power = 0; }
  if (!Input.fire) c.fireHeld = false;
  if (c.charging) {
    c.power += dt * RULES.chargeSpeed * assistChargeMul(c);
    if (Math.floor(c.power / 4) !== c.lastChg) { c.lastChg = Math.floor(c.power / 4); Sound.charge(c.power); }
    if (!Input.fire || c.power >= 100) { c.power = Math.min(100, c.power); doFire(); }
  }
}

/** 조준 도우미: 초록 구간 근처에서 힘 막대가 천천히 오르게 하는 배율 (도우미가 없거나 꺼져 있으면 1) */
function assistChargeMul(c) {
  try { return !assistBroken && typeof Assist !== 'undefined' && Assist && typeof Assist.chargeMul === 'function' ? Assist.chargeMul(c) : 1; }
  catch (e) { return 1; }
}

function doFire() {
  const c = G.ctl, p = findPlayer(c.pid), w = TANKS[p.tank].weapons[c.weapon];
  c.done = true; c.charging = false; Sound.moving(false);
  if (Input.fire) c.fireHeld = true;
  p.angle = Math.round(p.angle);
  let item = validItem(c.item);
  if (item && !(p.items && p.items[item] > 0)) item = null;
  if (item === 'dual' && w.ss) item = null;
  const params = {
    pid: p.id, weapon: c.weapon, angle: p.angle, power: Math.round(c.power * 10) / 10, x: p.x, y: p.y, facing: p.facing,
    wind: G.turn.wind, seed: Math.floor(Math.random() * 2147483647),
    delayAdd: w.delay + Math.round(c.fuelUsed * 2) + (item ? ITEMS[item].delay : 0), item
  };
  const result = simulateShot(G.terrain, G.players, params);
  const no = G.turn.no;
  G.playedTurns.add(no);
  G.ctl = null;
  G.backend.submitShot(p.id, no, params, result);
  playShot(params, result);
}

function doSkip() {
  const c = G.ctl, p = findPlayer(c.pid);
  c.done = true; c.charging = false; Sound.moving(false);
  G.playedTurns.add(G.turn.no);
  G.ctl = null;
  G.backend.skip(p.id, G.turn.no, { x: p.x, y: p.y, facing: p.facing, angle: Math.round(p.angle) });
}

/* ---------------- CPU AI ---------------- */
function isEnemy(a, b) { return a.id !== b.id && !(G.teamMode && a.team && a.team === b.team); }

function aiTraj(p, facing, angle, power, w) {
  const m = G.terrain.mask, q = { x: p.x, y: p.y, facing };
  const mz = muzzle(m, q, angle), a = angle * Math.PI / 180, sp = power / 100 * VMAX * (w.speedMul || 1);
  let x = mz.x, y = mz.y, vx = facing * Math.cos(a) * sp, vy = -Math.sin(a) * sp;
  const dt = 1 / 60, wm = w.windMul === undefined ? 1 : w.windMul, gm = w.gravMul || 1;
  for (let t = 0; t < 8; t += dt) {
    vx += G.wind * WIND_ACC * wm * dt; vy += GRAV * gm * dt; x += vx * dt; y += vy * dt;
    if (x < -300 || x > W + 300) return { x, y, miss: true };
    if (y > SEA) return { x, y: SEA, miss: true };
    if (t > 0.35) for (const o of G.players) if (o.alive && Math.hypot(x - o.x, y - o.y + 14) < RULES.hitR) return { x, y };
    if (isSolid(m, x, y)) return { x, y };
  }
  return { x, y, miss: true };
}

function aiPlanAim(p, wIdx) {
  const w = TANKS[p.tank].weapons[wIdx];
  const targets = G.players.filter(o => o.alive && isEnemy(p, o));
  let best = { score: 1e9, angle: 45, power: 60, facing: p.facing };
  for (const tg of targets) {
    const facing = tg.x >= p.x ? 1 : -1;
    for (let a = 12; a <= 86; a += 3) {
      for (let pw = 20; pw <= 100; pw += 2) {
        const l = aiTraj(p, facing, a, pw, w);
        let s = Math.hypot(l.x - tg.x, l.y - (tg.y - 8)) + tg.hp * 0.03 + (l.miss ? 300 : 0);
        if (Math.hypot(l.x - p.x, l.y - p.y) < (w.r || 30) + 30) s += 800;
        if (s < best.score) best = { score: s, angle: a, power: pw, facing };
      }
    }
  }
  // 최적 후보 주변 미세 조정
  const scoreOf = l => {
    let d = 1e9;
    for (const o of targets) d = Math.min(d, Math.hypot(l.x - o.x, l.y - (o.y - 8)) + o.hp * 0.03);
    if (l.miss) d += 300;
    if (Math.hypot(l.x - p.x, l.y - p.y) < (w.r || 30) + 30) d += 800;
    return d;
  };
  const b0 = best;
  for (let a = b0.angle - 2; a <= b0.angle + 2; a++) for (let pw = b0.power - 2; pw <= b0.power + 2; pw += 0.5) {
    if (a < 0 || a > 90 || pw < 5 || pw > 100) continue;
    const sc = scoreOf(aiTraj(p, b0.facing, a, pw, w));
    if (sc < best.score) best = { score: sc, angle: a, power: pw, facing: b0.facing };
  }
  const err = (G.attract ? 3 : 2.2) * RULES.aiErr;   // 비기너: CPU 는 봐주기 (오차 큼)
  best.angle = clamp(Math.round(best.angle + rand(-err, err) * 0.6), 0, 90);
  best.power = clamp(best.power + rand(-err, err), 5, 100);
  return best;
}

/** CPU 아이템 사용: 체력 40% 미만이면 회복, 조준이 좋으면 가끔 파워업/듀얼 */
function aiPickItem(p, wIdx, plan) {
  const it = p.items || {}, w = TANKS[p.tank].weapons[wIdx];
  if (it.heal > 0 && p.hp < p.maxHp * 0.4) return 'heal';
  if (plan.score < 45) {
    if (it.dual > 0 && !w.ss && Math.random() < 0.35) return 'dual';
    if (it.power > 0 && Math.random() < 0.45) return 'power';
  }
  return null;
}

function aiUpdate(c, p, dt) {
  const ai = c.ai;
  if (ai.phase === 'think') {
    ai.t -= dt;
    if (ai.t > 0) return;
    const T = TANKS[p.tank];
    if (p.ss >= 100 && Math.random() < 0.85) c.weapon = 2;
    else c.weapon = p.tank === 'ice' ? (Math.random() < 0.9 ? 0 : 1) : (Math.random() < 0.62 ? 0 : 1);
    ai.moveLeft = Math.random() < 0.45 ? rand(15, Math.min(90, T.fuel * 1.2)) : 0;
    ai.dir = Math.random() < 0.5 ? -1 : 1;
    ai.phase = 'move'; ai.stuck = 0;
  } else if (ai.phase === 'move') {
    if (ai.moveLeft > 0 && c.fuel > 0) {
      const x0 = p.x;
      const moved = walk(c, p, ai.dir, dt);
      ai.moveLeft -= Math.abs(p.x - x0);
      if (!moved && ++ai.stuck > 10) ai.moveLeft = 0;
      if (!G.silent) Sound.moving(moved && !G.attract);
      return;
    }
    Sound.moving(false);
    ai.plan = aiPlanAim(p, c.weapon);
    p.facing = ai.plan.facing;
    c.item = c.item || aiPickItem(p, c.weapon, ai.plan);
    ai.phase = 'aim';
  } else if (ai.phase === 'aim') {
    const d = ai.plan.angle - p.angle;
    if (Math.abs(d) < 0.6) { p.angle = ai.plan.angle; ai.phase = 'charge'; ai.t = rand(0.2, 0.5); return; }
    p.angle += Math.sign(d) * Math.min(Math.abs(d), 45 * dt);
  } else if (ai.phase === 'charge') {
    if (ai.t > 0) { ai.t -= dt; return; }
    c.charging = true;
    c.power = Math.min(ai.plan.power, c.power + dt * RULES.chargeSpeed);
    if (c.power >= ai.plan.power) doFire();
  }
}

/* ---------------- 원격 플레이어 실시간 이동 ---------------- */
function updateRemote(dt) {
  if (!G.turn || G.turn.done || G.ctl || G.busy || !G.live || G.backend.local) return;
  const L = G.live;
  if (L.actor !== G.turn.pid || L.no !== G.turn.no) return;
  const p = findPlayer(L.actor);
  if (!p || !p.alive) return;
  const dx = L.x - p.x;
  if (Math.abs(dx) > 0.8) {
    const before = p.x;
    moveTank(G.terrain.mask, p, Math.sign(dx), Math.min(Math.abs(dx), 72 * dt));
    p.tread += Math.abs(p.x - before);
    if (p.x !== before) p.movingT = 0.15;
    if (p.x === before && Math.abs(dx) > 3) { p.x = L.x; p.y = groundNear(G.terrain.mask, p.x, p.y); }
  } else p.facing = L.facing;
  p.angle += (L.angle - p.angle) * Math.min(1, dt * 10);
}

/* ---------------- 게임 종료 ---------------- */
function endMatch(ev) {
  G.endInfo = ev; G.turn = null; G.ctl = null; G.turnOrder = []; Sound.moving(false);
  // 승자는 우쭐, 나머지는 시무룩 / 로컬 CPU 는 GG
  G.players.forEach(p => {
    setMood(p, ev.winners.indexOf(p.id) >= 0 ? 'smug' : 'sad', 6);
    if (ev.winners.indexOf(p.id) >= 0) pilotSay(p, 'win', 777 + (p.slot || 0), 1);
    if (G.backend.local && p.cpu && !p.left && Math.random() < 0.6) setTimeout(() => applyEmote(p.id, 5), 300 + Math.random() * 900);
  });
  if (G.attract) { const tok = G.startEv; setTimeout(() => { if (G.attract && G.startEv === tok) startAttract(); }, 2500); return; }
  const win = ev.winners.map(findPlayer).filter(Boolean);
  const iWon = G.backend.local ? !win.every(p => p.cpu) : win.some(p => p.id === G.backend.pid);
  G.busy = true;
  const tok = G.startEv;
  setTimeout(() => { if (G.startEv !== tok) return; G.busy = false; Sound.play(iWon ? 'win' : 'lose'); showResult(ev); }, 1500);
}

/* ---------------- 메인 루프 ---------------- */
function loop(ts) {
  const dt = Math.min(0.05, (ts - (G.lastTime || ts)) / 1000);
  G.lastTime = ts; G.t += dt;
  pumpEvents();
  if (G.players.length) {
    if (G.anim) updateAnim(dt);
    updateControl(dt);
    assistCall('tick', dt);
    updateRemote(dt);
    for (const p of G.players) {
      p.recoil = Math.max(0, p.recoil - dt * 4); p.hurtT = Math.max(0, p.hurtT - dt); p.frozenT = Math.max(0, p.frozenT - dt * 0.5);
      if (p.moodT > 0) { p.moodT -= dt; if (p.moodT <= 0) { p.moodT = 0; p.mood = null; } }
      if (p.movingT > 0) p.movingT = Math.max(0, p.movingT - dt);
      if (p.emote) { p.emote.t -= dt; if (p.emote.t <= 0) p.emote = null; }
      p.hpShow += (p.hp - p.hpShow) * Math.min(1, dt * 3);
    }
    G.fx.update(dt);
    updateWorldFx(dt);
  }
  render(dt);
  if (G.screen === 'play') updateHud(false);
  drawPreviews();
  requestAnimationFrame(loop);
}
</script>
