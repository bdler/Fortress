<script>
/* =========================================================
 *  Sound: WebAudio 합성 효과음
 * ========================================================= */
/* ---------------------------------------------------------
 *  사운드 (WebAudio 합성: 외부 파일 없음)
 * --------------------------------------------------------- */
const Sound = {
  ctx: null, master: null, muted: false, noiseBuf: null, moveNode: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.5; this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 2, b = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = b;
    } catch (e) { this.ctx = null; }
  },
  setMuted(m) { this.muted = m; if (this.master) this.master.gain.value = m ? 0 : 0.5; },
  noise(dur, freq, q, vol, type) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime, s = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    s.buffer = this.noiseBuf; f.type = type || 'lowpass'; f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.2), t + dur);
    f.Q.value = q || 1; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t, Math.random()); s.stop(t + dur + 0.05);
  },
  tone(f0, f1, dur, vol, type, delay) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + (delay || 0), o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.05);
  },
  play(name, k) {
    if (!this.ctx || this.muted || this.silent) return;
    k = k || 1;
    switch (name) {
      case 'fire': this.noise(0.35, 1800, 1, 0.5); this.tone(160, 40, 0.3, 0.5, 'triangle'); break;
      case 'mega': this.noise(0.6, 1200, 1, 0.7); this.tone(120, 30, 0.6, 0.7, 'sawtooth'); break;
      case 'missile': this.noise(0.8, 3000, 2, 0.25, 'bandpass'); this.tone(300, 900, 0.4, 0.12, 'sawtooth'); break;
      case 'plasma': this.tone(1400, 200, 0.35, 0.25, 'sawtooth'); this.tone(700, 1800, 0.2, 0.15, 'square'); break;
      case 'ice': this.tone(2200, 1200, 0.3, 0.15, 'triangle'); this.tone(3300, 2600, 0.25, 0.1, 'sine', 0.05); break;
      case 'boom': this.noise(0.5 + 0.5 * k, 900 + 400 * k, 0.8, 0.6 + 0.3 * k); this.tone(90, 30, 0.5 + 0.3 * k, 0.6, 'sine'); break;
      case 'iceboom': this.noise(0.5, 5000, 3, 0.35, 'highpass'); for (let i = 0; i < 4; i++) this.tone(rand(1800, 3200), rand(900, 1500), 0.3, 0.08, 'triangle', i * 0.05); break;
      case 'zap': this.tone(2400, 80, 0.9, 0.35, 'sawtooth'); this.noise(0.9, 4000, 2, 0.3, 'bandpass'); break;
      case 'splash': this.noise(0.6, 2500, 0.7, 0.35, 'bandpass'); break;
      case 'bounce': this.tone(500, 180, 0.12, 0.25, 'square'); break;
      case 'drill': this.noise(0.08, 1500, 4, 0.12, 'bandpass'); break;
      case 'plane': this.tone(90, 70, 2.2, 0.18, 'sawtooth'); this.noise(2.2, 600, 1, 0.12); break;
      case 'hit': this.tone(220, 110, 0.15, 0.25, 'square'); break;
      case 'turn': this.tone(660, 660, 0.12, 0.2, 'triangle'); this.tone(990, 990, 0.18, 0.2, 'triangle', 0.12); break;
      case 'myturn': [523, 659, 784, 1046].forEach((f, i) => this.tone(f, f, 0.14, 0.2, 'triangle', i * 0.08)); break;
      case 'click': this.tone(900, 700, 0.05, 0.12, 'square'); break;
      case 'tick': this.tone(1200, 1200, 0.05, 0.12, 'square'); break;
      case 'win': [523, 659, 784, 659, 784, 1046].forEach((f, i) => this.tone(f, f, 0.2, 0.22, 'triangle', i * 0.14)); break;
      case 'lose': [392, 349, 311, 262].forEach((f, i) => this.tone(f, f * 0.98, 0.3, 0.2, 'triangle', i * 0.2)); break;
      case 'die': this.noise(1.2, 700, 0.8, 0.8); this.tone(200, 25, 1.2, 0.5, 'sawtooth'); break;
      case 'ss': [440, 554, 659, 880].forEach((f, i) => this.tone(f, f * 1.5, 0.25, 0.15, 'sawtooth', i * 0.06)); break;
    }
  },
  charge(p) {
    if (!this.ctx || this.muted || this.silent) return;
    this.tone(200 + p * 8, 210 + p * 8, 0.05, 0.05, 'square');
  },
  moving(on) {
    if (!this.ctx) return;
    if (on && !this.moveNode && !this.muted && !this.silent) {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain(), f = this.ctx.createBiquadFilter();
      o.type = 'sawtooth'; o.frequency.value = 55; f.type = 'lowpass'; f.frequency.value = 260; g.gain.value = 0.12;
      o.connect(f); f.connect(g); g.connect(this.master); o.start();
      this.moveNode = { o, g };
    } else if (!on && this.moveNode) {
      const n = this.moveNode; this.moveNode = null;
      n.g.gain.setTargetAtTime(0, this.ctx.currentTime, 0.05); n.o.stop(this.ctx.currentTime + 0.3);
    }
  }
};
</script>
