/** 타일 가능한 값 노이즈 텍스처 (지형 질감용, 한 번만 생성) */
function worldTex() {

  const tn = (size, cells, oct, s) => {
    const out = new Float32Array(size * size); let amp = 1;
    for (let o = 0; o < oct; o++) {
      const n = cells << o, cs = size / n, lat = new Float32Array(n * n);
      for (let i = 0; i < n * n; i++) lat[i] = hash2(i % n, (i / n) | 0, s + o * 17);
      for (let y = 0; y < size; y++) {
        const fy = y / cs, yi = fy | 0, v0 = fy - yi, v = v0 * v0 * (3 - 2 * v0), r0 = (yi % n) * n, r1 = ((yi + 1) % n) * n;

          const fx = x / cs, xi = fx | 0, u0 = fx - xi, u = u0 * u0 * (3 - 2 * u0), c0 = xi % n, c1 = (xi + 1) % n;

          out[y * size + x] += ((a + (b - a) * u) * (1 - v) + (c + (d - c) * u) * v) * amp;
        }

      amp *= 0.5;

    for (let i = 0; i < out.length; i++) { const v = out[i]; if (v < mn) mn = v; if (v > mx) mx = v; }
    for (let i = 0; i < out.length; i++) out[i] = (out[i] - mn) / (mx - mn);
    return out;
  };

}

function propRock(ctx, rng, tk) {
  const p = ROCKPAL[tk] || ROCKPAL[0], w = 8 + rng() * 7, h = 6 + rng() * 6, P = [[-w, 2]];
  for (let i = 1; i < 7; i++) { const a = Math.PI + i / 7 * Math.PI; P.push([Math.cos(a) * w * (0.8 + rng() * 0.25), Math.sin(a) * h * (0.75 + rng() * 0.35)]); }

/** 배경(하늘·원경·구름·뒤쪽 날씨)을 그림. cam = {x, y, zoom} (패럴랙스용, 없을 수 있음) */

  const bg = G.bg; if (!bg) return;

  if (cam && !(cam.zoom > 0)) cam = null;
  const Ls = P.layers, z = cam && cam.zoom > 0 ? cam.zoom : 1, cy = cam && cam.y != null ? cam.y : H / 2;
  // 가림 계산: 더 가까운 불투명 레이어가 완전히 덮는 높이 아래는 그리지 않는다 (필레이트 절약)

    ctx.save(); wxLayer(ctx, cam, L.p);
