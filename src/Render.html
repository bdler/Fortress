<script>
/* =========================================================
 *  Render: 지형 그리기, 배경, 탱크 캐릭터, 포탄, 파티클 이펙트
 * ========================================================= */

function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function poly(ctx, pts) { ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); }
function vgrad(ctx, y0, y1, stops) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c));
  return g;
}
function circle(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
function mixRgb(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }

/* ---------------- 지형 페인터 ---------------- */
class TerrainPainter {
  constructor(mask, heights, themeId, seed) {
    this.theme = THEMES[themeId]; this.themeId = themeId; this.seed = seed;
    this.canvas = mkCanvas(W, H); this.ctx = this.canvas.getContext('2d');
    this.build(mask, heights);
  }
  build(mask, heights) {
    const th = this.theme, ctx = this.ctx, img = ctx.createImageData(W, H), d = img.data;
    const top0 = hexToRgb(th.top[0]), top1 = hexToRgb(th.top[1]), soil = th.soil.map(hexToRgb), rock = hexToRgb(th.rock);
    const s = this.seed % 9973;
    for (let x = 0; x < W; x++) {
      let run = 0;
      for (let y = 0; y < H; y++) {
        const idx = y * W + x;
        if (!mask[idx]) { run = 0; continue; }
        const dep = run++;
        const n = vnoise(x * 0.07, y * 0.07, s), n2 = vnoise(x * 0.012, y * 0.02, s + 5);
        let c;
        const edge = 9 + n * 6;
        if (dep < 3) c = mixRgb(top0, [255, 255, 255], 0.12 + n * 0.1);
        else if (dep < edge * 0.55) c = mixRgb(top0, top1, n * 0.6);
        else if (dep < edge) c = mixRgb(top1, soil[0], (dep - edge * 0.55) / (edge * 0.45) * 0.8);
        else {
          const band = y * 0.018 + n2 * 3.2 + dep * 0.004;
          const bi = Math.floor(band) % 3, bf = band - Math.floor(band);
          c = mixRgb(soil[bi], soil[(bi + 1) % 3], bf < 0.85 ? 0 : (bf - 0.85) / 0.15);
          if (n2 > 0.66 && vnoise(x * 0.09, y * 0.09, s + 9) > 0.58) c = mixRgb(c, rock, 0.75);
          const k = (n - 0.5) * 0.18;
          c = mixRgb(c, k > 0 ? [255, 255, 255] : [0, 0, 0], Math.abs(k));
          const h = hash2(x, y, s);
          if (h > 0.992) c = mixRgb(c, [0, 0, 0], 0.35);
          else if (h < 0.006) c = mixRgb(c, [255, 255, 255], 0.25);
          if (th.stars && h > 0.9992) c = [120, 240, 255];
          if (th.lava && dep > 25 && Math.abs(n2 - 0.5) < 0.01 && vnoise(x * 0.015, y * 0.015, s + 13) > 0.6) c = [255, 120 + n * 80, 20];
        }
        const f = 1 - (y / H) * 0.28;
        const o = idx * 4;
        d[o] = c[0] * f; d[o + 1] = c[1] * f; d[o + 2] = c[2] * f; d[o + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    this.decorate(mask, heights);
  }
  decorate(mask, heights) {
    const th = this.theme, ctx = this.ctx, rng = mulberry32(this.seed + 77);
    // 풀/눈 테두리
    for (let x = 1; x < W - 1; x += 2) {
      const y = surfaceY(mask, x);
      if (y >= H) continue;
      const hgt = 2 + rng() * 5;
      if (th.snow) { ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fillRect(x, y - 1.5, 2, 2); continue; }
      if (this.themeId === 'desert') { if (rng() < 0.08) { ctx.fillStyle = '#b98a4a'; ctx.fillRect(x, y - 1, 2, 1); } continue; }
      if (this.themeId === 'volcano') { if (rng() < 0.05) { ctx.fillStyle = '#ff6a1a'; ctx.fillRect(x, y, 2, 1); } continue; }
      ctx.strokeStyle = rng() < 0.5 ? th.top[0] : th.top[1]; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(x, y + 1); ctx.lineTo(x + (rng() - 0.5) * 3, y - hgt); ctx.stroke();
    }
    // 장식 오브젝트
    const n = 10 + Math.floor(rng() * 8);
    for (let i = 0; i < n; i++) {
      const x = 40 + rng() * (W - 80), y = surfaceY(mask, Math.round(x));
      if (y >= SEA - 10) continue;
      const sc = 0.7 + rng() * 0.6;
      ctx.save(); ctx.translate(x, y + 2); ctx.scale(sc, sc);
      this.drawDeco(th.deco, rng);
      ctx.restore();
    }
  }
  drawDeco(kind, rng) {
    const ctx = this.ctx;
    if (kind === 'flower') {
      if (rng() < 0.4) { // 나무
        ctx.fillStyle = '#6b4424'; ctx.fillRect(-2, -26, 4, 26);
        const g = ctx.createRadialGradient(-4, -36, 2, 0, -32, 16); g.addColorStop(0, '#8fe86a'); g.addColorStop(1, '#2f8a2a');
        ctx.fillStyle = g; circle(ctx, 0, -32, 13); ctx.fill(); circle(ctx, -9, -26, 8); ctx.fill(); circle(ctx, 9, -26, 8); ctx.fill();
        ctx.fillStyle = '#e8453c'; for (let i = 0; i < 4; i++) { circle(ctx, (rng() - 0.5) * 18, -38 + rng() * 14, 1.6); ctx.fill(); }
      } else {
        const cols = ['#ff6f91', '#ffd23f', '#ffffff', '#b98bff'];
        for (let k = 0; k < 3; k++) {
          const fx = (k - 1) * 6, fh = 8 + rng() * 6;
          ctx.strokeStyle = '#3b8a26'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(fx, 0); ctx.lineTo(fx, -fh); ctx.stroke();
          ctx.fillStyle = cols[Math.floor(rng() * cols.length)];
          for (let a = 0; a < 5; a++) { circle(ctx, fx + Math.cos(a * 1.256) * 2.2, -fh + Math.sin(a * 1.256) * 2.2, 1.6); ctx.fill(); }
          ctx.fillStyle = '#ffcc00'; circle(ctx, fx, -fh, 1.2); ctx.fill();
        }
      }
    } else if (kind === 'cactus') {
      ctx.fillStyle = '#3f9a4a'; ctx.strokeStyle = '#256b2e'; ctx.lineWidth = 1.2;
      rrect(ctx, -4, -34, 8, 34, 4); ctx.fill(); ctx.stroke();
      rrect(ctx, -13, -24, 6, 12, 3); ctx.fill(); ctx.stroke(); ctx.fillRect(-9, -15, 6, 4);
      rrect(ctx, 7, -28, 6, 14, 3); ctx.fill(); ctx.stroke(); ctx.fillRect(3, -18, 5, 4);
      ctx.fillStyle = '#ff6f91'; circle(ctx, 0, -35, 2); ctx.fill();
    } else if (kind === 'pine') {
      ctx.fillStyle = '#5a3a22'; ctx.fillRect(-2, -8, 4, 8);
      for (let k = 0; k < 3; k++) {
        const yy = -8 - k * 10, w = 14 - k * 3.5;
        ctx.fillStyle = '#2e6b4a'; poly(ctx, [-w, yy, w, yy, 0, yy - 16]); ctx.fill();
        ctx.fillStyle = '#ffffff'; poly(ctx, [-w * 0.6, yy - 6, w * 0.6, yy - 6, 0, yy - 16]); ctx.fill();
      }
    } else if (kind === 'crystal') {
      for (let k = 0; k < 3; k++) {
        const a = (k - 1) * 0.4, hh = 12 + rng() * 14;
        ctx.save(); ctx.rotate(a);
        const g = ctx.createLinearGradient(-4, 0, 4, -hh); g.addColorStop(0, '#3fd6ff'); g.addColorStop(1, '#d8f8ff');
        ctx.fillStyle = g; ctx.shadowColor = '#5fe6ff'; ctx.shadowBlur = 10;
        poly(ctx, [-4, 0, 4, 0, 3, -hh * 0.8, 0, -hh, -3, -hh * 0.8]); ctx.fill();
        ctx.restore();
      }
    } else if (kind === 'ember') {
      ctx.strokeStyle = '#1a1210'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(1, -24); ctx.stroke();
      ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(1, -14); ctx.lineTo(9, -22); ctx.moveTo(0, -18); ctx.lineTo(-8, -26); ctx.stroke();
      ctx.fillStyle = '#ff7a1a'; ctx.shadowColor = '#ff5a00'; ctx.shadowBlur = 6; circle(ctx, 2, -2, 1.5); ctx.fill(); ctx.shadowBlur = 0;
    }
  }
  crater(x, y, r) {
    const ctx = this.ctx;
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    circle(ctx, x, y, r); ctx.fill();
    ctx.globalCompositeOperation = 'source-atop';
    const g = ctx.createRadialGradient(x, y, r * 0.9, x, y, r * 1.45);
    g.addColorStop(0, 'rgba(25,12,4,0.75)'); g.addColorStop(0.35, 'rgba(40,22,10,0.45)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; circle(ctx, x, y, r * 1.5); ctx.fill();
    ctx.restore();
  }
  mound(x, y, r) {
    const ctx = this.ctx;
    ctx.save();
    const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.4, r * 0.1, x, y, r);
    g.addColorStop(0, '#f2fdff'); g.addColorStop(0.5, '#9fe6ff'); g.addColorStop(1, '#3a9ccc');
    ctx.fillStyle = g; circle(ctx, x, y, r); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 1.5;
    const rng = mulberry32(x * 31 + y);
    for (let i = 0; i < 6; i++) {
      const a = rng() * Math.PI * 2, l = r * (0.3 + rng() * 0.5);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(20,90,140,0.7)'; ctx.lineWidth = 2; circle(ctx, x, y, r - 1); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------- 배경 ---------------- */
function buildBackground(themeId, seed) {
  const th = THEMES[themeId], c = mkCanvas(W, H), ctx = c.getContext('2d'), rng = mulberry32(seed + 5);
  ctx.fillStyle = vgrad(ctx, 0, H, th.sky); ctx.fillRect(0, 0, W, H);
  if (th.stars) {
    for (let i = 0; i < 260; i++) {
      const x = rng() * W, y = rng() * H * 0.7, r = rng() * 1.4 + 0.2;
      ctx.fillStyle = `rgba(255,255,255,${0.3 + rng() * 0.7})`; circle(ctx, x, y, r); ctx.fill();
    }
    // 오로라
    ctx.globalAlpha = 0.25;
    for (let k = 0; k < 3; k++) {
      const g = ctx.createLinearGradient(0, 80, 0, 360); g.addColorStop(0, 'rgba(80,255,180,0)'); g.addColorStop(0.5, k % 2 ? 'rgba(120,120,255,0.8)' : 'rgba(80,255,180,0.8)'); g.addColorStop(1, 'rgba(80,255,180,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, 200);
      for (let x = 0; x <= W; x += 20) ctx.lineTo(x, 150 + k * 40 + Math.sin(x * 0.004 + k * 2 + rng()) * 60);
      for (let x = W; x >= 0; x -= 20) ctx.lineTo(x, 260 + k * 40 + Math.sin(x * 0.005 + k) * 50);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // 해/달
  const sx = 200 + rng() * (W - 400), sy = 110 + rng() * 60;
  if (th.sun === 'sun' || th.sun === 'pale') {
    const g = ctx.createRadialGradient(sx, sy, 10, sx, sy, 180);
    g.addColorStop(0, th.sun === 'pale' ? 'rgba(255,255,255,0.9)' : 'rgba(255,250,210,1)'); g.addColorStop(0.25, 'rgba(255,240,180,0.45)'); g.addColorStop(1, 'rgba(255,240,180,0)');
    ctx.fillStyle = g; circle(ctx, sx, sy, 180); ctx.fill();
    ctx.fillStyle = th.sun === 'pale' ? '#fffdf5' : '#fff6c8'; circle(ctx, sx, sy, 40); ctx.fill();
  } else if (th.sun === 'moon') {
    const g = ctx.createRadialGradient(sx, sy, 20, sx, sy, 140); g.addColorStop(0, 'rgba(220,230,255,0.5)'); g.addColorStop(1, 'rgba(200,210,255,0)');
    ctx.fillStyle = g; circle(ctx, sx, sy, 140); ctx.fill();
    ctx.fillStyle = '#f4f1dc'; circle(ctx, sx, sy, 44); ctx.fill();
    ctx.fillStyle = 'rgba(180,175,150,0.6)'; [[-12, -8, 9], [14, 6, 7], [-4, 16, 5], [10, -18, 4]].forEach(a => { circle(ctx, sx + a[0], sy + a[1], a[2]); ctx.fill(); });
  }
  if (th.lava) {
    // 화산
    const vx = 300 + rng() * 1000;
    ctx.fillStyle = '#2a0e0c'; poly(ctx, [vx - 420, H * 0.72, vx - 70, 250, vx + 70, 250, vx + 420, H * 0.72]); ctx.fill();
    const g = ctx.createRadialGradient(vx, 250, 5, vx, 250, 200); g.addColorStop(0, 'rgba(255,160,40,0.9)'); g.addColorStop(1, 'rgba(255,60,0,0)');
    ctx.fillStyle = g; circle(ctx, vx, 250, 200); ctx.fill();
    ctx.strokeStyle = '#ff6a1a'; ctx.lineWidth = 3;
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(vx - 40 + i * 25, 255); ctx.quadraticCurveTo(vx - 60 + i * 40, 380, vx - 120 + i * 70, 520 + rng() * 60); ctx.stroke(); }
  }
  // 먼 산 2겹
  const layers = [{ c: th.far, base: H * 0.5, amp: 150, f: 0.004 }, { c: th.mid, base: H * 0.62, amp: 110, f: 0.007 }];
  layers.forEach((L, li) => {
    ctx.fillStyle = L.c; ctx.beginPath(); ctx.moveTo(0, H);
    const pts = [];
    for (let x = 0; x <= W; x += 8) {
      const y = L.base - Math.abs(Math.sin(x * L.f + li * 3 + seed % 7)) * L.amp * 0.7 - fbm(x * 0.006, li, seed % 997 + li, 3) * L.amp;
      pts.push([x, y]); ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H); ctx.fill();
    if (th.snow || (themeId === 'grass' && li === 0)) {
      // 봉우리 눈 덮개: 산 윤곽을 따라 위쪽만 하얗게
      const line = L.base - L.amp * (th.snow ? 0.35 : 0.6);
      ctx.save(); ctx.beginPath(); ctx.moveTo(0, H);
      pts.forEach(([x, y]) => ctx.lineTo(x, y)); ctx.lineTo(W, H); ctx.closePath(); ctx.clip();
      ctx.fillStyle = 'rgba(255,255,255,0.88)'; ctx.beginPath(); ctx.moveTo(0, 0);
      pts.forEach(([x, y]) => ctx.lineTo(x, Math.min(line + Math.sin(x * 0.07) * 6, y + (line - y) * 0.55 + 4)));
      ctx.lineTo(W, 0); ctx.closePath(); ctx.fill(); ctx.restore();
    }
    // 대기 원근감
    ctx.fillStyle = vgrad(ctx, L.base - L.amp, H, ['rgba(255,255,255,0)', li ? 'rgba(255,255,255,0.05)' : 'rgba(255,255,255,0.12)']);
    ctx.fillRect(0, 0, W, H);
  });
  if (themeId === 'desert') {
    for (let k = 0; k < 2; k++) {
      const px = 200 + rng() * 1200, ps = 70 + rng() * 60, py = H * 0.6;
      ctx.fillStyle = '#c98a4e'; poly(ctx, [px - ps, py, px, py - ps * 0.9, px + ps, py]); ctx.fill();
      ctx.fillStyle = '#a86e3a'; poly(ctx, [px, py - ps * 0.9, px + ps, py, px + ps * 0.2, py]); ctx.fill();
    }
  }
  return c;
}

function makeCloudSprite(color, rng) {
  const c = mkCanvas(220, 110), ctx = c.getContext('2d');
  ctx.fillStyle = color;
  for (let i = 0; i < 9; i++) { circle(ctx, 40 + rng() * 140, 55 + (rng() - 0.3) * 30, 18 + rng() * 22); ctx.fill(); }
  ctx.globalCompositeOperation = 'source-atop';
  ctx.fillStyle = vgrad(ctx, 20, 100, ['rgba(255,255,255,0.3)', 'rgba(0,0,40,0.18)']); ctx.fillRect(0, 0, 220, 110);
  return c;
}

/* ---------------- 탱크 캐릭터 ---------------- */
function drawTreads(ctx, o, big) {
  const wr = big ? 5.2 : 4.3;
  ctx.fillStyle = vgrad(ctx, -12, 0, ['#565a64', '#2a2d34', '#15171b']);
  rrect(ctx, -24, -12, 48, 12, 6); ctx.fill();
  ctx.strokeStyle = '#0d0e11'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.save(); rrect(ctx, -24, -12, 48, 12, 6); ctx.clip();
  ctx.fillStyle = '#1b1d22';
  const ph = ((o.tread || 0) % 4 + 4) % 4;
  for (let i = -28; i < 28; i += 4) { ctx.fillRect(i + ph, -12, 2, 1.6); ctx.fillRect(i - ph + 2, -1.6, 2, 1.6); }
  ctx.restore();
  const xs = big ? [-16, -5.5, 5.5, 16] : [-17, -8.5, 0, 8.5, 17];
  xs.forEach((x, i) => {
    const r = (i === 0 || i === xs.length - 1) && !big ? wr + 0.4 : wr;
    ctx.fillStyle = '#7b808b'; circle(ctx, x, -6, r); ctx.fill();
    ctx.strokeStyle = '#23262c'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#c3c8d2'; circle(ctx, x, -6, r * 0.38); ctx.fill();
    const a = (o.tread || 0) / r;
    ctx.strokeStyle = '#4a4e57'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * r * 0.45, -6 + Math.sin(a) * r * 0.45); ctx.lineTo(x + Math.cos(a) * r * 0.9, -6 + Math.sin(a) * r * 0.9); ctx.stroke();
  });
}

function drawFlag(ctx, o, x, y, h) {
  ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 2, y - h); ctx.stroke();
  ctx.fillStyle = '#ddd'; circle(ctx, x - 2, y - h, 1.4); ctx.fill();
  const t = o.t || 0, fx = x - 2, fy = y - h + 1;
  ctx.fillStyle = o.pc.c;
  ctx.beginPath(); ctx.moveTo(fx, fy);
  for (let i = 0; i <= 6; i++) ctx.lineTo(fx - i * 2.2, fy + Math.sin(t * 8 + i * 0.9) * 1.3 * (i / 6));
  for (let i = 6; i >= 0; i--) ctx.lineTo(fx - i * 2.2, fy + 7 + Math.sin(t * 8 + i * 0.9) * 1.3 * (i / 6) - (i / 6) * 2);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = o.pc.d; ctx.lineWidth = 0.6; ctx.stroke();
}

/** 해치에서 고개를 내민 조종사 */
function drawPilot(ctx, o, x, y) {
  const t = o.t || 0, pc = o.pc;
  ctx.save(); ctx.translate(x, y);
  const bob = Math.sin(t * 3 + (o.seedOff || 0)) * 0.4;
  ctx.translate(0, bob);
  ctx.fillStyle = pc.d; rrect(ctx, -5, -2, 10, 6, 3); ctx.fill();
  // 얼굴
  ctx.fillStyle = '#ffd9b5'; circle(ctx, 0, -6, 5.2); ctx.fill();
  ctx.strokeStyle = '#c99268'; ctx.lineWidth = 0.6; ctx.stroke();
  // 헬멧
  ctx.fillStyle = pc.c; ctx.beginPath(); ctx.arc(0, -7, 6, Math.PI * 1.02, Math.PI * 1.98); ctx.closePath(); ctx.fill();
  ctx.fillStyle = pc.d; ctx.fillRect(-6.2, -7.8, 12.4, 1.6);
  ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.arc(-1.5, -10.5, 2.2, Math.PI, Math.PI * 1.7); ctx.fill();
  // 고글 (헬멧 위)
  ctx.fillStyle = '#3a3a44'; ctx.fillRect(-4.5, -12.2, 9, 1.4);
  ctx.fillStyle = '#9fe3ff'; circle(ctx, -1.6, -12, 1.6); ctx.fill(); circle(ctx, 2.2, -12, 1.6); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillRect(-2.2, -12.8, 0.8, 0.8); ctx.fillRect(1.6, -12.8, 0.8, 0.8);
  // 표정
  const hurt = o.hurtT > 0, blink = ((t + (o.seedOff || 0)) % 3.4) < 0.12;
  ctx.strokeStyle = '#222'; ctx.fillStyle = '#222'; ctx.lineWidth = 0.9;
  if (o.dead) {
    [[1, -6], [3.8, -6]].forEach(([ex, ey]) => { ctx.beginPath(); ctx.moveTo(ex - 1, ey - 1); ctx.lineTo(ex + 1, ey + 1); ctx.moveTo(ex + 1, ey - 1); ctx.lineTo(ex - 1, ey + 1); ctx.stroke(); });
  } else if (hurt) {
    ctx.beginPath(); ctx.moveTo(0.2, -7); ctx.lineTo(1.6, -6); ctx.lineTo(0.2, -5); ctx.moveTo(4.6, -7); ctx.lineTo(3.2, -6); ctx.lineTo(4.6, -5); ctx.stroke();
    circle(ctx, 2.6, -2.8, 1); ctx.fill();
  } else if (blink) {
    ctx.beginPath(); ctx.moveTo(0.3, -6); ctx.lineTo(1.9, -6); ctx.moveTo(3, -6); ctx.lineTo(4.6, -6); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.ellipse(1.1, -6.2, 0.8, 1.2, 0, 0, Math.PI * 2); ctx.ellipse(3.8, -6.2, 0.8, 1.2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(1.1, -7, 0.5, 0.5); ctx.fillRect(3.8, -7, 0.5, 0.5);
    ctx.strokeStyle = '#7a3b2a'; ctx.beginPath();
    if (o.hpr !== undefined && o.hpr < 0.3) { ctx.moveTo(1.4, -2.8); ctx.quadraticCurveTo(2.6, -3.8, 3.8, -2.8); }

  const T = TANKS[o.tank];
  ctx.save();

  if (o.hurtT > 0 && !o.dead) ctx.translate(Math.sin(o.hurtT * 60) * 1.4, 0);

/* ---------------- 포탄 ---------------- */
function drawProj(ctx, pr, t) {
  const a = Math.atan2(pr.vy, pr.vx), spr = pr.w.spr;

  switch (spr) {
    case 'shell': case 'mega': {

      if (spr === 'mega') { ctx.save(); ctx.shadowColor = '#ff4d2d'; ctx.shadowBlur = 14; ctx.fillStyle = 'rgba(255,90,40,0.5)'; circle(ctx, 0, 0, 5); ctx.fill(); ctx.restore(); }

      ctx.fillStyle = '#c9a44a'; ctx.fillRect(-3, -3, 1.6, 6);

    case 'missile': {
      ctx.rotate(a);
      const fl = 5 + Math.random() * 5;
      const g = ctx.createLinearGradient(-8 - fl, 0, -7, 0); g.addColorStop(0, 'rgba(255,120,0,0)'); g.addColorStop(1, '#ffe27a');
      ctx.fillStyle = g; poly(ctx, [-7, -2, -7 - fl, 0, -7, 2]); ctx.fill();

      if (pr.homingOn) { ctx.fillStyle = '#ff2d2d'; circle(ctx, 0, 0, 1.2 + Math.sin(t * 30)); ctx.fill(); }
      break;
    }
    case 'plasma': {
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 12); g.addColorStop(0, '#ffffff'); g.addColorStop(0.3, '#ff7bff'); g.addColorStop(1, 'rgba(160,40,255,0)');
      ctx.fillStyle = g; circle(ctx, 0, 0, 12); ctx.fill();
      break;
    }
    case 'drill': {
      ctx.rotate(a);
      ctx.fillStyle = vgrad(ctx, -3, 3, ['#ffffff', '#9aa0aa', '#50545c']); poly(ctx, [-5, -3.2, 7, 0, -5, 3.2]); ctx.fill();
      ctx.strokeStyle = '#333'; ctx.lineWidth = 0.7;
      for (let i = 0; i < 3; i++) { const x = -3 + i * 3 + ((t * 40) % 3); ctx.beginPath(); ctx.moveTo(x, -2.4 + i * 0.6); ctx.lineTo(x + 1.2, 2.4 - i * 0.6); ctx.stroke(); }
      ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(210,77,255,0.5)'; circle(ctx, -5, 0, 4); ctx.fill();
      break;
    }
    case 'ball': {
      const g = ctx.createRadialGradient(-1.5, -1.5, 0.5, 0, 0, 5); g.addColorStop(0, '#fff3c4'); g.addColorStop(0.5, '#ff9d2e'); g.addColorStop(1, '#a8420b');
      ctx.fillStyle = g; circle(ctx, 0, 0, 5); ctx.fill();
      break;
    }
    case 'ice': case 'icicle': {
      ctx.rotate(a);
      const L = spr === 'icicle' ? 14 : 8;
      ctx.fillStyle = 'rgba(200,245,255,0.95)'; poly(ctx, [-L * 0.6, -3, L, 0, -L * 0.6, 3, -L * 0.3, 0]); ctx.fill();
      ctx.strokeStyle = '#3fb6e8'; ctx.lineWidth = 0.8; ctx.stroke();
      ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.moveTo(-L * 0.4, -1); ctx.lineTo(L * 0.8, 0); ctx.stroke();
      break;
    }
    case 'bomb': case 'bomblet': {
      const s = spr === 'bomblet' ? 0.65 : 1;
      ctx.rotate(a); ctx.scale(s, s);
      ctx.fillStyle = '#2a2d33'; ctx.beginPath(); ctx.ellipse(0, 0, 6, 4.2, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e53935'; ctx.fillRect(-1, -4.2, 2, 8.4);
      ctx.fillStyle = '#555'; poly(ctx, [-5, 0, -10, -4, -10, 4]); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.beginPath(); ctx.ellipse(1.5, -1.8, 2.5, 1, 0, 0, Math.PI * 2); ctx.fill();
      break;
    }
  }
  ctx.restore();
}

/* ---------------- 파티클 & 이펙트 ---------------- */
class Effects {
  constructor(game) {
    this.g = game; this.parts = []; this.shake = 0; this.flash = 0; this.beams = []; this.planes = []; this.targets = []; this.rings = [];
  }
  add(p) { if (this.parts.length < 1800) this.parts.push(p); }
  puff(x, y, n, o) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(o.v0 || 10, o.v1 || 60);
      this.add({ type: o.type, x: x + rand(-(o.jx || 0), o.jx || 0), y: y + rand(-(o.jy || 0), o.jy || 0), vx: Math.cos(a) * sp + (o.vx || 0), vy: Math.sin(a) * sp + (o.vy || 0),
        g: o.g || 0, drag: o.drag || 0.98, life: 0, max: rand(o.l0 || 0.5, o.l1 || 1), size: rand(o.s0 || 2, o.s1 || 5), grow: o.grow || 0, color: o.color, rot: rand(0, 6), vr: rand(-10, 10) });
    }
  }
  terrainColors() { const th = this.g.theme; return [th.top[0], th.soil[0], th.soil[1], th.soil[2]]; }
  // ----- sim hooks -----
  fire(p, w, mz) {
    if (!p) return;
    p.recoil = 1;
    const k = w.fx === 'mega' ? 'mega' : w.spr === 'missile' ? 'missile' : w.fx === 'plasma' ? 'plasma' : w.fx === 'ice' ? 'ice' : 'fire';
    Sound.play(k);
    this.puff(mz.x, mz.y, 10, { type: 'smoke', v0: 5, v1: 40, l0: 0.5, l1: 1.1, s0: 3, s1: 6, grow: 10, color: '200,200,200' });
    this.puff(mz.x, mz.y, 8, { type: 'fire', v0: 20, v1: 90, l0: 0.1, l1: 0.3, s0: 2, s1: 5 });
    this.shake = Math.max(this.shake, 3);
  }
  spawn() { }
  trail(pr) {
    const s = pr.w.spr;
    pr.tick = (pr.tick || 0) + 1;
    if (s === 'plasma') { if (pr.tick % 2 === 0) this.add({ type: 'glow', x: pr.x, y: pr.y, vx: 0, vy: 0, life: 0, max: 0.4, size: 7, color: '255,90,255' }); }
    else if (s === 'ice' || s === 'icicle') { if (pr.tick % 3 === 0) this.add({ type: 'snow', x: pr.x, y: pr.y, vx: rand(-10, 10), vy: rand(-10, 10), life: 0, max: 0.7, size: rand(1, 2.2) }); }
    else if (s === 'missile') { if (pr.tick % 2 === 0) this.add({ type: 'smoke', x: pr.x - pr.vx * 0.012, y: pr.y - pr.vy * 0.012, vx: rand(-8, 8), vy: rand(-8, 8), drag: 0.95, life: 0, max: 1.1, size: 2.5, grow: 9, color: '230,230,230' }); }
    else if (pr.tick % 4 === 0) this.add({ type: 'smoke', x: pr.x, y: pr.y, vx: 0, vy: 0, drag: 0.95, life: 0, max: 0.6, size: 1.6, grow: 4, color: '180,180,180' });
  }
  split(pr) { this.add({ type: 'ring', x: pr.x, y: pr.y, life: 0, max: 0.35, size: 4, grow: 70, color: '255,230,120' }); Sound.play('click'); Sound.play('fire'); }
  splash(x, big) {
    Sound.play('splash');
    const lava = this.g.theme.lava;
    for (let i = 0; i < (big ? 40 : 18); i++) this.add({ type: 'drop', x: x + rand(-6, 6), y: SEA, vx: rand(-60, 60), vy: rand(-280, -100) * (big ? 1.3 : 1), g: 500, drag: 0.99, life: 0, max: rand(0.6, 1.2), size: rand(1.5, 3), color: lava ? '255,140,40' : '200,235,255' });
  }
  bounce(pr) { Sound.play('bounce'); this.puff(pr.x, pr.y, 6, { type: 'debris', v0: 30, v1: 90, g: 300, l0: 0.4, l1: 0.8, s0: 1.5, s1: 2.5, color: this.terrainColors()[1] }); }
  drill(pr) { if (Math.random() < 0.4) Sound.play('drill'); this.puff(pr.x, pr.y, 2, { type: 'spark', v0: 60, v1: 160, l0: 0.15, l1: 0.3, color: '255,140,255' }); }
  explode(x, y, r, kind, mound) {
    const big = r / 34;
    this.shake = Math.max(this.shake, 4 + r / 4);
    this.flash = Math.max(this.flash, Math.min(0.5, r / 140));
    const cols = this.terrainColors();
    if (kind === 'ice') {
      Sound.play('iceboom');
      this.puff(x, y, 26 * big, { type: 'shard', v0: 60, v1: 260, g: 400, l0: 0.5, l1: 1.1, s0: 2, s1: 5, color: '190,240,255' });
      this.puff(x, y, 20, { type: 'snow', v0: 20, v1: 120, l0: 0.8, l1: 1.6 });
      this.add({ type: 'ring', x, y, life: 0, max: 0.4, size: r * 0.5, grow: r * 3, color: '200,245,255' });
      if (mound) return;
    } else if (kind === 'plasma') {
      Sound.play('boom', big * 0.6); Sound.play('plasma');
      this.puff(x, y, 30 * big, { type: 'glow', v0: 30, v1: 200, l0: 0.3, l1: 0.7, s0: 4, s1: 9, color: '255,90,255' });
      this.add({ type: 'ring', x, y, life: 0, max: 0.45, size: r * 0.4, grow: r * 3.5, color: '255,140,255' });
      this.add({ type: 'flash', x, y, life: 0, max: 0.25, size: r * 2.4, color: '255,180,255' });
    } else {
      Sound.play('boom', big);
      this.add({ type: 'flash', x, y, life: 0, max: 0.22, size: r * 2.8, color: '255,230,160' });
      this.add({ type: 'ring', x, y, life: 0, max: 0.35, size: r * 0.5, grow: r * 3, color: '255,220,150' });
      this.puff(x, y, 22 * big, { type: 'fire', v0: 20, v1: 120 * big, jx: r * 0.3, jy: r * 0.3, l0: 0.25, l1: 0.6, s0: r * 0.2, s1: r * 0.45, grow: 6, vy: -30 });
      this.puff(x, y, 14 * big, { type: 'smoke', v0: 10, v1: 60, jx: r * 0.4, jy: r * 0.4, l0: 1, l1: 2.2, s0: r * 0.2, s1: r * 0.4, grow: 14, vy: -35, color: '70,62,58' });
      this.puff(x, y, 18 * big, { type: 'spark', v0: 120, v1: 380, g: 300, l0: 0.3, l1: 0.7, color: '255,210,120' });
    }
    for (let i = 0; i < 20 * big; i++) {
      const a = rand(Math.PI * 1.05, Math.PI * 1.95), sp = rand(80, 320);
      this.add({ type: 'debris', x: x + rand(-r / 2, r / 2), y: y + rand(-r / 2, r / 3), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 520, drag: 0.99, life: 0, max: rand(0.8, 1.6), size: rand(1.5, 3.5), color: cols[Math.floor(rand(0, cols.length))], rot: rand(0, 6), vr: rand(-12, 12) });
    }
  }
  damage(p, amt, w) {
    p.hurtT = 0.5;
    if (w && w.freeze) p.frozenT = 2.5;
    Sound.play('hit');
    this.add({ type: 'text', x: p.x + rand(-6, 6), y: p.y - 50, vx: 0, vy: -40, life: 0, max: 1.4, size: amt >= 200 ? 30 : 22, text: '-' + amt, color: amt >= 200 ? '#ff4d4d' : '#ffe14d' });
    this.g.onDamage && this.g.onDamage(p, amt);
  }
  death(p, drown) {
    Sound.play('die');
    this.add({ type: 'text', x: p.x, y: p.y - 60, vx: 0, vy: -20, life: 0, max: 2, size: 26, text: drown ? '추락!' : 'K.O.!', color: '#ffffff' });
    if (!drown) {
      this.explode(p.x, p.y - 12, 34, 'fire', false);
      this.puff(p.x, p.y - 12, 12, { type: 'debris', v0: 100, v1: 300, g: 500, l0: 1, l1: 2, s0: 2, s1: 4, color: TANKS[p.tank].c2 });
    }
  }
  land(p, fall) { if (fall > 10) this.puff(p.x, p.y, Math.min(20, fall / 3), { type: 'smoke', v0: 10, v1: 50, l0: 0.4, l1: 0.9, s0: 2, s1: 5, grow: 8, color: '180,160,140', vy: -10 }); }
  beam(x, top) {
    Sound.play('zap');
    this.beams.push({ x, top, life: 0, max: 1.0 });
    this.shake = Math.max(this.shake, 14); this.flash = 0.6;
    for (let y = top; y < top + 190; y += 10) this.puff(x, y, 3, { type: 'glow', v0: 30, v1: 160, l0: 0.3, l1: 0.8, s0: 3, s1: 7, color: '255,120,255' });
  }
  target(x, y, dur) { this.targets.push({ x, y, life: 0, max: dur }); }
  plane(x, dir, delay) { Sound.play('plane'); this.planes.push({ x0: x - dir * (W * 0.8), dir, x, life: 0, max: delay + 2.2, delay }); }
  storm(x) { this.targets.push({ x, y: 60, life: 0, max: 1.8, cloud: true }); }

  update(dt) {
    this.shake *= Math.pow(0.02, dt); if (this.shake < 0.1) this.shake = 0;
    this.flash = Math.max(0, this.flash - dt * 1.5);
    for (const p of this.parts) {
      p.life += dt;
      p.vx = (p.vx || 0) * (p.drag || 1); p.vy = (p.vy || 0) * (p.drag || 1);
      p.vy += (p.g || 0) * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.grow) p.size += p.grow * dt;
      if (p.vr) p.rot += p.vr * dt;
      if (p.type === 'debris' && p.life > 0.05 && this.g.terrain && isSolid(this.g.terrain.mask, p.x, p.y)) { p.vx *= 0.3; p.vy = -p.vy * 0.25; p.g = 0; p.vr = 0; }
    }
    this.parts = this.parts.filter(p => p.life < p.max);
    [this.beams, this.planes, this.targets].forEach(arr => arr.forEach(b => b.life += dt));
    this.beams = this.beams.filter(b => b.life < b.max);
    this.planes = this.planes.filter(b => b.life < b.max);
    this.targets = this.targets.filter(b => b.life < b.max);
  }
  draw(ctx, t) {
    // 목표 표시 & 먹구름
    for (const tg of this.targets) {
      const k = tg.life / tg.max;
      if (tg.cloud) {
        ctx.save(); ctx.globalAlpha = Math.sin(k * Math.PI) * 0.8; ctx.fillStyle = '#6a7d92';
        for (let i = -3; i <= 3; i++) { circle(ctx, tg.x + i * 26, tg.y + Math.sin(i + t) * 5, 26); ctx.fill(); }
        ctx.restore();
      } else {
        ctx.save(); ctx.strokeStyle = `rgba(255,60,60,${1 - k})`; ctx.lineWidth = 2;
        const r = 26 - k * 12; circle(ctx, tg.x, tg.y, r); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(tg.x - r - 6, tg.y); ctx.lineTo(tg.x + r + 6, tg.y); ctx.moveTo(tg.x, tg.y - r - 6); ctx.lineTo(tg.x, tg.y + r + 6); ctx.stroke();
        ctx.globalAlpha = 0.4 * (1 - k); ctx.fillStyle = '#ff4d4d'; ctx.fillRect(tg.x - 2, 0, 4, tg.y); ctx.restore();
      }
    }
    // 비행기
    for (const pl of this.planes) {
      const k = pl.life / pl.max, x = lerp(pl.x0, pl.x + pl.dir * W * 0.8, k), y = 70;
      ctx.save(); ctx.translate(x, y); ctx.scale(pl.dir * 1.6, 1.6);
      ctx.fillStyle = '#5b6770'; rrect(ctx, -24, -5, 44, 10, 5); ctx.fill();
      ctx.fillStyle = '#7d8a94'; poly(ctx, [-6, 0, 8, 0, -2, 18, -10, 18]); ctx.fill(); poly(ctx, [-6, 0, 8, 0, -2, -14, -10, -14]); ctx.fill();
      ctx.fillStyle = '#5b6770'; poly(ctx, [-24, -4, -30, -14, -22, -14, -18, -4]); ctx.fill();
      ctx.fillStyle = '#9fe3ff'; ctx.beginPath(); ctx.ellipse(12, -3, 5, 3, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e53935'; circle(ctx, -4, 0, 2.6); ctx.fill();
      ctx.fillStyle = 'rgba(40,40,40,0.4)'; ctx.fillRect(20, -8 + Math.sin(t * 60) * 7, 2, 8);
      ctx.restore();
    }
    // 위성 레이저
    for (const b of this.beams) {
      const k = b.life / b.max, w = 38 * Math.sin(Math.min(1, k * 3) * Math.PI / 2) * (1 - k);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createLinearGradient(b.x - w, 0, b.x + w, 0);
      g.addColorStop(0, 'rgba(160,40,255,0)'); g.addColorStop(0.3, 'rgba(210,80,255,0.7)'); g.addColorStop(0.5, 'rgba(255,255,255,1)'); g.addColorStop(0.7, 'rgba(210,80,255,0.7)'); g.addColorStop(1, 'rgba(160,40,255,0)');
      ctx.fillStyle = g; ctx.fillRect(b.x - w, 0, w * 2, b.top + 200);
      ctx.restore();
    }
    ctx.save();
    for (const p of this.parts) {
      const k = p.life / p.max, a = 1 - k;
      switch (p.type) {
        case 'smoke': ctx.fillStyle = `rgba(${p.color},${a * 0.55})`; circle(ctx, p.x, p.y, p.size); ctx.fill(); break;
        case 'debris': ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = Math.min(1, a * 2); ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size); ctx.restore(); break;
        case 'shard': ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = a; ctx.fillStyle = `rgba(${p.color},1)`; poly(ctx, [0, -p.size, p.size * 0.5, 0, 0, p.size * 0.6, -p.size * 0.5, 0]); ctx.fill(); ctx.restore(); break;
        case 'snow': ctx.fillStyle = `rgba(255,255,255,${a})`; circle(ctx, p.x, p.y, p.size); ctx.fill(); break;
        case 'drop': ctx.fillStyle = `rgba(${p.color},${a})`; circle(ctx, p.x, p.y, p.size); ctx.fill(); break;
        case 'ring': ctx.strokeStyle = `rgba(${p.color},${a})`; ctx.lineWidth = 3 * a + 0.5; circle(ctx, p.x, p.y, p.size); ctx.stroke(); break;
        case 'text':
          ctx.font = `${p.size}px 'Black Han Sans', 'Jua', sans-serif`; ctx.textAlign = 'center';
          ctx.globalAlpha = Math.min(1, a * 2.5); ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.8)';
          const sc = 1 + Math.max(0, 0.15 - p.life) * 4; ctx.save(); ctx.translate(p.x, p.y); ctx.scale(sc, sc);
          ctx.strokeText(p.text, 0, 0); ctx.fillStyle = p.color; ctx.fillText(p.text, 0, 0); ctx.restore(); ctx.globalAlpha = 1; break;
      }
    }
    ctx.globalCompositeOperation = 'lighter';
    for (const p of this.parts) {
      const k = p.life / p.max, a = 1 - k;
      switch (p.type) {
        case 'fire': {
          const col = k < 0.3 ? '255,240,180' : k < 0.6 ? '255,150,40' : '200,60,20';
          ctx.fillStyle = `rgba(${col},${a * 0.8})`; circle(ctx, p.x, p.y, p.size * (1 - k * 0.3)); ctx.fill(); break;
        }
        case 'spark': ctx.strokeStyle = `rgba(${p.color},${a})`; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03); ctx.stroke(); break;
        case 'glow': { const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size); g.addColorStop(0, `rgba(${p.color},${a})`); g.addColorStop(1, `rgba(${p.color},0)`); ctx.fillStyle = g; circle(ctx, p.x, p.y, p.size); ctx.fill(); break; }
        case 'flash': { const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size); g.addColorStop(0, `rgba(${p.color},${a * 0.9})`); g.addColorStop(1, `rgba(${p.color},0)`); ctx.fillStyle = g; circle(ctx, p.x, p.y, p.size); ctx.fill(); break; }
      }
    }
    ctx.restore();
  }
}
