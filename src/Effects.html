<script>
/* =========================================================
 *  Effects: 포탄 그리기, 파티클/폭발/특수 연출
 *  - 순수 시각 효과만 담당 (시뮬레이션 상태는 절대 변경하지 않음)
 *  - 파티클은 미리 그린 스프라이트(오프스크린 캔버스)를 drawImage 로 찍는다
 * ========================================================= */
/* ---------------- 스프라이트 캐시 ---------------- */
const FXS = {
  c: {}, n: 0,
  get(key, make) {
    let s = this.c[key];
    if (!s) { if (this.n > 260) { this.c = {}; this.n = 0; } s = this.c[key] = make(); this.n++; }
    return s;
  },
  // 부드러운 발광 원 (가산 합성용)
  glow(col) {
    return this.get('g' + col, () => {
      const c = mkCanvas(64, 64), x = c.getContext('2d'), g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
      g.addColorStop(0, `rgba(${col},1)`); g.addColorStop(0.22, `rgba(${col},0.62)`); g.addColorStop(0.55, `rgba(${col},0.2)`); g.addColorStop(1, `rgba(${col},0)`);
      x.fillStyle = g; x.fillRect(0, 0, 64, 64); return c;
    });
  },
  // 입체감 있는 연기 뭉치 (3가지 모양)
  smoke(col, v) {
    v = (v | 0) % 3;
    return this.get('s' + col + v, () => {
      const S = 64, c = mkCanvas(S, S), x = c.getContext('2d'), rng = mulberry32(7 + v * 31);
      const blob = (bx, by, r) => { const g = x.createRadialGradient(bx, by, 0, bx, by, r); g.addColorStop(0, `rgba(${col},1)`); g.addColorStop(0.6, `rgba(${col},0.85)`); g.addColorStop(1, `rgba(${col},0)`); x.fillStyle = g; x.beginPath(); x.arc(bx, by, r, 0, Math.PI * 2); x.fill(); };
      blob(32, 32, 24);
      for (let i = 0; i < 5; i++) { const a = rng() * Math.PI * 2, d = 6 + rng() * 9; blob(32 + Math.cos(a) * d, 32 + Math.sin(a) * d, 10 + rng() * 8); }
      x.globalCompositeOperation = 'source-atop';
      const sh = x.createLinearGradient(14, 10, 48, 56); sh.addColorStop(0, 'rgba(255,255,255,0.32)'); sh.addColorStop(0.5, 'rgba(255,255,255,0)'); sh.addColorStop(1, 'rgba(0,0,0,0.3)');
      x.fillStyle = sh; x.fillRect(0, 0, S, S);
      return c;
    });
  },
  // 불덩이 (단계별 색)
  fire(i) {
    return this.get('f' + i, () => {
      const cs = [['255,255,235', '255,236,140', '255,190,60'], ['255,245,190', '255,190,60', '240,110,20'], ['255,200,90', '240,110,25', '190,50,15'], ['230,120,40', '170,50,20', '90,30,20']][i];
      const c = mkCanvas(64, 64), x = c.getContext('2d'), g = x.createRadialGradient(28, 28, 0, 32, 32, 32);
      g.addColorStop(0, `rgba(${cs[0]},1)`); g.addColorStop(0.35, `rgba(${cs[1]},0.95)`); g.addColorStop(0.72, `rgba(${cs[2]},0.75)`); g.addColorStop(1, `rgba(${cs[2]},0)`);
      x.fillStyle = g; x.fillRect(0, 0, 64, 64); return c;
    });
  },
  // 4갈래 반짝이
  star(col) {
    return this.get('t' + col, () => {
      const c = mkCanvas(48, 48), x = c.getContext('2d');
      x.drawImage(FXS.glow(col), 8, 8, 32, 32);
      x.fillStyle = `rgba(${col},1)`; x.beginPath();
      for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, r = i % 2 ? 4 : 23; x.lineTo(24 + Math.cos(a) * r, 24 + Math.sin(a) * r); }
      x.closePath(); x.fill();
      x.fillStyle = '#fff'; x.beginPath(); x.arc(24, 24, 3.5, 0, Math.PI * 2); x.fill();
      return c;
    });
  }
};
function fxRgb(hex) { try { return hexToRgb(hex).join(','); } catch (e) { return '150,120,90'; } }

/* ---------------- 포탄 스프라이트 (4배 해상도로 미리 그림, +x 방향) ---------------- */
const PSC = 4;
function projSprite(spr) {
  return FXS.get('p' + spr, () => {
    const D = { shell: [22, 10], mega: [34, 16], missile: [30, 16], drill: [22, 10], ball: [14, 14], ice: [22, 12], icicle: [30, 12], bomb: [26, 14], bomblet: [16, 11] }[spr] || [22, 10];
    const c = mkCanvas(D[0] * PSC, D[1] * PSC), x = c.getContext('2d');
    x.scale(PSC, PSC); x.translate(D[0] / 2, D[1] / 2); x.lineJoin = 'round';
    const ol = (w) => { x.strokeStyle = 'rgba(12,14,20,0.9)'; x.lineWidth = w || 0.7; x.stroke(); };
    switch (spr) {
      case 'shell': {
        x.beginPath(); x.moveTo(-7, -3.2); x.lineTo(1, -3.2); x.quadraticCurveTo(6, -3, 8.5, 0); x.quadraticCurveTo(6, 3, 1, 3.2); x.lineTo(-7, 3.2); x.closePath();
        x.fillStyle = vgrad(x, -3.2, 3.2, ['#eef2f7', '#9aa3b0', '#4c535e', '#262a31']); x.fill(); ol();
        x.fillStyle = vgrad(x, -3.3, 3.3, ['#ffd08a', '#c77a2c', '#7a3f12']); x.fillRect(-4.6, -3.3, 2.1, 6.6);
        x.fillStyle = '#2c3038'; x.fillRect(-7, -3.2, 1.3, 6.4);
        x.strokeStyle = 'rgba(255,255,255,0.75)'; x.lineWidth = 0.6; x.beginPath(); x.moveTo(-5.5, -2.1); x.lineTo(3.5, -2); x.stroke();
        break;
      }
      case 'mega': {
        x.beginPath(); x.moveTo(-12, -5.6); x.lineTo(3, -5.6); x.quadraticCurveTo(11, -5, 14, 0); x.quadraticCurveTo(11, 5, 3, 5.6); x.lineTo(-12, 5.6); x.closePath();
        x.fillStyle = vgrad(x, -5.6, 5.6, ['#7c8594', '#454c58', '#23272f', '#121418']); x.fill(); ol(0.9);
        x.save(); x.clip();
        x.fillStyle = '#ffcf2e'; x.fillRect(-6, -6, 5, 12);
        x.fillStyle = '#1b1b1b'; for (let i = -7; i < 6; i += 2.6) { x.beginPath(); x.moveTo(-6, i); x.lineTo(-1, i + 2.6); x.lineTo(-1, i + 3.9); x.lineTo(-6, i + 1.3); x.fill(); }
        x.fillStyle = vgrad(x, -5, 5, ['#ffb199', '#ff3b1f', '#8a0f05']); x.beginPath(); x.moveTo(6, -4.4); x.quadraticCurveTo(11, -4, 14, 0); x.quadraticCurveTo(11, 4, 6, 4.4); x.closePath(); x.fill();
        x.restore();
        x.fillStyle = '#3a3f48'; poly(x, [-12, -5.6, -16, -7.6, -13.5, -5.6]); x.fill(); poly(x, [-12, 5.6, -16, 7.6, -13.5, 5.6]); x.fill();
        x.strokeStyle = 'rgba(255,255,255,0.6)'; x.lineWidth = 0.8; x.beginPath(); x.moveTo(-10, -3.8); x.lineTo(5, -3.6); x.stroke();
        break;
      }
      case 'missile': {
        x.fillStyle = vgrad(x, -6, 6, ['#6f9cff', '#2d57b8', '#16306e']);
        poly(x, [-13, -2.6, -8, -2.6, -12, -7, -14.5, -7]); x.fill(); ol(0.5); poly(x, [-13, 2.6, -8, 2.6, -12, 7, -14.5, 7]); x.fill(); ol(0.5);
        poly(x, [1, -2.6, 4, -2.6, 2, -4.6, 0, -4.6]); x.fill(); poly(x, [1, 2.6, 4, 2.6, 2, 4.6, 0, 4.6]); x.fill();
        x.beginPath(); x.moveTo(-13, -2.7); x.lineTo(6, -2.7); x.quadraticCurveTo(11, -2.4, 14, 0); x.quadraticCurveTo(11, 2.4, 6, 2.7); x.lineTo(-13, 2.7); x.closePath();
        x.fillStyle = vgrad(x, -2.7, 2.7, ['#ffffff', '#e6e9ee', '#a9b0ba', '#6d737d']); x.fill(); ol();
        x.save(); x.clip();
        x.fillStyle = vgrad(x, -2.7, 2.7, ['#ff9a8a', '#e5261d', '#8e0d08']); x.fillRect(6, -3, 9, 6);
        x.fillStyle = '#23262c'; x.fillRect(-4, -3, 1.4, 6); x.fillStyle = '#ffcf2e'; x.fillRect(-2.2, -3, 0.8, 6);
        x.restore();
        x.fillStyle = '#3b3f46'; x.fillRect(-14.4, -1.8, 1.6, 3.6);
        x.strokeStyle = 'rgba(255,255,255,0.9)'; x.lineWidth = 0.55; x.beginPath(); x.moveTo(-11, -1.7); x.lineTo(9, -1.4); x.stroke();
        break;
      }
      case 'drill': {
        x.beginPath(); x.moveTo(-6, -3.6); x.lineTo(10, 0); x.lineTo(-6, 3.6); x.closePath();
        x.fillStyle = vgrad(x, -3.6, 3.6, ['#ffffff', '#c9ced8', '#727985', '#3e434c']); x.fill(); ol();
        x.fillStyle = vgrad(x, -4, 4, ['#f3c6ff', '#b44dff', '#5a1590']); rrect(x, -9, -4.2, 3.6, 8.4, 1.2); x.fill(); ol(0.5);
        x.fillStyle = '#ffffff'; x.beginPath(); x.arc(-7.2, 0, 1.2, 0, Math.PI * 2); x.fill();
        break;
      }
      case 'ball': {
        const g = x.createRadialGradient(-2, -2, 0.5, 0, 0, 5.8); g.addColorStop(0, '#fff2c0'); g.addColorStop(0.35, '#ffa43a'); g.addColorStop(0.8, '#d6570e'); g.addColorStop(1, '#8a2f06');
        x.fillStyle = g; x.beginPath(); x.arc(0, 0, 5.6, 0, Math.PI * 2); x.fill(); ol(0.8);
        x.strokeStyle = 'rgba(60,20,5,0.85)'; x.lineWidth = 0.6;
        x.beginPath(); x.moveTo(-5.6, 0); x.lineTo(5.6, 0); x.stroke();
        x.beginPath(); x.ellipse(0, 0, 2.2, 5.6, 0, 0, Math.PI * 2); x.stroke();
        break;
      }
      case 'ice': {
        x.beginPath(); x.moveTo(10, 0); x.lineTo(2, -4.4); x.lineTo(-6, -2.8); x.lineTo(-9, 0); x.lineTo(-6, 2.8); x.lineTo(2, 4.4); x.closePath();
        x.fillStyle = 'rgba(160,230,255,0.95)'; x.fill(); ol(0.6);
        x.fillStyle = 'rgba(240,253,255,0.95)'; poly(x, [10, 0, 2, -4.4, -6, -2.8, -3, 0]); x.fill();
        x.fillStyle = 'rgba(70,170,220,0.9)'; poly(x, [10, 0, 2, 4.4, -6, 2.8, -3, 0]); x.fill();
        x.strokeStyle = 'rgba(255,255,255,0.95)'; x.lineWidth = 0.6; x.beginPath(); x.moveTo(-3, 0); x.lineTo(10, 0); x.moveTo(2, -4.4); x.lineTo(-1, 0); x.stroke();
        break;
      }
      case 'icicle': {
        x.beginPath(); x.moveTo(14, 0); x.lineTo(-7, -4.6); x.quadraticCurveTo(-12, -3, -13, 0); x.quadraticCurveTo(-12, 3, -7, 4.6); x.closePath();
        x.fillStyle = vgrad(x, -4.6, 4.6, ['#ffffff', '#c7f1ff', '#6fcbef', '#2f8fc0']); x.fill(); ol(0.6);
        x.strokeStyle = 'rgba(255,255,255,0.9)'; x.lineWidth = 0.7; x.beginPath(); x.moveTo(-10, -1.6); x.lineTo(10, -0.3); x.stroke();
        x.strokeStyle = 'rgba(47,143,192,0.6)'; x.lineWidth = 0.5; for (let i = -8; i < 6; i += 4) { x.beginPath(); x.moveTo(i, -3.4 + (i + 8) * 0.12); x.lineTo(i + 2, 3.4 - (i + 8) * 0.12); x.stroke(); }
        break;
      }
      case 'bomb': {
        x.fillStyle = vgrad(x, -6, 6, ['#9aa582', '#4d573f', '#2a3023']);
        poly(x, [-7, -1.6, -12, -5.8, -9, -5.8, -5, -2]); x.fill(); ol(0.5); poly(x, [-7, 1.6, -12, 5.8, -9, 5.8, -5, 2]); x.fill(); ol(0.5);
        x.fillStyle = '#3a4131'; x.fillRect(-12.2, -5.8, 1.4, 11.6);
        x.beginPath(); x.moveTo(-8, -1.4); x.quadraticCurveTo(-4, -4.9, 2, -4.9); x.quadraticCurveTo(9.5, -4.6, 9.5, 0); x.quadraticCurveTo(9.5, 4.6, 2, 4.9); x.quadraticCurveTo(-4, 4.9, -8, 1.4); x.closePath();
        x.fillStyle = vgrad(x, -4.9, 4.9, ['#b7c29a', '#66714f', '#3a4230', '#232819']); x.fill(); ol(0.8);
        x.save(); x.clip(); x.fillStyle = '#e53935'; x.fillRect(0.5, -5, 1.8, 10); x.fillStyle = '#ffd23f'; x.fillRect(-3.2, -5, 0.8, 10); x.restore();
        x.fillStyle = 'rgba(255,255,255,0.45)'; x.beginPath(); x.ellipse(3, -2.6, 4, 1.1, -0.05, 0, Math.PI * 2); x.fill();
        break;
      }
      case 'bomblet': {
        x.fillStyle = '#50575f'; poly(x, [-3, -1, -7, -4, -5.5, -1]); x.fill(); poly(x, [-3, 1, -7, 4, -5.5, 1]); x.fill();
        const g = x.createRadialGradient(-0.8, -1.4, 0.3, 0, 0, 4); g.addColorStop(0, '#8a939e'); g.addColorStop(0.5, '#353a42'); g.addColorStop(1, '#121418');
        x.fillStyle = g; x.beginPath(); x.arc(0, 0, 3.8, 0, Math.PI * 2); x.fill(); ol(0.6);
        x.fillStyle = '#ff5a3a'; x.fillRect(-0.6, -3.8, 1.2, 7.6);
        break;
      }
    }
    return { c, w: D[0], h: D[1] };
  });
}

/* ---------------- 포탄 ---------------- */
function drawProj(ctx, pr, t) {
  const a = Math.atan2(pr.vy, pr.vx), spr = (pr.w && pr.w.spr) || 'shell', age = pr.age || 0;
  const blit = s => { const S = projSprite(s); ctx.drawImage(S.c, -S.w / 2, -S.h / 2, S.w, S.h); };
  const glow = (col, x, y, r, al) => { ctx.globalAlpha = al; ctx.drawImage(FXS.glow(col), x - r, y - r, r * 2, r * 2); ctx.globalAlpha = 1; };
  ctx.save(); ctx.translate(pr.x, pr.y);
  switch (spr) {
    case 'mega': {
      ctx.globalCompositeOperation = 'lighter'; glow('255,80,30', 0, 0, 20 + Math.sin(t * 25) * 3, 0.55); ctx.globalCompositeOperation = 'source-over';
      ctx.rotate(a); blit('mega');
      break;
    }
    case 'missile': {
      ctx.rotate(a);
      const fl = 9 + Math.random() * 7;
      ctx.globalCompositeOperation = 'lighter';
      ctx.save(); ctx.translate(-14.5 - fl * 0.5, 0); ctx.scale(fl / 16, 0.34); ctx.drawImage(FXS.glow('255,140,40'), -16, -16, 32, 32); ctx.restore();
      ctx.save(); ctx.translate(-14 - fl * 0.25, 0); ctx.scale(fl / 32, 0.2); ctx.drawImage(FXS.glow('255,250,210'), -16, -16, 32, 32); ctx.restore();
      glow('255,170,60', -15, 0, 9, 0.5);
      ctx.globalCompositeOperation = 'source-over';
      blit('missile');
      if (pr.homingOn) { ctx.globalCompositeOperation = 'lighter'; glow('255,40,40', 3, 0, 5 + Math.sin(t * 30) * 2, 1); }
      break;
    }
    case 'plasma': {
      ctx.globalCompositeOperation = 'lighter';
      const pu = 1 + Math.sin(t * 22) * 0.12;
      glow('180,60,255', 0, 0, 22 * pu, 0.75); glow('255,110,255', 0, 0, 12 * pu, 1); glow('255,255,255', 0, 0, 6, 1);
      for (let i = 0; i < 3; i++) { const an = t * 11 + i * 2.094, r = 8 + Math.sin(t * 7 + i) * 2; glow('255,200,255', Math.cos(an) * r, Math.sin(an) * r * 0.6, 3.5, 0.9); }
      break;
    }
    case 'drill': {
      ctx.rotate(a);
      ctx.globalCompositeOperation = 'lighter'; glow('210,77,255', -8, 0, 12, 0.8); ctx.globalCompositeOperation = 'source-over';
      blit('drill');
      ctx.strokeStyle = 'rgba(40,40,52,0.85)'; ctx.lineWidth = 0.7;
      for (let i = 0; i < 4; i++) { const q = ((t * 60 + i * 4) % 16) - 6; if (q > 8.5) continue; const h = 3.6 * (1 - (q + 6) / 16); ctx.beginPath(); ctx.moveTo(q, -h); ctx.lineTo(q + 1.5, h); ctx.stroke(); }
      break;
    }
    case 'ball': {
      ctx.rotate(age * 14 * (pr.vx >= 0 ? 1 : -1)); blit('ball'); ctx.rotate(-age * 14 * (pr.vx >= 0 ? 1 : -1));
      ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.ellipse(-1.8, -2.6, 1.8, 1, -0.5, 0, Math.PI * 2); ctx.fill();
      break;
    }
    case 'ice': case 'icicle': {
      ctx.globalCompositeOperation = 'lighter'; glow('120,220,255', 0, 0, spr === 'icicle' ? 16 : 13, 0.5); ctx.globalCompositeOperation = 'source-over';
      ctx.rotate(a); blit(spr);
      const gl = (t * 2.2 + (pr.id || 0) * 0.37) % 1, gx = lerp(-6, 9, gl);
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.sin(gl * Math.PI);
      ctx.drawImage(FXS.star('220,250,255'), gx - 5, -6, 10, 10); ctx.globalAlpha = 1;
      break;
    }
    case 'bomb': case 'bomblet': {
      ctx.rotate(a + Math.sin(age * 18 + (pr.id || 0)) * 0.13); blit(spr);
      if (spr === 'bomblet' && Math.floor(t * 8 + (pr.id || 0)) % 2) { ctx.globalCompositeOperation = 'lighter'; glow('255,60,40', 0, 0, 6, 1); }
      break;
    }
    default: ctx.rotate(a); blit('shell');
  }
  ctx.restore();
}

/* ---------------- 파티클 레이어 ----------------
 *  0: 가산(바닥 그을음)  1: 연기  2: 파편/물체  3: 불덩이  4: 가산 발광  5: 글자 */
const FX_LAYER = {
  scorch: 0, smoke: 1, debris: 2, shard: 2, snow: 2, flake: 2, drop: 2, chunk: 2, chute: 2, column: 2, spike: 2, bubble: 2, ripple: 2, streak: 2, cross: 2, arrow: 2,
  fire: 3, ring: 4, glow: 4, flash: 4, spark: 4, ember: 4, arc: 4, star: 4, mflash: 4, aura: 4, lava: 4, text: 5, dmg: 5
};
const FX_MAX = 1500;
const ITEM_FX = { dual: { name: '더블샷!', col: '#6fe3ff', rgb: '90,220,255' }, power: { name: '파워업!', col: '#ff6b5a', rgb: '255,80,60' }, heal: { name: '회복!', col: '#6dff8f', rgb: '90,255,130' } };

/* ---------------- 파티클 & 이펙트 ---------------- */
class Effects {
  constructor(game) {
    this.g = game; this.parts = []; this.shake = 0; this.flash = 0; this.beams = []; this.planes = []; this.targets = []; this.rings = [];
    this.ribs = []; this.time = 0;
  }
  add(p) {
    if (this.parts.length >= FX_MAX) return p;
    p.life = p.life || 0; p.L = FX_LAYER[p.type] !== undefined ? FX_LAYER[p.type] : 2;
    this.parts.push(p); return p;
  }
  puff(x, y, n, o) {
    n = Math.round(n);
    for (let i = 0; i < n; i++) {
      const a = o.a0 !== undefined ? rand(o.a0, o.a1) : rand(0, Math.PI * 2), sp = rand(o.v0 || 10, o.v1 || 60);
      this.add({ type: o.type, x: x + rand(-(o.jx || 0), o.jx || 0), y: y + rand(-(o.jy || 0), o.jy || 0), vx: Math.cos(a) * sp + (o.vx || 0), vy: Math.sin(a) * sp + (o.vy || 0),
        g: o.g || 0, drag: o.drag || 0.98, life: 0, max: rand(o.l0 || 0.5, o.l1 || 1), size: rand(o.s0 || 2, o.s1 || 5), grow: o.grow || 0, color: o.color,
        rot: rand(0, 6), vr: rand(-10, 10), v: (Math.random() * 3) | 0, delay: o.d0 !== undefined ? rand(o.d0, o.d1) : 0, rise: o.rise || 0, wind: o.wind || 0, a0: o.alpha });
    }
  }
  theme() { return this.g.theme || { top: ['#5fcf3a', '#3e9e25'], soil: ['#9b6a3c', '#7a4e2b', '#5e3a1f'] }; }
  terrainColors() { const th = this.theme(); return [th.top[0], th.soil[0], th.soil[1], th.soil[2]]; }
  dustCol() { const th = this.theme(); return mixRgb(hexToRgb(th.soil[0]), [236, 226, 210], 0.4).map(Math.round).join(','); }
  onGround(x, y) { const m = this.g.terrain && this.g.terrain.mask; return !!m && (isSolid(m, x, y + 4) || isSolid(m, x, y + 12)); }
  snd(n, k) { if (typeof Sound !== 'undefined') Sound.play(n, k); }
  stackY(pid) { let h = 0; for (const q of this.parts) if (q.type === 'dmg' && q.pid === pid && q.life < 0.9) h += q.size * 1.05 + (q.labels ? q.labels.length : 0) * (q.size * 0.55 + 2) * 1.05; return h; }
  label(x, y, text, color, size, o) { return this.add(Object.assign({ type: 'dmg', x, y, vx: 0, vy: 0, life: 0, max: 1.6, size, text, color }, o || {})); }

  // ----- 궤적 리본 -----
  ribFor(pr) {
