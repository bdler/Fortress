<script>
/* =========================================================
 *  TankArt: 탱크 캐릭터 그리기 (조종사, 궤도, 탱크별 디자인)
 * ========================================================= */
/* ---------------- 탱크 캐릭터 ---------------- */
function drawTreads(ctx, o, big) {
  const wr = big ? 5.2 : 4.3;
  ctx.fillStyle = vgrad(ctx, -12, 0, ['#565a64', '#2a2d34', '#15171b']);
  rrect(ctx, -24, -12, 48, 12, 6); ctx.fill();
  ctx.strokeStyle = '#0d0e11'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.save(); rrect(ctx, -24, -12, 48, 12, 6); ctx.clip();
  ctx.fillStyle = '#1b1d22';
  const ph = ((o.tread || 0) % 4 + 4) % 4;
  for (let i = -28; i < 28; i += 4) { ctx.fillRect(i + ph, -12, 2, 1.6); ctx.fillRect(i - ph + 2, -1.6, 2, 1.6); }
  ctx.restore();
  const xs = big ? [-16, -5.5, 5.5, 16] : [-17, -8.5, 0, 8.5, 17];
  xs.forEach((x, i) => {
    const r = (i === 0 || i === xs.length - 1) && !big ? wr + 0.4 : wr;
    ctx.fillStyle = '#7b808b'; circle(ctx, x, -6, r); ctx.fill();
    ctx.strokeStyle = '#23262c'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#c3c8d2'; circle(ctx, x, -6, r * 0.38); ctx.fill();
    const a = (o.tread || 0) / r;
    ctx.strokeStyle = '#4a4e57'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * r * 0.45, -6 + Math.sin(a) * r * 0.45); ctx.lineTo(x + Math.cos(a) * r * 0.9, -6 + Math.sin(a) * r * 0.9); ctx.stroke();
  });
}

function drawFlag(ctx, o, x, y, h) {
  ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 2, y - h); ctx.stroke();
  ctx.fillStyle = '#ddd'; circle(ctx, x - 2, y - h, 1.4); ctx.fill();
  const t = o.t || 0, fx = x - 2, fy = y - h + 1;
  ctx.fillStyle = o.pc.c;
  ctx.beginPath(); ctx.moveTo(fx, fy);
  for (let i = 0; i <= 6; i++) ctx.lineTo(fx - i * 2.2, fy + Math.sin(t * 8 + i * 0.9) * 1.3 * (i / 6));
  for (let i = 6; i >= 0; i--) ctx.lineTo(fx - i * 2.2, fy + 7 + Math.sin(t * 8 + i * 0.9) * 1.3 * (i / 6) - (i / 6) * 2);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = o.pc.d; ctx.lineWidth = 0.6; ctx.stroke();
}

/** 해치에서 고개를 내민 조종사 */
function drawPilot(ctx, o, x, y) {
  const t = o.t || 0, pc = o.pc;
  ctx.save(); ctx.translate(x, y);
  const bob = Math.sin(t * 3 + (o.seedOff || 0)) * 0.4;
  ctx.translate(0, bob);
  ctx.fillStyle = pc.d; rrect(ctx, -5, -2, 10, 6, 3); ctx.fill();
  // 얼굴
  ctx.fillStyle = '#ffd9b5'; circle(ctx, 0, -6, 5.2); ctx.fill();
  ctx.strokeStyle = '#c99268'; ctx.lineWidth = 0.6; ctx.stroke();
  // 헬멧
  ctx.fillStyle = pc.c; ctx.beginPath(); ctx.arc(0, -7, 6, Math.PI * 1.02, Math.PI * 1.98); ctx.closePath(); ctx.fill();
  ctx.fillStyle = pc.d; ctx.fillRect(-6.2, -7.8, 12.4, 1.6);
  ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.arc(-1.5, -10.5, 2.2, Math.PI, Math.PI * 1.7); ctx.fill();
  // 고글 (헬멧 위)
  ctx.fillStyle = '#3a3a44'; ctx.fillRect(-4.5, -12.2, 9, 1.4);
  ctx.fillStyle = '#9fe3ff'; circle(ctx, -1.6, -12, 1.6); ctx.fill(); circle(ctx, 2.2, -12, 1.6); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillRect(-2.2, -12.8, 0.8, 0.8); ctx.fillRect(1.6, -12.8, 0.8, 0.8);
  // 표정
  const hurt = o.hurtT > 0, blink = ((t + (o.seedOff || 0)) % 3.4) < 0.12;
  ctx.strokeStyle = '#222'; ctx.fillStyle = '#222'; ctx.lineWidth = 0.9;
  if (o.dead) {
    [[1, -6], [3.8, -6]].forEach(([ex, ey]) => { ctx.beginPath(); ctx.moveTo(ex - 1, ey - 1); ctx.lineTo(ex + 1, ey + 1); ctx.moveTo(ex + 1, ey - 1); ctx.lineTo(ex - 1, ey + 1); ctx.stroke(); });
  } else if (hurt) {
    ctx.beginPath(); ctx.moveTo(0.2, -7); ctx.lineTo(1.6, -6); ctx.lineTo(0.2, -5); ctx.moveTo(4.6, -7); ctx.lineTo(3.2, -6); ctx.lineTo(4.6, -5); ctx.stroke();
    circle(ctx, 2.6, -2.8, 1); ctx.fill();
  } else if (blink) {
    ctx.beginPath(); ctx.moveTo(0.3, -6); ctx.lineTo(1.9, -6); ctx.moveTo(3, -6); ctx.lineTo(4.6, -6); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.ellipse(1.1, -6.2, 0.8, 1.2, 0, 0, Math.PI * 2); ctx.ellipse(3.8, -6.2, 0.8, 1.2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(1.1, -7, 0.5, 0.5); ctx.fillRect(3.8, -7, 0.5, 0.5);
    ctx.strokeStyle = '#7a3b2a'; ctx.beginPath();
    if (o.hpr !== undefined && o.hpr < 0.3) { ctx.moveTo(1.4, -2.8); ctx.quadraticCurveTo(2.6, -3.8, 3.8, -2.8); }
    else { ctx.moveTo(1.2, -3.4); ctx.quadraticCurveTo(2.6, -2, 4, -3.4); }
    ctx.stroke();
  }
  if (!o.dead) { ctx.fillStyle = 'rgba(255,120,120,0.45)'; circle(ctx, -0.8, -4.2, 1.1); ctx.fill(); circle(ctx, 5, -4.2, 1); ctx.fill(); }
  if (!o.dead && o.hpr !== undefined && o.hpr < 0.3) { ctx.fillStyle = '#8fd8ff'; ctx.beginPath(); ctx.moveTo(-4.5, -10); ctx.quadraticCurveTo(-6, -7, -4.5, -6.5); ctx.quadraticCurveTo(-3, -7, -4.5, -10); ctx.fill(); }
  ctx.restore();
}

function rivets(ctx, x0, x1, y, step) {
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  for (let x = x0; x <= x1; x += step) { circle(ctx, x, y + 0.4, 0.9); ctx.fill(); }
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  for (let x = x0; x <= x1; x += step) { circle(ctx, x - 0.3, y - 0.2, 0.5); ctx.fill(); }
}

/** 포신 좌표계로 이동 후 fn 실행 */
function withBarrel(ctx, o, px, py, fn) {
  ctx.save(); ctx.translate(px, py);
  ctx.rotate(-(o.angle || 0) * Math.PI / 180 - (o.tilt || 0) * o.facing);
  ctx.translate(-(o.recoil || 0) * 5, 0);
  fn(); ctx.restore();
}

const TANK_ART = {
  cannon(ctx, o, T) {
    drawFlag(ctx, o, -18, -20, 26);
    withBarrel(ctx, o, 3, -23, () => {
      ctx.fillStyle = vgrad(ctx, -3.4, 3.4, [shade(T.c1, 0.3), T.c2, shade(T.c2, -0.4)]);
      ctx.fillRect(0, -3.2, 25, 6.4); ctx.strokeStyle = '#1e2a10'; ctx.lineWidth = 1; ctx.strokeRect(0, -3.2, 25, 6.4);
      ctx.fillStyle = vgrad(ctx, -5, 5, ['#6e6e6e', '#3a3a3a']); rrect(ctx, 23, -4.8, 8, 9.6, 1.5); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#111'; ctx.fillRect(25, -4.8, 1.2, 9.6); ctx.fillRect(28, -4.8, 1.2, 9.6);
      ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(2, -2.6, 20, 1.2);
    });
    ctx.fillStyle = vgrad(ctx, -21, -9, [shade(T.c1, 0.25), T.c1, T.c2]);
    poly(ctx, [-23, -9, 23, -9, 20, -20, -19, -20]); ctx.fill(); ctx.strokeStyle = '#26330f'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.fillStyle = shade(T.c2, -0.2); ctx.fillRect(-22, -15, 44, 5); rivets(ctx, -19, 19, -12.5, 6.2);
    ctx.fillStyle = o.pc.c; ctx.fillRect(-14, -19.5, 10, 3);
    ctx.fillStyle = '#fff6a8'; circle(ctx, 19.5, -16, 1.8); ctx.fill();
    ctx.fillStyle = '#333'; ctx.fillRect(-25, -23, 4, 7); ctx.fillStyle = '#555'; ctx.fillRect(-25.5, -24, 5, 2);
    ctx.fillStyle = '#3d4a22'; rrect(ctx, 6, -22, 10, 3, 1); ctx.fill();
    drawTreads(ctx, o);
    ctx.fillStyle = vgrad(ctx, -32, -18, [shade(T.c1, 0.35), T.c1, T.c2]);
    ctx.beginPath(); ctx.ellipse(-3, -21, 13, 9, 0, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.strokeStyle = '#26330f'; ctx.stroke();
    ctx.fillStyle = T.c3; ctx.fillRect(-12, -24, 16, 1.6);
    ctx.fillStyle = '#3d4a22'; ctx.beginPath(); ctx.ellipse(-5, -29, 5, 1.6, 0, 0, Math.PI * 2); ctx.fill();
    drawPilot(ctx, o, -5, -29);
  },
  missile(ctx, o, T) {
    drawFlag(ctx, o, -20, -20, 24);
    // 레이더
    const ra = (o.t || 0) * 3;
    ctx.strokeStyle = '#222'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(-15, -20); ctx.lineTo(-15, -30); ctx.stroke();
    ctx.fillStyle = '#d0d8e8'; ctx.beginPath(); ctx.ellipse(-15, -31, 5 * Math.abs(Math.cos(ra)) + 0.8, 2.4, 0, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#44506a'; ctx.stroke();
    withBarrel(ctx, o, 0, -23, () => {
      ctx.fillStyle = vgrad(ctx, -6, 6, ['#5a6f99', T.c2, '#141f3d']); rrect(ctx, -6, -6, 26, 12, 2); ctx.fill();
      ctx.strokeStyle = '#0b1328'; ctx.lineWidth = 1; ctx.stroke();
      [-3, 3].forEach(yy => {
        ctx.fillStyle = '#f2f2f2'; ctx.fillRect(18, yy - 1.8, 7, 3.6);
        ctx.fillStyle = '#e53935'; poly(ctx, [25, yy - 1.8, 30, yy, 25, yy + 1.8]); ctx.fill();
      });
      ctx.fillStyle = T.c3; ctx.fillRect(-4, -1, 20, 2);
      ctx.fillStyle = '#ffcc00'; for (let i = 0; i < 4; i++) ctx.fillRect(-4 + i * 5, 4, 2.5, 1.5);
    });
    ctx.fillStyle = vgrad(ctx, -21, -9, [shade(T.c1, 0.3), T.c1, T.c2]);
    poly(ctx, [-24, -9, 24, -9, 25, -13, 15, -20, -21, -20, -24, -15]); ctx.fill(); ctx.strokeStyle = '#0f1a38'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.strokeStyle = T.c3; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(-22, -14); ctx.lineTo(20, -14); ctx.stroke();
    ctx.fillStyle = o.pc.c; poly(ctx, [8, -19.5, 14, -19.5, 20, -14.5, 14, -14.5]); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 5px sans-serif'; ctx.fillText('07', -8, -15.5);
    ctx.fillStyle = '#9fe3ff'; poly(ctx, [15, -19, 19, -15, 15, -15]); ctx.fill();
    drawTreads(ctx, o);
    ctx.fillStyle = '#18264a'; ctx.beginPath(); ctx.ellipse(6, -20.5, 5, 1.6, 0, 0, Math.PI * 2); ctx.fill();
    drawPilot(ctx, o, 6, -20.5);
  },
  laser(ctx, o, T) {
    const pulse = 0.6 + Math.sin((o.t || 0) * 5) * 0.4;
    drawFlag(ctx, o, -19, -19, 22);
    // 접시 안테나
    ctx.strokeStyle = '#555'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(-13, -19); ctx.lineTo(-13, -26); ctx.stroke();
    ctx.save(); ctx.translate(-13, -29); ctx.rotate(-0.5 + Math.sin((o.t || 0) * 0.8) * 0.3);
    ctx.fillStyle = vgrad(ctx, -7, 3, ['#ffffff', '#b9b0d9']); ctx.beginPath(); ctx.ellipse(0, 0, 8, 3.2, 0, 0, Math.PI); ctx.fill();
    ctx.strokeStyle = T.c2; ctx.lineWidth = 1; ctx.stroke();
    ctx.strokeStyle = '#777'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -5); ctx.stroke();
    ctx.fillStyle = T.c3; circle(ctx, 0, -5.5, 1.3); ctx.fill();
    ctx.restore();
    withBarrel(ctx, o, 2, -23, () => {
      ctx.fillStyle = vgrad(ctx, -2, 2, ['#ffffff', '#a9a9c2']); ctx.fillRect(0, -2, 28, 4);
      ctx.strokeStyle = '#555570'; ctx.lineWidth = 0.8; ctx.strokeRect(0, -2, 28, 4);
      [9, 16, 23].forEach(x => { ctx.fillStyle = T.c2; rrect(ctx, x, -3.5, 3, 7, 1); ctx.fill(); });
      ctx.save(); ctx.globalAlpha = pulse; ctx.shadowColor = T.c3; ctx.shadowBlur = 10;
      ctx.fillStyle = T.c3; circle(ctx, 29, 0, 2.6); ctx.fill(); ctx.restore();
    });
    ctx.fillStyle = vgrad(ctx, -22, -9, ['#ffffff', T.c1, '#a99fcf']);
    ctx.beginPath(); ctx.moveTo(-23, -9); ctx.lineTo(23, -9); ctx.quadraticCurveTo(26, -17, 14, -20); ctx.lineTo(-17, -20); ctx.quadraticCurveTo(-26, -18, -23, -9); ctx.fill();
    ctx.strokeStyle = '#5b4a8a'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.strokeStyle = T.c2; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(-21, -13); ctx.lineTo(21, -13); ctx.stroke();
    ctx.fillStyle = o.pc.c; ctx.fillRect(-18, -18.5, 8, 2.4);
    ctx.save(); ctx.shadowColor = T.c3; ctx.shadowBlur = 8 + pulse * 6;
    const g = ctx.createRadialGradient(6, -15, 0.5, 6, -15, 4.5); g.addColorStop(0, '#fff'); g.addColorStop(0.4, T.c3); g.addColorStop(1, T.c2);
    ctx.fillStyle = g; circle(ctx, 6, -15, 4); ctx.fill(); ctx.restore();
    drawTreads(ctx, o);
    ctx.fillStyle = vgrad(ctx, -30, -19, ['#ffffff', '#cfc6ee']);
    ctx.beginPath(); ctx.ellipse(-2, -20, 10, 7, 0, Math.PI, 0); ctx.fill(); ctx.strokeStyle = '#5b4a8a'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = 'rgba(160,110,255,0.35)'; ctx.beginPath(); ctx.ellipse(-2, -21, 7, 3.5, 0, Math.PI, 0); ctx.fill();
    drawPilot(ctx, o, -4, -26);
  },
  multi(ctx, o, T) {
    drawFlag(ctx, o, -20, -21, 24);
    const spin = (o.t || 0) * (o.active ? 12 : 1.5);
    withBarrel(ctx, o, 2, -25, () => {
      for (let k = 0; k < 3; k++) {
        const a = spin + k * 2.094, off = Math.sin(a) * 3.2, lit = (Math.cos(a) + 1) / 2;
        if (Math.cos(a) < 0) { ctx.fillStyle = shade('#6d6d6d', -0.4 + lit * 0.3); ctx.fillRect(2, off - 1.3, 26, 2.6); }
      }
      for (let k = 0; k < 3; k++) {
        const a = spin + k * 2.094, off = Math.sin(a) * 3.2, lit = (Math.cos(a) + 1) / 2;
        if (Math.cos(a) >= 0) { ctx.fillStyle = shade('#8a8a8a', -0.2 + lit * 0.5); ctx.fillRect(2, off - 1.3, 26, 2.6); ctx.strokeStyle = '#222'; ctx.lineWidth = 0.5; ctx.strokeRect(2, off - 1.3, 26, 2.6); }
      }
      ctx.fillStyle = '#333'; rrect(ctx, 0, -5, 6, 10, 1.5); ctx.fill(); rrect(ctx, 20, -4.6, 3, 9.2, 1); ctx.fill();
    });
    ctx.fillStyle = vgrad(ctx, -22, -9, [shade(T.c1, 0.3), T.c1, T.c2]);
    rrect(ctx, -23, -21, 46, 12, 2.5); ctx.fill(); ctx.strokeStyle = '#4a2204'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.save(); rrect(ctx, 12, -21, 11, 12, 2.5); ctx.clip();
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(12, -21, 11, 12); ctx.fillStyle = '#1e1e1e';
    for (let i = -14; i < 14; i += 4) { poly(ctx, [12 + i, -9, 14 + i, -9, 26 + i, -21, 24 + i, -21]); ctx.fill(); }
    ctx.restore();
    rivets(ctx, -20, 8, -18.5, 5.5); rivets(ctx, -20, 8, -11.5, 5.5);
    ctx.fillStyle = o.pc.c; ctx.fillRect(-20, -16.5, 18, 3);
    drawTreads(ctx, o);
    ctx.fillStyle = '#5c5c5c'; circle(ctx, -14, -27, 6); ctx.fill(); ctx.strokeStyle = '#222'; ctx.lineWidth = 1; ctx.stroke();
    ctx.strokeStyle = '#999'; circle(ctx, -14, -27, 3.5); ctx.stroke();
    ctx.fillStyle = vgrad(ctx, -31, -20, [shade(T.c1, 0.35), T.c2]); rrect(ctx, -8, -31, 14, 11, 2.5); ctx.fill(); ctx.strokeStyle = '#4a2204'; ctx.stroke();
    drawPilot(ctx, o, -2, -32);
  },
  ice(ctx, o, T) {
    drawFlag(ctx, o, -20, -19, 22);
    withBarrel(ctx, o, 2, -23, () => {
      const g = ctx.createLinearGradient(0, -4, 0, 4); g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, T.c1); g.addColorStop(1, T.c2);
      ctx.fillStyle = g; poly(ctx, [0, -4, 22, -3, 32, 0, 22, 3, 0, 4]); ctx.fill();
      ctx.strokeStyle = '#1f6e96'; ctx.lineWidth = 0.9; ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.moveTo(2, -2); ctx.lineTo(28, -0.5); ctx.stroke();
      ctx.fillStyle = '#2a7fae'; rrect(ctx, 6, -5, 3, 10, 1); ctx.fill(); rrect(ctx, 14, -4.5, 3, 9, 1); ctx.fill();
    });
    ctx.fillStyle = vgrad(ctx, -21, -9, ['#e6fbff', T.c1, T.c2]);
    poly(ctx, [-23, -9, 23, -9, 21, -16, 16, -20, -17, -20, -22, -15]); ctx.fill(); ctx.strokeStyle = '#1b5f86'; ctx.lineWidth = 1.2; ctx.stroke();
    // 눈꽃 엠블럼
    ctx.save(); ctx.translate(-9, -14.5); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 0.9;
    for (let i = 0; i < 3; i++) { ctx.rotate(Math.PI / 3); ctx.beginPath(); ctx.moveTo(-3.6, 0); ctx.lineTo(3.6, 0); ctx.stroke(); }
    ctx.restore();
    ctx.fillStyle = o.pc.c; ctx.fillRect(3, -19, 10, 2.6);
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    for (let i = 0; i < 6; i++) { circle(ctx, -18 + i * 7, -11 + (i % 2) * 2, 0.7); ctx.fill(); }
    drawTreads(ctx, o);
    // 얼음 결정 스파이크
    [[-19, -20, 10, -0.3], [-14, -20, 14, -0.1], [-9, -20, 8, 0.15]].forEach(([x, y, h, a]) => {
      ctx.save(); ctx.translate(x, y); ctx.rotate(a);
      ctx.fillStyle = 'rgba(200,245,255,0.85)'; poly(ctx, [-2.4, 0, 2.4, 0, 0, -h]); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 0.7; ctx.beginPath(); ctx.moveTo(-0.6, -1); ctx.lineTo(0, -h + 2); ctx.stroke();
      ctx.restore();
    });
    ctx.fillStyle = vgrad(ctx, -30, -19, ['#ffffff', T.c1]);
    ctx.beginPath(); ctx.ellipse(0, -20, 9, 7, 0, Math.PI, 0); ctx.fill(); ctx.strokeStyle = '#1b5f86'; ctx.lineWidth = 1; ctx.stroke();
    drawPilot(ctx, o, 0, -26);
  },
  air(ctx, o, T) {
    // 꼬리 날개
    ctx.fillStyle = vgrad(ctx, -36, -18, [shade(T.c1, 0.2), T.c2]);
    poly(ctx, [-16, -19, -23, -19, -27, -36, -21, -36]); ctx.fill(); ctx.strokeStyle = '#4a3a08'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = o.pc.c; poly(ctx, [-22.5, -27, -25.6, -33, -22.4, -33, -20, -27]); ctx.fill();
    withBarrel(ctx, o, 4, -22, () => {
      ctx.fillStyle = vgrad(ctx, -4, 4, ['#9aa4ae', T.c3, '#2c3238']); rrect(ctx, 0, -4, 20, 8, 2); ctx.fill();
      ctx.strokeStyle = '#1a1f24'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#1a1f24'; rrect(ctx, 18, -5, 5, 10, 1.5); ctx.fill();
      ctx.fillStyle = '#e53935'; ctx.fillRect(6, -4, 2, 8);
    });
    ctx.fillStyle = vgrad(ctx, -22, -9, [shade(T.c1, 0.35), T.c1, T.c2]);
    ctx.beginPath(); ctx.moveTo(-22, -9); ctx.lineTo(22, -9); ctx.quadraticCurveTo(27, -15, 18, -20); ctx.lineTo(-18, -20); ctx.quadraticCurveTo(-24, -16, -22, -9); ctx.fill();
    ctx.strokeStyle = '#4a3a08'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.fillStyle = T.c3; ctx.fillRect(-10, -18, 18, 3);
    ctx.fillStyle = o.pc.c; circle(ctx, -14, -14, 2.8); ctx.fill(); ctx.fillStyle = '#fff'; circle(ctx, -14, -14, 1.2); ctx.fill();
    // 작은 날개
    ctx.fillStyle = vgrad(ctx, -16, -10, ['#c6ced6', T.c3]); poly(ctx, [-4, -15, 10, -15, 16, -11, -8, -11]); ctx.fill(); ctx.strokeStyle = '#2c3238'; ctx.lineWidth = 0.8; ctx.stroke();
    rivets(ctx, -2, 10, -13, 4);
    drawTreads(ctx, o, true);
    // 프로펠러
    ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-2, -20); ctx.lineTo(-2, -34); ctx.stroke();
    const sp = (o.t || 0) * 30;
    ctx.fillStyle = 'rgba(60,60,60,0.35)'; ctx.beginPath(); ctx.ellipse(-2, -35, 13, 1.8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#444'; ctx.beginPath(); ctx.ellipse(-2 + Math.cos(sp) * 6, -35, Math.abs(Math.cos(sp)) * 6 + 1, 1.2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e53935'; circle(ctx, -2, -35, 1.6); ctx.fill();
    ctx.fillStyle = vgrad(ctx, -28, -19, ['#e8f7ff', '#8fb6cc']); ctx.beginPath(); ctx.ellipse(8, -20, 7, 5, 0, Math.PI, 0); ctx.fill(); ctx.strokeStyle = '#2c3238'; ctx.stroke();
    drawPilot(ctx, o, 8, -21);
  }
};

/**
 * o: { tank, pc, x, y, angle, facing, tilt, t, tread, recoil, hurtT, dead, frozenT, hpr, s, active, seedOff }
 */
function drawTank(ctx, o) {
  const T = TANKS[o.tank];
  ctx.save();
  ctx.translate(o.x, o.y);
  ctx.rotate(o.tilt || 0);
  const s = o.s || TANK_SCALE;
  ctx.scale(o.facing * s, s);
  // 그림자
  ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.beginPath(); ctx.ellipse(0, 0.5, 26, 3.2, 0, 0, Math.PI * 2); ctx.fill();
  if (o.dead) ctx.filter = 'grayscale(1) brightness(0.42) contrast(1.2)';
  if (o.hurtT > 0 && !o.dead) ctx.translate(Math.sin(o.hurtT * 60) * 1.4, 0);
  if (o.ssGlow && !o.dead) {
    ctx.save(); ctx.globalAlpha = 0.35 + Math.sin((o.t || 0) * 6) * 0.2; ctx.fillStyle = '#ffd23f';
    ctx.shadowColor = '#ffb300'; ctx.shadowBlur = 16; ctx.beginPath(); ctx.ellipse(0, -14, 28, 20, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
  TANK_ART[o.tank](ctx, o, T);
  ctx.filter = 'none';
  if (o.frozenT > 0 && !o.dead) {
    ctx.globalAlpha = Math.min(1, o.frozenT);
    ctx.fillStyle = 'rgba(170,230,255,0.38)'; rrect(ctx, -27, -38, 54, 38, 5); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-20, -32); ctx.lineTo(-10, -22); ctx.moveTo(14, -34); ctx.lineTo(20, -26); ctx.moveTo(-4, -8); ctx.lineTo(4, -16); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}
