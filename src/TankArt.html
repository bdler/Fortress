<script>
/* =========================================================
 *  TankArt: 탱크 캐릭터 그리기
 *   - 6종 탱크(캐논/미사일/레이저/멀티/아이스/에어) + 탱크별 조종사 캐릭터
 *   - 표정(무드·차지·피격·빙결·저체력), 포즈(win/lose), 손상 단계, 잔해, 빙결 블록, SS 오라
 *   - 전역 노출은 drawTank(ctx, o) 하나 (나머지는 이 IIFE 내부)
 *   로컬 좌표: 발밑 중앙이 원점, +x 가 정면. 포신 피벗 (-3,-25), 길이 30 → Sim.muzzle() 과 일치
 *   성능: ctx.filter / shadowBlur 미사용, 그라디언트는 팔레트별 캐시, 화면 배율에 따라 LOD
 * ========================================================= */
(function () {
'use strict';
const PI = Math.PI, TAU = PI * 2;
const PVX = -3, PVY = -25;

/* ---------------- 색 유틸 ---------------- */
const RGB = {};
function rgbOf(c) {
  let v = RGB[c]; if (v) return v;
  if (c[0] === '#') { const n = parseInt(c.slice(1, 7), 16); v = [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  else { const m = c.match(/[\d.]+/g) || [0, 0, 0]; v = [+m[0], +m[1], +m[2]]; }
  return (RGB[c] = v);
}
const cstr = a => 'rgb(' + (a[0] | 0) + ',' + (a[1] | 0) + ',' + (a[2] | 0) + ')';
function mix(a, b, k) { const x = rgbOf(a), y = rgbOf(b); return cstr([x[0] + (y[0] - x[0]) * k, x[1] + (y[1] - x[1]) * k, x[2] + (y[2] - x[2]) * k]); }
const lt = (c, k) => k >= 0 ? mix(c, '#ffffff', k) : mix(c, '#000000', -k);
function rgba(c, a) { const x = rgbOf(c); return 'rgba(' + (x[0] | 0) + ',' + (x[1] | 0) + ',' + (x[2] | 0) + ',' + a + ')'; }
/** 그을린 색 (잔해용): 밝기만 조금 남기고 어둡고 탁하게 */
function charOf(c) {
  const x = rgbOf(c), l = (x[0] * 0.3 + x[1] * 0.55 + x[2] * 0.15) / 255, v = 18 + l * 62;
  return cstr([v * 1.1 + (x[0] - v) * 0.08, v + (x[1] - v) * 0.08, v * 0.88 + (x[2] - v) * 0.08]);
}

/* ---------------- 그라디언트 (캐시) ---------------- */
let GXC = null;
const gx = () => GXC || (GXC = document.createElement('canvas').getContext('2d'));
function stops(g, s) { s.forEach((c, i) => Array.isArray(c) ? g.addColorStop(c[0], c[1]) : g.addColorStop(i / (s.length - 1), c)); return g; }
const lin = (x0, y0, x1, y1, s) => stops(gx().createLinearGradient(x0, y0, x1, y1), s);
const rad = (x, y, r0, r1, s, x1, y1) => stops(gx().createRadialGradient(x, y, r0, x1 === undefined ? x : x1, y1 === undefined ? y : y1, r1), s);
const GC = {};
const cg = (c, k, mk) => c[k] || (c[k] = mk());

/* ---------------- 팔레트 (탱크×플레이어색×잔해) ---------------- */
const PALS = {};
function pal(id, pc, dead) {
  const key = id + pc.c + (dead ? 'x' : '');
  if (PALS[key]) return PALS[key];
  const T = TANKS[id], cx = {};
  const X = dead ? c => cx[c] || (cx[c] = charOf(c)) : c => c;
  return (PALS[key] = {
    id, dead, x: X, g: {},
    hi: X(lt(T.c1, 0.5)), b0: X(lt(T.c1, 0.22)), b1: X(T.c1), b2: X(T.c2), b3: X(lt(T.c2, -0.35)), line: X(lt(T.c2, -0.62)),
    a1: X(T.c3), a2: X(lt(T.c3, -0.35)),
    m0: X('#e2e6ec'), m1: X('#a5abb6'), m2: X('#6d737e'), m3: X('#42464f'), m4: X('#1e2025'),
    rub: X('#2c2e34'), rub2: X('#4b4e56'),
    pc: X(pc.c), pcd: X(pc.d), pcl: X(pc.l || lt(pc.c, 0.55)), pcdd: X(lt(pc.d, -0.45)),
    glass: X('#b4ebff'), glassD: X('#2a6891'),
    ink: dead ? '#0e0a08' : '#22150f'
  });
}
const pcache = (P, k, mk) => P.g[k] || (P.g[k] = mk());

/* ---------------- 공용 도형 ---------------- */
function ell(ctx, x, y, rx, ry, r) { r = r || 0; ctx.moveTo(x + rx * Math.cos(r), y + rx * Math.sin(r)); ctx.ellipse(x, y, rx, ry, r, 0, TAU); }
function dot(ctx, x, y, r) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU); }
function rotAt(ctx, x, y, a) { ctx.translate(x, y); ctx.rotate(a); ctx.translate(-x, -y); }
function star4(ctx, x, y, r) { ctx.moveTo(x, y - r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.quadraticCurveTo(x, y, x, y + r); ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r); }
function star5(ctx, x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -PI / 2 + i * PI / 5, q = i & 1 ? r * 0.42 : r; ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); }
  ctx.closePath();
}
/** 가산 합성 광원 (단위 원 그라디언트 캐시 후 스케일) */
function glow(ctx, x, y, r, col, a) {
  if (!(a > 0.01) || !(r > 0)) return;
  const g = cg(GC, 'gl' + col, () => rad(0, 0, 0, 1, [[0, rgba(col, 0.9)], [0.3, rgba(col, 0.45)], [1, rgba(col, 0)]]));
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = GA * (Math.min(1, a));
  ctx.translate(x, y); ctx.scale(r, r); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 1, 0, TAU); ctx.fill(); ctx.restore();
}
/** 몸체 음영: 기본 그라디언트 + 상단 하이라이트 + 하단 AO/흙때 + 내부 디테일(클립) + 외곽선 */
function body(ctx, P, key, path, y0, y1, cols, inner, lw) {
  ctx.fillStyle = pcache(P, key, () => lin(0, y0, 0, y1, cols()));
  path(ctx); ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = cg(GC, 'sp' + y0 + P.dead, () => lin(0, y0, 0, y0 + 3.2, [P.dead ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.5)', 'rgba(255,255,255,0)']));
  ctx.fillRect(-40, y0, 80, 3.2);
  ctx.fillStyle = cg(GC, 'ao' + y1, () => lin(0, y1 - 5, 0, y1, ['rgba(40,24,10,0)', 'rgba(40,24,10,0.42)']));
  ctx.fillRect(-40, y1 - 5, 80, 5);
  if (inner) inner();
  if (BODY_LOD >= 2) weather(ctx, key.length * 7.3 + y0, y0, y1, P.dead);
  ctx.restore();
  path(ctx); ctx.strokeStyle = P.line; ctx.lineWidth = lw || 1.1; ctx.stroke();
}
let BODY_LOD = 0, GA = 1; // 현재 LOD, 호출자의 globalAlpha (페이드 존중)
/** 풍화: 칠 벗겨진 점 + 흘러내린 때 (결정적 위치, 클립 안에서 호출) */
function weather(ctx, sd, y0, y1, dead) {
  const h = y1 - y0;
  ctx.beginPath();
  for (let i = 0; i < 9; i++) { const x = -26 + hash2(i, 3, sd | 0) * 54, y = y0 + 1 + hash2(i, 7, sd | 0) * (h - 2), r = 0.25 + hash2(i, 11, sd | 0) * 0.45; ell(ctx, x, y, r * 1.5, r, hash2(i, 5, sd | 0) * 3); }
  ctx.fillStyle = dead ? 'rgba(0,0,0,0.35)' : 'rgba(255,255,255,0.3)'; ctx.fill();
  ctx.beginPath();
  for (let i = 0; i < 5; i++) { const x = -24 + hash2(i, 13, sd | 0) * 50, y = y0 + h * 0.35 + hash2(i, 17, sd | 0) * h * 0.3; ctx.moveTo(x, y); ctx.lineTo(x + 0.3, y + h * 0.3 + hash2(i, 19, sd | 0) * h * 0.3); }
  ctx.strokeStyle = 'rgba(70,45,20,0.16)'; ctx.lineWidth = 0.7; ctx.stroke();
}
/** 음각 이음새 [x0,y0,x1,y1,...] */
function seams(ctx, a) {
  ctx.beginPath(); for (let i = 0; i < a.length; i += 4) { ctx.moveTo(a[i], a[i + 1]); ctx.lineTo(a[i + 2], a[i + 3]); }
  ctx.strokeStyle = 'rgba(0,0,0,0.34)'; ctx.lineWidth = 0.55; ctx.stroke();
  ctx.beginPath(); for (let i = 0; i < a.length; i += 4) { ctx.moveTo(a[i] + 0.35, a[i + 1] + 0.45); ctx.lineTo(a[i + 2] + 0.35, a[i + 3] + 0.45); }
  ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.stroke();
}
function rivets(ctx, x0, x1, y, step, r) {
  r = r || 0.6;
  ctx.beginPath(); for (let x = x0; x <= x1 + 0.01; x += step) dot(ctx, x, y + 0.3, r); ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fill();
  ctx.beginPath(); for (let x = x0; x <= x1 + 0.01; x += step) dot(ctx, x - 0.12, y - 0.12, r * 0.55); ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fill();
}
/** 전조등 (렌즈 + 부드러운 빛) */
function lamp(ctx, P, st, x, y, r) {
  ctx.fillStyle = P.m4; ctx.beginPath(); dot(ctx, x, y, r + 0.55); ctx.fill();
  ctx.fillStyle = P.dead ? P.m3 : cg(GC, 'lamp', () => rad(-0.3, -0.35, 0.05, 1.05, ['#ffffff', '#fff2a8', '#e8a42c']));
  ctx.save(); ctx.translate(x, y); ctx.scale(r, r); ctx.beginPath(); dot(ctx, 0, 0, 1); ctx.fill(); ctx.restore();
  if (P.dead) return;
  ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.beginPath(); dot(ctx, x - r * 0.35, y - r * 0.35, r * 0.3); ctx.fill();
  if (st.lod >= 1) glow(ctx, x + r * 0.5, y, r * (3.2 + (st.active ? 0.9 : 0)), '#ffe9a0', 0.5 + Math.sin(st.t * 3 + st.seed) * 0.08);
}
/** 절차적 연기 뭉치 (t 기반) */
function puffs(ctx, st, x, y, n, rate, rgb, amt, rise) {
  rise = rise || 11;
  for (let i = 0; i < n; i++) {
    const ph = (st.t * rate + i / n + st.seed * 0.31) % 1, a = amt * (1 - ph) * Math.min(1, ph * 7);
    if (a <= 0.01) continue;
    ctx.fillStyle = 'rgba(' + rgb + ',' + a.toFixed(3) + ')';
    ctx.beginPath(); dot(ctx, x + (st.wl * 0.35 - 1.6) * ph * 5 + Math.sin(ph * 7 + i) * 0.6, y - ph * rise, 0.8 + ph * 3.2); ctx.fill();
  }
}
/** 견인 고리 */
function hook(ctx, P, x, y, d) {
  ctx.strokeStyle = P.m4; ctx.lineWidth = 0.75; ctx.beginPath(); ctx.arc(x, y, 0.95, -PI / 2 * d, PI / 2 * d, d < 0); ctx.stroke();
}

/* ---------------- 깃발 ---------------- */
function flagCloth(ctx, P, st, tx, ty, kind) {
  const t = st.t, dead = st.dead, pen = kind === 'pennant';
  const L = dead ? 7.5 : 11, Wd = 6, N = 7, y0 = ty + 0.7;
  const amp = dead ? 0.35 : 0.9 + Math.min(1.4, Math.abs(st.wl) * 0.14) + (st.moving ? 0.5 : 0);
  const sp = dead ? 2 : 7 + Math.abs(st.wl) * 0.4, sd = st.seed;
  const wv = u => Math.sin(t * sp - u * 4.5 + sd) * amp * u + (dead ? u * u * 3.2 : 0);
  ctx.beginPath(); ctx.moveTo(tx, y0);
  for (let i = 1; i <= N; i++) { const u = i / N; ctx.lineTo(tx - u * L, y0 + wv(u) + (pen ? u * Wd * 0.5 : 0)); }
  for (let i = N; i >= 0; i--) { const u = i / N; ctx.lineTo(tx - u * L + (dead && i % 2 ? 1.3 : 0), y0 + (pen ? Wd - u * Wd * 0.5 : Wd) + wv(u) - (dead && i % 2 ? 1 : 0)); }
  ctx.closePath();
  const holo = kind === 'holo' && !dead;
  ctx.save();
  if (holo) ctx.globalAlpha = GA * (0.62 + Math.sin(t * 23) * 0.06 + (Math.sin(t * 3.1) > 0.97 ? -0.3 : 0));
  ctx.fillStyle = pcache(P, 'fl' + (y0 | 0), () => lin(0, y0, 0, y0 + Wd, [P.pcl, P.pc, P.pcd]));
  ctx.fill(); ctx.strokeStyle = P.pcdd; ctx.lineWidth = 0.5; ctx.stroke();
  if (st.lod >= 1 && !dead) {
    ctx.clip();
    const mx = tx - L * 0.5, my = y0 + Wd * 0.5 + wv(0.5);
    if (holo) {
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 0.4; ctx.beginPath();
      for (let k = 0; k < 4; k++) { const yy = y0 + ((k * 1.6 + t * 4) % 6.4) - 0.2; ctx.moveTo(tx - L - 1, yy); ctx.lineTo(tx + 1, yy); }
      ctx.stroke();
    } else if (pen) {
      ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 0.9; ctx.beginPath();
      for (let i = 0; i <= N; i++) { const u = i / N, x = tx - u * L, y = y0 + Wd * 0.5 + wv(u); i ? ctx.lineTo(x, y - (1 - u) * 0.3) : ctx.moveTo(x, y); }
      ctx.stroke();
    } else if (kind === 'snow') {
      ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 0.5; ctx.beginPath();
      for (let k = 0; k < 3; k++) { const a = k * PI / 3; ctx.moveTo(mx - Math.cos(a) * 1.9, my - Math.sin(a) * 1.9); ctx.lineTo(mx + Math.cos(a) * 1.9, my + Math.sin(a) * 1.9); }
      ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.85)'; star5(ctx, mx, my, 1.9); ctx.fill();
    }
  }
  ctx.restore();
}
function flag(ctx, P, st, x, y, h, kind) {
  const sway = st.dead ? 0.14 : Math.sin(st.t * 1.6 + st.seed) * 0.035 + (st.moving ? Math.sin(st.t * 10) * 0.05 : 0) - st.wl * 0.003;
  const tx = x - 1 + sway * h, ty = y - h * (st.dead ? 0.9 : 1);
  ctx.fillStyle = P.m3; rrect(ctx, x - 1.3, y - 1.7, 2.6, 2.1, 0.6); ctx.fill();
  ctx.strokeStyle = P.m4; ctx.lineWidth = 0.85; ctx.beginPath(); ctx.moveTo(x, y - 1.2); ctx.quadraticCurveTo(x - 0.2, y - h * 0.55, tx, ty); ctx.stroke();
  ctx.fillStyle = P.m1; ctx.beginPath(); dot(ctx, tx, ty, 0.85); ctx.fill();
  flagCloth(ctx, P, st, tx, ty + 0.6, kind);
}

/* ---------------- 궤도 ---------------- */
const TL = 75 + TAU * 6.25, TP = [0, 0, 0, 0];
/** 궤도 둘레 위치 s → [x, y, nx, ny] (시계 방향) */
function trackPt(s) {
  const r = 6.25, arc = PI * r;
  s = ((s % TL) + TL) % TL;
  if (s < 37.5) { TP[0] = -18.75 + s; TP[1] = -12.5; TP[2] = 0; TP[3] = -1; }
  else if ((s -= 37.5) < arc) { const a = -PI / 2 + s / r; TP[2] = Math.cos(a); TP[3] = Math.sin(a); TP[0] = 18.75 + TP[2] * r; TP[1] = -6.25 + TP[3] * r; }
  else if ((s -= arc) < 37.5) { TP[0] = 18.75 - s; TP[1] = 0; TP[2] = 0; TP[3] = 1; }
  else { s -= 37.5; const a = PI / 2 + s / r; TP[2] = Math.cos(a); TP[3] = Math.sin(a); TP[0] = -18.75 + TP[2] * r; TP[1] = -6.25 + TP[3] * r; }
  return TP;
}
const WHEELS = [-18.8, -9.4, 0, 9.4, 18.8], WHEELS_BIG = [-16.5, -5.5, 5.5, 16.5];
function treads(ctx, P, st, A) {
  const lod = st.lod, tr = st.tread, big = !!A.big;
  ctx.fillStyle = pcache(P, 'belt', () => lin(0, -12.5, 0, 0, [P.rub2, P.rub, P.m4]));
  rrect(ctx, -25, -12.5, 50, 12.5, 6.25); ctx.fill();
  ctx.strokeStyle = P.m4; ctx.lineWidth = 1; ctx.stroke();
  // 링크 돌기 (둘레를 따라 흐름)
  {
    const n = lod ? 36 : 28, sp = TL / n, ph = ((tr % sp) + sp) % sp;
    ctx.beginPath();
    for (let i = 0; i < n; i++) { const q = trackPt(i * sp + ph); ctx.moveTo(q[0] - q[2] * 0.75, q[1] - q[3] * 0.75); ctx.lineTo(q[0] + q[2] * 0.45, q[1] + q[3] * 0.45); }
    ctx.strokeStyle = P.m4; ctx.lineWidth = 1.3; ctx.lineCap = 'butt'; ctx.stroke(); ctx.lineCap = 'round';
    if (lod >= 2) { // 윗면 링크 하이라이트
      ctx.beginPath();
      for (let i = 0; i < n; i++) { const q = trackPt(i * sp + ph + sp * 0.5); if (q[3] < -0.5) { ctx.moveTo(q[0] - 0.5, q[1] + 0.35); ctx.lineTo(q[0] + 0.5, q[1] + 0.35); } }
      ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 0.5; ctx.stroke();
    }
  }
  // 안쪽 홈
  ctx.fillStyle = 'rgba(0,0,0,0.38)'; rrect(ctx, -22.6, -10.4, 45.2, 8.8, 4.4); ctx.fill();
  if (A.beltGlow && !st.dead) { // 레이저: 발광 띠
    const k = 0.55 + 0.45 * Math.sin(st.t * (3 + st.charge * 12));
    ctx.fillStyle = rgba(A.beltGlow, 0.5 + k * 0.4); ctx.fillRect(-19, -1.9, 38, 0.8);
    if (lod >= 1) glow(ctx, 0, -1.5, 5, A.beltGlow, k * 0.25);
  }
  // 바퀴
  const xs = big ? WHEELS_BIG : WHEELS, r = big ? 5.3 : 4.3, hub = A.hub ? P.x(A.hub) : P.b1;
  const rim = cg(GC, 'rim' + P.dead, () => rad(-0.3, -0.35, 0.05, 1, P.dead ? ['#5a524c', '#3a3430', '#241f1c'] : ['#f2f4f8', '#a9afba', '#5b606a']));
  const a = tr / r;
  for (let i = 0; i < xs.length; i++) {
    const x = xs[i], rr = !big && (i === 0 || i === xs.length - 1) ? r + 0.3 : r;
    ctx.fillStyle = P.m4; ctx.beginPath(); dot(ctx, x, -6.2, rr); ctx.fill();
    ctx.save(); ctx.translate(x, -6.2); ctx.scale(rr * 0.8, rr * 0.8); ctx.fillStyle = rim; ctx.beginPath(); dot(ctx, 0, 0, 1); ctx.fill(); ctx.restore();
    ctx.fillStyle = hub; ctx.beginPath(); dot(ctx, x, -6.2, rr * 0.42); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 0.45; ctx.stroke();
    if (lod >= 1) {
      // 회전하는 볼트
      ctx.beginPath();
      for (let k = 0; k < 5; k++) { const b = a + k * TAU / 5; dot(ctx, x + Math.cos(b) * rr * 0.6, -6.2 + Math.sin(b) * rr * 0.6, 0.38); }
      ctx.fillStyle = P.m3; ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); dot(ctx, x - rr * 0.14, -6.2 - rr * 0.16, rr * 0.14); ctx.fill();
    } else {
      ctx.strokeStyle = P.m3; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * rr * 0.45, -6.2 + Math.sin(a) * rr * 0.45); ctx.lineTo(x + Math.cos(a) * rr * 0.85, -6.2 + Math.sin(a) * rr * 0.85); ctx.stroke();
    }
  }
  // 구동륜 톱니 (앞바퀴)
  if (lod >= 1) {
    const x = xs[xs.length - 1], R = (big ? r : r + 0.3) + 0.15;
    ctx.beginPath();
    for (let k = 0; k < 8; k++) { const b = a + k * TAU / 8; ctx.moveTo(x + Math.cos(b - 0.16) * (R - 1), -6.2 + Math.sin(b - 0.16) * (R - 1)); ctx.lineTo(x + Math.cos(b) * R, -6.2 + Math.sin(b) * R); ctx.lineTo(x + Math.cos(b + 0.16) * (R - 1), -6.2 + Math.sin(b + 0.16) * (R - 1)); }
    ctx.fillStyle = P.m2; ctx.fill();
  }
  // 흙/눈 묻음
  if (lod >= 2 && !st.dead) {
    ctx.fillStyle = A.snowTread ? 'rgba(255,255,255,0.85)' : 'rgba(95,70,40,0.45)';
    ctx.beginPath(); ell(ctx, -12, -1.2, 3, 0.9); ell(ctx, 6, -0.9, 2.2, 0.7); ell(ctx, 16, -1.4, 1.6, 0.6); ctx.fill();
  }
  if (A.snowTread && !st.dead) {
    ctx.fillStyle = 'rgba(250,253,255,0.95)'; ctx.beginPath(); ell(ctx, -10, -12.6, 4, 1.1); ell(ctx, 3, -12.7, 3, 0.9); ell(ctx, 14, -12.5, 2.4, 0.8); ctx.fill();
  }
}
