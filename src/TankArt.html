<script>
/* =========================================================
 *  TankArt: 말랑 장난감 탱크 캐릭터 (컨셉 B: 목욕 장난감 / 인형)
 *   - 포탑 = 얼굴: 큰 콩눈(반짝이) · 볼터치 · 작은 입, 포신은 귀여운 주둥이처럼 머리 뒤에서 쏙
 *   - 6종 소품: 캐논(폭탄 머리+심지) · 미사일(로켓 가방) · 레이저(별 요술봉) · 멀티(바람개비+개틀링)
 *               · 아이스(펭귄 얼굴+털모자+얼음 결정) · 에어(종이비행기 날개+프로펠러 모자)
 *   - 플레이어 색: 뜨개 목도리(펄럭) + 리본/모자 + 박하사탕 바퀴 무늬
 *   - 표정: 깜빡임·포신 쪽 시선·두리번, 의욕, 차지(찡그림·땀), 기쁨/우쭐/슬픔/화남, 아야(>_<),
 *           꽁꽁(덜덜), 저체력(반창고), 기절(뱅글눈·빙글빙글 별), 승리(폴짝), 패배(엉엉)
 *   - 말랑 변형: 이동 통통, 발사 찌그러짐, 피격 출렁
 *   로컬 좌표: 발밑 중앙이 원점, +x 가 정면. 포신 피벗 (-3,-25), 길이 30 → Sim.muzzle() 과 일치
 *   성능: ctx.filter / shadowBlur 미사용, 그라디언트는 팔레트별 캐시, 화면 배율(ppu)에 따라 LOD
 * ========================================================= */
(function () {
'use strict';
const PI = Math.PI, TAU = PI * 2;
const PVX = -3, PVY = -25;                 // 포신 피벗 (Sim.muzzle 과 동일)
const HX = -3, HY = -30;                   // 머리(=포탑) 중심
const SQY = -11;                           // 말랑 변형 기준선 (궤도 윗면)
const EYE_L = -7, EYE_R = 3.8, EYE_Y = -30.6, MX = -1.6, MY = -24.7;
const INK = '#2b2140';

/* ---------------- 색 유틸 ---------------- */
const RGB = {};
function rgbOf(c) {
  let v = RGB[c]; if (v) return v;
  if (c[0] === '#') { const n = parseInt(c.slice(1, 7), 16); v = [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  else { const m = c.match(/[\d.]+/g) || [0, 0, 0]; v = [+m[0], +m[1], +m[2]]; }
  return (RGB[c] = v);
}
const cstr = a => 'rgb(' + (a[0] | 0) + ',' + (a[1] | 0) + ',' + (a[2] | 0) + ')';
function mix(a, b, k) { const x = rgbOf(a), y = rgbOf(b); return cstr([x[0] + (y[0] - x[0]) * k, x[1] + (y[1] - x[1]) * k, x[2] + (y[2] - x[2]) * k]); }
const lt = (c, k) => k >= 0 ? mix(c, '#ffffff', k) : mix(c, '#000000', -k);
function rgba(c, a) { const x = rgbOf(c); return 'rgba(' + (x[0] | 0) + ',' + (x[1] | 0) + ',' + (x[2] | 0) + ',' + a + ')'; }
/** 기절 색: 채도를 낮춘 라벤더 회색 쪽으로 (그을림 X, 귀엽게 '힘 빠진' 느낌) */
const FNT = {};
function faint(c, k) {
  k = k || 0.5;
  const key = c + k;
  if (FNT[key]) return FNT[key];
  const x = rgbOf(c), l = x[0] * 0.3 + x[1] * 0.55 + x[2] * 0.15;
  const g = [l * 0.78 + 36, l * 0.76 + 34, l * 0.8 + 56];
  return (FNT[key] = cstr([x[0] + (g[0] - x[0]) * k, x[1] + (g[1] - x[1]) * k, x[2] + (g[2] - x[2]) * k]));
}
const num = (v, d) => { v = +v; return isFinite(v) ? v : d; };

/* ---------------- 그라디언트 (캐시) ---------------- */
let GXC = null;
const gx = () => GXC || (GXC = document.createElement('canvas').getContext('2d'));
function stops(g, s) { s.forEach((c, i) => Array.isArray(c) ? g.addColorStop(c[0], c[1]) : g.addColorStop(i / (s.length - 1), c)); return g; }
const lin = (x0, y0, x1, y1, s) => stops(gx().createLinearGradient(x0, y0, x1, y1), s);
const rad = (x, y, r0, r1, s, x1, y1) => stops(gx().createRadialGradient(x, y, r0, x1 === undefined ? x : x1, y1 === undefined ? y : y1, r1), s);
const GC = {};
const cg = (k, mk) => GC[k] || (GC[k] = mk());
const pg = (P, k, mk) => P.g[k] || (P.g[k] = mk());

/* ---------------- save/restore 안전장치 (예외가 나도 캔버스 상태 복구) ---------------- */
let DEP = 0, GA = 1;
function SV(ctx) { ctx.save(); DEP++; }
function RS(ctx) { if (DEP > 0) { ctx.restore(); DEP--; } }
function alpha(ctx, a) { ctx.globalAlpha = GA * (a < 0 ? 0 : a > 1 ? 1 : a); }

/* ---------------- 팔레트 (탱크 원래 색을 파스텔로) ---------------- */
const TOY = {
  cannon:  { h: '#a3d160', hd: '#6d9c35', b: '#86b54a', bd: '#557d2b', a: '#f7de8e', ad: '#c9a648', iris: '#4f8a2a' },
  missile: { h: '#8dbcff', hd: '#5584dc', b: '#6494ec', bd: '#3a60b0', a: '#f6f9ff', ad: '#b8c8e8', iris: '#2f6ad6' },
  laser:   { h: '#f6f1ff', hd: '#c4b1ee', b: '#bba2f4', bd: '#7f63c8', a: '#ff7fe3', ad: '#c040d6', iris: '#9b4fd8' },
  multi:   { h: '#ffb86e', hd: '#e2853a', b: '#f99f4c', bd: '#bb671f', a: '#6f6980', ad: '#48425a', iris: '#c8631a' },
  ice:     { h: '#63bdec', hd: '#3389c2', b: '#a2e3fb', bd: '#4ba8d4', a: '#ffffff', ad: '#bfe6f6', iris: '#2a86c8' },
  air:     { h: '#ffe07c', hd: '#e1af38', b: '#f6c94f', bd: '#ba8a1c', a: '#9aa7b6', ad: '#5d6977', iris: '#b87a14' }
};
const PALS = {};
function pal(id, pc, dead) {
  const key = id + pc.c + (pc.d || '') + (pc.l || '') + (dead ? 'x' : '');
  if (PALS[key]) return PALS[key];
  const T = TOY[id], X = dead ? c => faint(c, 0.5) : c => c, XP = dead ? c => faint(c, 0.3) : c => c;
  const pcd = pc.d || lt(pc.c, -0.35), pcl = pc.l || lt(pc.c, 0.55);
  return (PALS[key] = {
    id, dead, g: {},
    h: X(T.h), hl: X(lt(T.h, 0.55)), hd: X(T.hd), hline: X(mix(T.hd, INK, 0.58)),
    b: X(T.b), bl: X(lt(T.b, 0.42)), bd: X(T.bd), bline: X(mix(T.bd, INK, 0.55)),
    a: X(T.a), al: X(lt(T.a, 0.55)), ad: X(T.ad), aline: X(mix(T.ad, INK, 0.55)),
    pc: XP(pc.c), pcl: XP(pcl), pcd: XP(pcd), pline: XP(mix(pcd, INK, 0.45)),
    trk: X('#7a7098'), trkl: X('#a197c0'), trkd: X('#524a6c'), trkline: X('#352e4c'),
    cw: X('#fffaf2'), cwd: X('#eadcc8'), cline: X('#8e7a8a'),
    iris: X(T.iris), ink: dead ? '#3a3350' : INK
  });
}
function normPc(pc) {
  if (pc && typeof pc.c === 'string' && pc.c[0] === '#') return pc;
  return (typeof PCOLORS !== 'undefined' && PCOLORS[0]) || { c: '#ff5252', d: '#a8182a', l: '#ffb3b3' };
}

/* ---------------- 공용 도형 ---------------- */
function ell(ctx, x, y, rx, ry, r) { r = r || 0; ctx.moveTo(x + rx * Math.cos(r), y + rx * Math.sin(r)); ctx.ellipse(x, y, rx, ry, r, 0, TAU); }
function dot(ctx, x, y, r) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU); }
function rotAt(ctx, x, y, a) { ctx.translate(x, y); ctx.rotate(a); ctx.translate(-x, -y); }
function star4(ctx, x, y, r) { ctx.moveTo(x, y - r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.quadraticCurveTo(x, y, x, y + r); ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r); }
function star5(ctx, x, y, r, rot) {
  rot = rot || 0; ctx.moveTo(x + Math.cos(rot - PI / 2) * r, y + Math.sin(rot - PI / 2) * r);
  for (let i = 1; i < 10; i++) { const a = rot - PI / 2 + i * PI / 5, q = i & 1 ? r * 0.47 : r; ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); }
  ctx.closePath();
}
function heart(ctx, x, y, r) {
  ctx.moveTo(x, y + r * 0.9);
  ctx.bezierCurveTo(x - r * 1.5, y - r * 0.1, x - r * 0.7, y - r * 1.25, x, y - r * 0.45);
  ctx.bezierCurveTo(x + r * 0.7, y - r * 1.25, x + r * 1.5, y - r * 0.1, x, y + r * 0.9);
}
function drop(ctx, x, y, s) { // 물방울 (위가 뾰족)
  ctx.moveTo(x, y - 1.7 * s);
  ctx.bezierCurveTo(x + 1.25 * s, y - 0.2 * s, x + 1.15 * s, y + 1.05 * s, x, y + 1.05 * s);
  ctx.bezierCurveTo(x - 1.15 * s, y + 1.05 * s, x - 1.25 * s, y - 0.2 * s, x, y - 1.7 * s);
}
/** 가산 합성 광원 (단위 원 그라디언트 캐시 후 스케일) */
function glow(ctx, x, y, r, col, a) {
  if (!(a > 0.01) || !(r > 0)) return;
  const g = cg('gl' + col, () => rad(0, 0, 0, 1, [[0, rgba(col, 0.85)], [0.35, rgba(col, 0.4)], [1, rgba(col, 0)]]));
  SV(ctx); ctx.globalCompositeOperation = 'lighter'; alpha(ctx, a);
  ctx.translate(x, y); ctx.scale(r, r); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 1, 0, TAU); ctx.fill(); RS(ctx);
}
function fillStroke(ctx, fill, line, lw) { ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = line; ctx.lineWidth = lw; ctx.stroke(); }
/** 반짝이 (4각 별 + 흰 점) */
function sparkle(ctx, x, y, r, col) {
  ctx.fillStyle = col || '#fff6b0'; ctx.beginPath(); star4(ctx, x, y, r); ctx.fill();
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); dot(ctx, x, y, r * 0.28); ctx.fill();
}

/* =========================================================
 *  리본 · 목도리 (플레이어 색)
 * ========================================================= */
function bow(ctx, P, st, x, y, rot, k) {
  SV(ctx); ctx.translate(x, y);
  ctx.rotate(rot + (st.dead ? 0.35 : Math.sin(st.t * 3 + st.seed) * 0.06 + (st.moving ? Math.sin(st.t * 22) * 0.08 : 0)));
  ctx.scale(k, k);
  const lw = st.lw / k, lod = st.lod;
  // 꼬리
  ctx.beginPath();
  ctx.moveTo(-0.6, 0.8); ctx.lineTo(-3.4, 6.2); ctx.lineTo(-1.9, 5.5); ctx.lineTo(-1.1, 6.9); ctx.lineTo(0.9, 1.1); ctx.closePath();
  ctx.moveTo(0.6, 0.8); ctx.lineTo(3.1, 5.9); ctx.lineTo(1.6, 5.4); ctx.lineTo(0.6, 6.5); ctx.lineTo(-0.7, 1.1); ctx.closePath();
  fillStroke(ctx, P.pcd, P.pline, lw * 0.85);
  // 고리
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.bezierCurveTo(-2.8, -4.6, -7.6, -3.8, -6.9, 0.3); ctx.bezierCurveTo(-6.4, 3.6, -2.6, 2.9, 0, 0);
  ctx.moveTo(0, 0); ctx.bezierCurveTo(2.8, -4.6, 7.6, -3.8, 6.9, 0.3); ctx.bezierCurveTo(6.4, 3.6, 2.6, 2.9, 0, 0);
  fillStroke(ctx, lod ? pg(P, 'bow', () => lin(0, -4, 0, 3, [P.pcl, P.pc, P.pcd])) : P.pc, P.pline, lw);
  if (lod >= 1) {
    ctx.beginPath(); ctx.moveTo(-1.6, -0.4); ctx.quadraticCurveTo(-3.6, -1.2, -4.9, 0.2); ctx.moveTo(1.6, -0.4); ctx.quadraticCurveTo(3.6, -1.2, 4.9, 0.2);
    ctx.strokeStyle = rgba(P.pcd, 0.7); ctx.lineWidth = lw * 0.7; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ell(ctx, -4.4, -2.1, 1.3, 0.6, -0.3); ell(ctx, 4.1, -2.3, 1.1, 0.5, 0.3); ctx.fill();
  }
  // 매듭
  ctx.beginPath(); ell(ctx, 0, 0, 1.7, 1.9); fillStroke(ctx, P.pc, P.pline, lw * 0.9);
  RS(ctx);
}
/** 목도리 띠 + 매듭 (머리 아래, 차체 위) */
function scarfPath(ctx) {
  ctx.beginPath();
  ctx.moveTo(-16.6, -22.4); ctx.quadraticCurveTo(-3, -17.2, 10.4, -22.6);
  ctx.quadraticCurveTo(11.6, -20.5, 10.8, -18.2); ctx.quadraticCurveTo(-3, -12.2, -17.2, -17.6);
  ctx.quadraticCurveTo(-17.9, -20.2, -16.6, -22.4); ctx.closePath();
}
function scarf(ctx, P, st) {
  const lw = st.lw, lod = st.lod;
  scarfPath(ctx);
  ctx.fillStyle = lod ? pg(P, 'scf', () => lin(0, -22, 0, -13.5, [P.pcl, P.pc, P.pcd])) : P.pc; ctx.fill();
  { // 줄무늬 + 뜨개 결
    SV(ctx); ctx.clip();
    ctx.fillStyle = lod ? rgba(P.pcl, 0.9) : 'rgba(255,255,255,0.75)';
    ctx.beginPath(); for (let i = 0; i < 3; i++) { const x = -9.5 + i * 7; ctx.rect(x, -24, lod ? 2.1 : 2.4, 12); } ctx.fill();
    if (lod >= 2) { // 뜨개 코 (V 무늬) — 띠 가운데 곡선을 따라
      ctx.beginPath();
      for (let r = 0; r < 2; r++) for (let i = 1; i < 16; i++) {
        const u = i / 16, a = 1 - u, cx = a * a * -16.9 + 2 * u * a * -3 + u * u * 10.6, cy = a * a * -20 + 2 * u * a * -14.7 + u * u * -20.4 - 1.2 + r * 2.3;
        ctx.moveTo(cx - 0.6, cy - 0.5); ctx.lineTo(cx, cy + 0.45); ctx.lineTo(cx + 0.6, cy - 0.5);
      }
      ctx.strokeStyle = rgba(P.pcd, 0.3); ctx.lineWidth = 0.32; ctx.stroke();
    }
    RS(ctx); scarfPath(ctx);
  }
  ctx.strokeStyle = P.pline; ctx.lineWidth = lw; ctx.stroke();
  // 매듭
  ctx.beginPath(); ell(ctx, -16.4, -19.6, 2.8, 3.1, 0.2); fillStroke(ctx, P.pc, P.pline, lw);
  if (lod >= 1) { ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.beginPath(); ell(ctx, -17.1, -21, 1.1, 0.7, -0.4); ctx.fill(); }
}
/** 목도리 꼬리 두 가닥 (바람·이동에 펄럭) */
function scarfTails(ctx, P, st) {
  const t = st.t, dead = st.dead, lw = st.lw, lod = st.lod;
  const amp = dead ? 0.15 : 0.7 + Math.min(1.6, Math.abs(st.wl) * 0.13) + (st.moving ? 0.9 : 0) + (st.pose === 'win' ? 0.7 : 0);
  const sp = dead ? 1.2 : 6.5 + Math.abs(st.wl) * 0.35 + (st.moving ? 5 : 0);
  const lift = dead ? -0.5 : clamp(-st.wl * 0.035, -0.25, 0.35) + (st.moving ? 0.25 : 0);
  for (let k = 1; k >= 0; k--) {
    const L = (k ? 9.2 : 11.8) * (dead ? 0.9 : 1), w0 = 3.3, N = 6;
    const ang = PI + (k ? 0.72 : 0.36) - lift * (k ? 0.6 : 1);
    const dx = Math.cos(ang), dy = Math.sin(ang), nx = -dy, ny = dx;
    const x0 = -16.8 + k * 0.4, y0 = -18.6 + k * 1.2;
    const top = [], bot = [];
    for (let i = 0; i <= N; i++) {
      const u = i / N, wv = Math.sin(t * sp - u * 4.2 + k * 1.7 + st.seed) * amp * u * 1.6;
      const cx = x0 + dx * u * L + nx * wv, cy = y0 + dy * u * L + ny * wv + (dead ? u * u * 3 : 0), hw = w0 * 0.5 * (1 - u * 0.12);
      top.push(cx + nx * hw, cy + ny * hw); bot.push(cx - nx * hw, cy - ny * hw);
    }
    ctx.beginPath(); ctx.moveTo(top[0], top[1]);
    for (let i = 2; i < top.length; i += 2) ctx.lineTo(top[i], top[i + 1]);
    for (let i = bot.length - 2; i >= 0; i -= 2) ctx.lineTo(bot[i], bot[i + 1]);
    ctx.closePath();
    ctx.fillStyle = k ? P.pcd : P.pc; ctx.fill();
    if (lod >= 1) { // 끝 줄무늬
      const i = N - 1, j = N - 2;
      ctx.beginPath(); ctx.moveTo(top[i * 2], top[i * 2 + 1]); ctx.lineTo(top[j * 2], top[j * 2 + 1]); ctx.lineTo(bot[j * 2], bot[j * 2 + 1]); ctx.lineTo(bot[i * 2], bot[i * 2 + 1]); ctx.closePath();
      ctx.fillStyle = rgba(P.pcl, 0.95); ctx.fill();
    }
    ctx.beginPath(); ctx.moveTo(top[0], top[1]);
    for (let i = 2; i < top.length; i += 2) ctx.lineTo(top[i], top[i + 1]);
    for (let i = bot.length - 2; i >= 0; i -= 2) ctx.lineTo(bot[i], bot[i + 1]);
    ctx.closePath(); ctx.strokeStyle = P.pline; ctx.lineWidth = lw * 0.9; ctx.stroke();
    if (lod >= 2) { // 술
      const ex = (top[N * 2] + bot[N * 2]) / 2, ey = (top[N * 2 + 1] + bot[N * 2 + 1]) / 2;
      ctx.beginPath();
      for (let q = -1; q <= 1; q++) { const bx = ex + nx * q * 1.1, by = ey + ny * q * 1.1; ctx.moveTo(bx, by); ctx.lineTo(bx + dx * 1.6, by + dy * 1.6 + 0.3); }
      ctx.strokeStyle = P.pcd; ctx.lineWidth = 0.55; ctx.stroke();
    }
  }
}

/* =========================================================
 *  궤도(고무 밴드) + 박하사탕 바퀴
 * ========================================================= */
const WX = [-18.4, -6.15, 6.15, 18.4], WY = -5.8, WR = 4.15;
function track(ctx, P, st) {
  const lod = st.lod, lw = st.lw;
  rrect(ctx, -26.2, -11.6, 52.4, 11.6, 5.8);
  ctx.fillStyle = lod ? pg(P, 'trk', () => lin(0, -11.6, 0, 0, [P.trkl, P.trk, P.trkd])) : P.trk; ctx.fill();
  if (lod >= 1) { // 움직이는 고무 돌기
    rrect(ctx, -25.1, -10.5, 50.2, 9.4, 4.7);
    ctx.setLineDash([1.6, 2.4]); ctx.lineDashOffset = -st.tread;
    ctx.strokeStyle = 'rgba(40,30,70,0.32)'; ctx.lineWidth = 1.2; ctx.stroke(); ctx.setLineDash([]); ctx.lineDashOffset = 0;
  }
  rrect(ctx, -26.2, -11.6, 52.4, 11.6, 5.8); ctx.strokeStyle = P.trkline; ctx.lineWidth = lw; ctx.stroke();
  // 사탕 바퀴 (한 번에 채우기)
  const rot = st.tread / WR;
  ctx.beginPath(); for (const x of WX) dot(ctx, x, WY, WR);
  ctx.fillStyle = lod >= 2 ? pg(P, 'cw', () => lin(0, WY - WR, 0, WY + WR, [P.cw, P.cw, P.cwd])) : lod ? pg(P, 'cw1', () => lin(0, WY - WR, 0, WY + WR, [mix(P.pcl, '#ffffff', 0.35), P.pcl])) : P.pc; ctx.fill();
  ctx.strokeStyle = lod ? P.cline : P.pline; ctx.lineWidth = lw * 0.8; ctx.stroke();
  // 소용돌이 (플레이어 색 박하사탕) — 작은 화면에선 통째로 플레이어 색 사탕
  ctx.beginPath();
  if (lod === 0) { for (const x of WX) { const a = rot; ctx.moveTo(x + Math.cos(a) * WR * 0.2, WY + Math.sin(a) * WR * 0.2); ctx.lineTo(x + Math.cos(a) * WR * 0.75, WY + Math.sin(a) * WR * 0.75); } ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = lw * 0.7; ctx.stroke(); ctx.beginPath(); }
  else {
    const r = WR * 0.8;
    for (const x of WX) for (let k = 0; k < 3; k++) { // 같은 방향으로 휘어진 소용돌이 조각
      const a = rot + k * TAU / 3, a2 = a + 1.15;

  ctx.beginPath(); drop(ctx, x, y, s); ctx.fillStyle = '#a8e0ff'; ctx.fill(); ctx.strokeStyle = '#4c9fd8'; ctx.lineWidth = Math.min(st.lw * 0.7, 0.5 * s + 0.2); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.beginPath(); ell(ctx, x - 0.35 * s, y - 0.1 * s, 0.28 * s, 0.45 * s, 0.3); ctx.fill();
}
function bandAid(ctx, st, x, y, rot, k) {
  SV(ctx); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(k, k);
  rrect(ctx, -3.6, -1.3, 7.2, 2.6, 1.3); fillStroke(ctx, '#ffe2c2', '#c7936a', st.lw * 0.7 / k);
  ctx.fillStyle = '#f5c8a0'; rrect(ctx, -1.2, -1, 2.4, 2, 0.5); ctx.fill();
  if (st.lod >= 2) { ctx.fillStyle = 'rgba(190,130,90,0.6)'; ctx.beginPath(); for (let i = -1; i <= 1; i += 2) for (let j = -1; j <= 1; j += 2) dot(ctx, i * 2.5, j * 0.45, 0.18); ctx.fill(); }
  RS(ctx);
}
function crossPlaster(ctx, st, x, y, k) {
  SV(ctx); ctx.translate(x, y); ctx.scale(k, k);
  for (const r of [0.75, -0.75]) { SV(ctx); ctx.rotate(r); rrect(ctx, -4.2, -1.35, 8.4, 2.7, 1.3); fillStroke(ctx, '#ffe7cc', '#c7936a', st.lw * 0.7 / k); RS(ctx); }
  ctx.fillStyle = '#f3c9a2'; ctx.beginPath(); dot(ctx, 0, 0, 1.1); ctx.fill();
  RS(ctx);
}
function extras(ctx, P, st, A) {
  const e = st.expr, t = st.t, lod = st.lod, top = HY - A.ry;
  const gk = e === 'idle' || e === 'determined' || e === 'strain' || e === 'worried' || e === 'smug' || e === 'angry' || e === 'sad' ? 1 : 0.25;
  const ox = st.gx * 1.5 * gk, oy = st.gy * 1.05 * gk, L = EYE_L + ox, R = EYE_R + ox, Y = EYE_Y + oy;
  if (st.hpr < 0.3 || st.dead) crossPlaster(ctx, st, 13.5, -16.8, 0.85);
  switch (e) {
    case 'strain': {
      const c = st.charge;
      sweat(ctx, st, 9.4, -38.5 + Math.sin(t * 20) * 0.3, 0.7 + c * 1.1);
      if (c > 0.4 && lod >= 1) { // 힘주기 선
        alpha(ctx, (c - 0.4) * 1.6); ctx.beginPath();
        for (let i = 0; i < 3; i++) { const a = -2.4 + i * 0.42, r0 = 17.2 + Math.sin(t * 30 + i) * 0.5; ctx.moveTo(HX + Math.cos(a) * r0, HY + Math.sin(a) * r0); ctx.lineTo(HX + Math.cos(a) * (r0 + 3), HY + Math.sin(a) * (r0 + 3)); }
        ctx.strokeStyle = P.ink; ctx.lineWidth = st.lw; ctx.stroke(); alpha(ctx, 1);
      }
      break;
    }
    case 'worried': sweat(ctx, st, 9.8, -37.2 + ((t * 0.6) % 1) * 1.5, 1.05); break;
    case 'sad': {
      const ph = (t * 0.55 + st.seed * 0.2) % 1;
      alpha(ctx, ph < 0.8 ? 1 : (1 - ph) * 5); ctx.beginPath(); drop(ctx, R + 1.2, Y + 3.6 + ph * 7, 0.9); ctx.fillStyle = '#9fdcff'; ctx.fill(); ctx.strokeStyle = '#4c9fd8'; ctx.lineWidth = st.lw * 0.5; ctx.stroke(); alpha(ctx, 1);
      break;
    }
    case 'cry': { // 폭포 눈물
      SV(ctx); ctx.fillStyle = 'rgba(140,210,255,0.85)'; ctx.strokeStyle = '#4c9fd8'; ctx.lineWidth = st.lw * 0.55;
      for (const [x, d] of [[L - 1.2, -1], [R + 1.2, 1]]) {
        const w = Math.sin(t * 16 + x) * 0.3;
        ctx.beginPath(); ctx.moveTo(x - 1.1, Y + 1.2); ctx.lineTo(x + 1.1, Y + 1.2);
        ctx.quadraticCurveTo(x + 1.4 + d * 0.8, Y + 5, x + d * 2.4 + 1 + w, Y + 8.5); ctx.lineTo(x + d * 2.4 - 1.2 + w, Y + 8.5);
        ctx.quadraticCurveTo(x - 1.2 + d * 0.8, Y + 5, x - 1.1, Y + 1.2); ctx.closePath(); ctx.fill(); ctx.stroke();
        for (let i = 0; i < 3; i++) {
          const ph = (t * 2.2 + i / 3 + (d > 0 ? 0.5 : 0)) % 1;
          alpha(ctx, 1 - ph); ctx.beginPath(); dot(ctx, x + d * (2.6 + ph * 5), Y + 9 + ph * 6 - Math.sin(ph * PI) * 3, 0.9 - ph * 0.3); ctx.fill();
        }
        alpha(ctx, 1);
      }
      RS(ctx); break;
    }
    case 'happy': case 'win': {
      for (let i = 0; i < 4; i++) {
        const s = Math.sin(t * 5 + i * 1.7); if (s < 0) continue;
        const a = [-2.5, -0.55, -1.55, 0.1][i], r = 18.5 + i * 0.8;
        sparkle(ctx, HX + Math.cos(a) * r, HY + Math.sin(a) * r, 1.3 + s * 1.5);
      }
      if (e === 'win' && lod >= 1) {
        for (let i = 0; i < 2; i++) { const ph = (t * 0.8 + i * 0.5) % 1; alpha(ctx, 1 - ph); ctx.beginPath(); heart(ctx, HX - 14 + i * 26 + Math.sin(ph * 6 + i) * 1.5, HY - 12 - ph * 12, 1.6); ctx.fillStyle = '#ff7aa8'; ctx.fill(); }
        alpha(ctx, 1);
      }
      break;
    }
    case 'smug': { const s = Math.max(0, Math.sin(t * 3.2)); if (s > 0.1) sparkle(ctx, R + 5.5, Y - 5, 0.8 + s * 1.4); break; }
    case 'determined': { const s = Math.max(0, Math.sin(t * 2.6 + st.seed)); if (s > 0.3 && lod >= 1) sparkle(ctx, R + 6.5, Y - 6.5, s * 1.4); break; }
    case 'angry': { // 💢 + 김
      const s = 1 + Math.sin(t * 9) * 0.12, ax = 8.2, ay = -41;
      SV(ctx); ctx.translate(ax, ay); ctx.scale(s, s); ctx.beginPath();
      for (let i = 0; i < 4; i++) { const c = Math.cos(i * PI / 2), sn = Math.sin(i * PI / 2); const p = (x, y) => [x * c - y * sn, x * sn + y * c]; const a0 = p(0.6, -2.3), a1 = p(0.6, -0.6), a2 = p(2.3, -0.6); ctx.moveTo(a0[0], a0[1]); ctx.quadraticCurveTo(a1[0], a1[1], a2[0], a2[1]); }
      ctx.strokeStyle = '#ff4060'; ctx.lineWidth = Math.max(st.lw * 1.1, 0.9); ctx.stroke(); RS(ctx);
      if (lod >= 1) for (let i = 0; i < 2; i++) {
        const ph = (t * 1.6 + i * 0.5) % 1; alpha(ctx, (1 - ph) * 0.85);
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); dot(ctx, HX - 8 + i * 5 - ph * 2, top - 1 - ph * 7, 1.1 + ph * 1.6); ctx.fill();
      }
      alpha(ctx, 1); break;
    }
    case 'hurt': {
      const hk = clamp(st.hurtT / 0.5, 0, 1);
      for (let i = 0; i < 3; i++) {
        const a = [-2.3, -1.2, -0.2][i], r = 16 + (1 - hk) * 7;
        alpha(ctx, Math.min(1, hk * 1.6)); ctx.beginPath(); star5(ctx, HX + Math.cos(a) * r, HY + Math.sin(a) * r, 1.4 + hk * 1.2, t * 4 + i);
        fillStroke(ctx, '#ffe25a', '#e89a1c', st.lw * 0.6);
      }
      alpha(ctx, 1); break;
    }
    case 'dead': { // 빙글빙글 별 + 작은 연기
      const cx = HX, cy = top - 5;
      for (let i = 0; i < 3; i++) {
        const a = t * 3.2 + i * TAU / 3, x = cx + Math.cos(a) * 11, y = cy + Math.sin(a) * 3, s = 1.7 + Math.sin(a) * 0.55;
        ctx.beginPath(); star5(ctx, x, y, s, t * 2 + i); fillStroke(ctx, '#ffe066', '#d99a22', st.lw * 0.6);
      }
      if (lod >= 1) {
        const ph = (t * 0.45 + st.seed * 0.3) % 1; alpha(ctx, Math.sin(ph * PI) * 0.7);
        ctx.fillStyle = '#e9e6f2'; ctx.beginPath(); const px = HX - 12 - ph * 3, py = HY - 8 - ph * 12, r = 1.4 + ph * 1.8;
        dot(ctx, px, py, r); dot(ctx, px + r, py + r * 0.2, r * 0.75); dot(ctx, px - r * 0.9, py + r * 0.3, r * 0.65); ctx.fill(); alpha(ctx, 1);
      }
      break;
    }
    case 'frozen': { // 콧물 고드름 + 성에
      ctx.fillStyle = 'rgba(235,250,255,0.95)'; ctx.beginPath(); ctx.moveTo(MX + 1.4, MY + 1.6); ctx.lineTo(MX + 3, MY + 1.6); ctx.lineTo(MX + 2.3, MY + 5.2); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(90,170,230,0.8)'; ctx.lineWidth = st.lw * 0.5; ctx.stroke();
      break;
    }
  }
}

/* ---- 미사일: 로켓 가방 + 쏙 나온 로켓 코 ---- */
function rocket(ctx, P, st, x, y, rot, len, k) {
  SV(ctx); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(k, k);
  const lw = st.lw / k, t = st.t;
  if (!st.dead && (st.active || st.moving || st.charge > 0)) { // 뿅 불꽃
    const fl = 2.6 + Math.sin(t * 40 + x) * 0.6 + st.charge * 2.5;
    ctx.beginPath(); ctx.moveTo(-1.8, 0); ctx.quadraticCurveTo(0, fl * 2.2, 1.8, 0); ctx.closePath(); ctx.fillStyle = '#ffb347'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(-0.9, 0); ctx.quadraticCurveTo(0, fl * 1.3, 0.9, 0); ctx.closePath(); ctx.fillStyle = '#fff3b0'; ctx.fill();
  }
  // 날개
  ctx.beginPath(); ctx.moveTo(-2.6, -4.5); ctx.lineTo(-5, 0.6); ctx.lineTo(-2.6, -0.4); ctx.closePath(); ctx.moveTo(2.6, -4.5); ctx.lineTo(5, 0.6); ctx.lineTo(2.6, -0.4); ctx.closePath();
  fillStroke(ctx, P.b, P.bline, lw * 0.9);
  // 몸통
  rrect(ctx, -2.9, -len, 5.8, len, 2.9);
  ctx.fillStyle = st.lod ? pg(P, 'rk', () => lin(-2.9, 0, 2.9, 0, [P.a, P.a, P.ad])) : P.a; ctx.fill(); ctx.strokeStyle = P.aline; ctx.lineWidth = lw; ctx.stroke();
  ctx.fillStyle = P.b; ctx.fillRect(-2.9, -len * 0.42, 5.8, 1.6);
  // 코 (플레이어 색)
  ctx.beginPath(); ctx.moveTo(-2.9, -len + 2); ctx.quadraticCurveTo(-2.7, -len - 3.2, 0, -len - 4.4); ctx.quadraticCurveTo(2.7, -len - 3.2, 2.9, -len + 2); ctx.closePath();
  fillStroke(ctx, P.pc, P.pline, lw);
  if (st.lod >= 1) { ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.beginPath(); ell(ctx, -1.1, -len - 1.2, 0.6, 1.4, 0.3); ctx.fill(); }
  RS(ctx);
}
