<style>
/* 인게임 오버레이 / HUD / 터치 조작 스타일 */
/* ---------- 게임 내 오버레이 ---------- */
#plist { position: fixed; top: 10px; left: 10px; z-index: 5; display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
.pl { display: grid; grid-template-columns: 12px auto 44px 70px auto; align-items: center; gap: 6px; background: rgba(8,12,28,.72); border-radius: 10px; padding: 4px 10px;
  font-size: 14px; border: 2px solid rgba(0,0,0,.5); backdrop-filter: blur(2px); }
.pl.cur { box-shadow: 0 0 0 2px var(--pc); }
.pl.dead { opacity: .45; text-decoration: line-through; }
.pl .chip { width: 12px; height: 12px; border-radius: 4px; background: var(--pc); }
.pl .nm small { color: var(--muted); font-size: 11px; }
.pl .tk { color: var(--muted); font-size: 12px; }
.pl .hpb { height: 8px; background: #000; border-radius: 4px; overflow: hidden; }
.pl .hpb i { display: block; height: 100%; background: linear-gradient(#8ef0a4, #2ea84f); transition: width .4s; }
.pl .ssb { color: var(--gold); font-family: 'Black Han Sans'; font-size: 12px; }

#banner { position: fixed; left: 0; right: 0; top: 24%; text-align: center; z-index: 20; pointer-events: none; opacity: 0; }
#banner.show { animation: bannerIn 1.8s ease both; }
#banner .bt { font-family: 'Black Han Sans', sans-serif; font-size: clamp(36px, 6vw, 64px); color: #fff; -webkit-text-stroke: 2px #000; text-shadow: 0 4px 0 #000, 0 0 30px rgba(0,0,0,.6); }
#banner .bs { font-size: 22px; color: #fff; text-shadow: 0 2px 4px #000; margin-top: 4px; }
@keyframes bannerIn { 0% { opacity: 0; transform: scale(2); } 12% { opacity: 1; transform: scale(1); } 80% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: translateY(-20px); } }
#toasts { position: fixed; top: 12px; right: 12px; z-index: 30; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; pointer-events: none; }
.toast { background: rgba(10,14,30,.92); border: 2px solid var(--gold); border-radius: 10px; padding: 8px 14px; font-size: 15px; animation: toastIn 3.2s both; max-width: 80vw; }
@keyframes toastIn { 0% { opacity: 0; transform: translateX(30px); } 8%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; } }
@keyframes blink { 50% { opacity: .3; } }

/* ---------- HUD ---------- */
#hud { position: fixed; left: 0; right: 0; bottom: 0; height: var(--hudh); z-index: 6; display: grid; grid-template-columns: minmax(230px, 1fr) minmax(0, 2.4fr) minmax(190px, 1fr); gap: 10px;
  padding: 8px 10px; background: linear-gradient(#34426e, #1a2342 18%, #111830); border-top: 3px solid #000; box-shadow: inset 0 2px 0 rgba(255,255,255,.18), 0 -6px 20px rgba(0,0,0,.4); }
#hud > div { min-height: 0; background: rgba(0,0,0,.28); border-radius: 12px; border: 2px solid rgba(0,0,0,.5); box-shadow: inset 0 1px 0 rgba(255,255,255,.07); }
.hud-l { display: flex; gap: 8px; padding: 6px; align-items: center; min-width: 0; }
#hud-portrait { height: 100%; width: auto; aspect-ratio: 140/84; border-radius: 9px; border: 2px solid #000; }
.hud-info { flex: 1; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.hud-nm { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; overflow: hidden; }
.hud-nm b { font-size: 20px; font-weight: normal; }
.hud-nm small { color: var(--muted); }
.bar { position: relative; height: 16px; background: #05070f; border-radius: 8px; overflow: hidden; border: 1px solid #000; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; transition: width .3s; }
.bar span { position: absolute; inset: 0; font-size: 11px; line-height: 15px; text-align: center; text-shadow: 0 1px 1px #000; }
.bar.hp i { background: linear-gradient(#8ef0a4, #2ea84f 60%, #1d7a36); }
.bar.ss i { background: linear-gradient(#ffe57a, #ff9d1a); }
.bar.ss.full i { animation: ssglow .6s infinite alternate; }
@keyframes ssglow { to { filter: brightness(1.5); } }
.hud-m { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; padding: 6px 10px; align-items: center; min-width: 0; }
.dial { position: relative; height: 100%; aspect-ratio: 1; }
.dial canvas { width: 100%; height: 100%; }
.dial b { position: absolute; bottom: 2px; left: 0; right: 0; text-align: center; font-family: 'Black Han Sans'; font-weight: normal; font-size: 18px; color: var(--gold); text-shadow: 0 2px 0 #000; }
.gauges { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.glabel { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); letter-spacing: 2px; }
.glabel b { color: #fff; font-family: 'Black Han Sans'; font-weight: normal; font-size: 16px; letter-spacing: 0; }
.gauge { position: relative; background: #05070f; border: 2px solid #000; border-radius: 8px; overflow: hidden; }
.gauge.power { height: 26px; }
.gauge.move { height: 12px; }
.gauge.power i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #3fa7ff, #4bdc72 40%, #ffd23f 70%, #ff5252); background-size: calc(100vw) 100%; box-shadow: 0 0 12px rgba(255,210,63,.5); }
.gauge.power em { position: absolute; top: -2px; bottom: -2px; width: 4px; margin-left: -2px; background: var(--gold); box-shadow: 0 0 6px var(--gold); border-radius: 2px; }
.gauge .ticks { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), rgba(255,255,255,.25) calc(10% - 1px) 10%); pointer-events: none; }
.gauge.move i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(#7cc0ff, #1d5fd0); transition: width .1s; }
.weapons { display: flex; gap: 6px; height: 100%; }
.wbtn { width: 96px; border: 2px solid #000; border-radius: 10px; background: linear-gradient(#34426e, #1f2a4d); color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px; }
.wbtn kbd { font-size: 11px; }
.wbtn .wn { font-size: 13px; white-space: nowrap; }
.wbtn .wd { font-size: 10px; color: var(--muted); }
.wbtn.sel { background: linear-gradient(#ffe57a, #ff9d1a); color: #3a2400; box-shadow: 0 0 14px rgba(255,210,63,.6); }
.wbtn.sel .wd { color: #6b3d00; }
.wbtn.ssw:not(.locked) { animation: ssglow .7s infinite alternate; }
.wbtn.locked { opacity: .45; }
.wbtn:disabled { cursor: default; }
.hud-r { display: grid; grid-template-columns: 1fr auto; grid-template-rows: 1fr auto; gap: 4px 8px; padding: 6px 8px; min-width: 0; }
.wind { grid-row: 1 / 3; display: flex; flex-direction: column; justify-content: center; gap: 3px; text-align: center; }
.wl { font-size: 12px; letter-spacing: 3px; color: var(--muted); }
.wbar { display: flex; height: 14px; border: 2px solid #000; border-radius: 7px; overflow: hidden; background: #05070f; }
.wbar .side { flex: 1; position: relative; }
.wbar .l { border-right: 1px solid #555; }
.wbar .l i { position: absolute; right: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #fff, #7ee0ff); transition: width .4s; }
.wbar .r i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #7ee0ff, #fff); transition: width .4s; }
#wind-t { font-size: 16px; }
.timer { font-family: 'Black Han Sans', sans-serif; font-size: 34px; line-height: 1; text-align: center; color: #fff; text-shadow: 0 3px 0 #000; min-width: 52px; align-self: center; }
.timer.warn { color: var(--danger); animation: blink .5s infinite; }
.hbtns { display: flex; gap: 4px; }
.hbtns button { width: 30px; height: 28px; border: 2px solid #000; border-radius: 8px; background: #2a3458; color: #fff; cursor: pointer; font-size: 14px; padding: 0; }
#hud:not(.mine) #btn-skip { opacity: .35; pointer-events: none; }

/* ---------- 터치 ---------- */
#touch { position: fixed; left: 0; right: 0; bottom: calc(var(--hudh) + 8px); z-index: 7; display: none; justify-content: space-between; padding: 0 12px; pointer-events: none; }
body.touch #touch:not(.hidden) { display: flex; }
#touch:not(.active) { opacity: .25; }
.tpad { display: flex; gap: 10px; align-items: flex-end; pointer-events: auto; }
.tpad .updown { display: flex; flex-direction: column; gap: 8px; }
.tpad button { width: 58px; height: 58px; border-radius: 50%; border: 3px solid rgba(0,0,0,.6); background: rgba(40,55,100,.72); color: #fff; font-size: 22px; touch-action: none; }
.tpad button.on { background: rgba(255,210,63,.85); color: #3a2400; }
.tpad .fire { width: 86px; height: 86px; font-size: 22px; font-family: 'Black Han Sans'; background: radial-gradient(circle at 40% 35%, #ff8a7a, #e53935 60%, #8a1010); }

/* ---------- 반응형 ---------- */
@media (max-width: 900px) {
  :root { --hudh: 96px; }
  #hud { grid-template-columns: 1fr 2.2fr auto; gap: 6px; padding: 6px; }
  .hud-l canvas { display: none; }
  .wbtn { width: 64px; }
  .wbtn .wd { display: none; }
  .wbtn .wn { font-size: 11px; white-space: normal; text-align: center; }
  .dial { display: none; }
  .hud-m { grid-template-columns: 1fr auto; }
  .wind { grid-row: auto; }
  .hud-r { grid-template-columns: auto; grid-template-rows: auto auto auto; }
  .timer { font-size: 24px; }
  #plist { font-size: 12px; }
  .pl { grid-template-columns: 10px auto 50px; }
  .pl .tk, .pl .ssb { display: none; }
}
@media (max-width: 600px) {
  .hud-l { display: none !important; }
  #hud { grid-template-columns: 1fr auto; }
}
@media (max-height: 520px) {
  :root { --hudh: 76px; }
  #hud { padding: 4px 6px; gap: 5px; }
  #hud > div { overflow: hidden; }
  .hud-l { padding: 4px 6px; }
  .hud-l canvas, .dial, .wbtn .wd, .wl, .glabel.mv, .hud-nm small { display: none; }
  .hud-info { gap: 3px; }
  .hud-nm b { font-size: 15px; }
  .bar { height: 11px; }
  .bar span { font-size: 9px; line-height: 10px; }
  .hud-m { grid-template-columns: 1fr auto; padding: 4px 6px; gap: 6px; }
  .glabel { font-size: 10px; }
  .glabel b { font-size: 13px; }
  .gauge.power { height: 18px; }
  .gauge.move { height: 8px; }
  .wbtn { width: 60px; padding: 2px; }
  .wbtn .wn { font-size: 10px; }
  .hud-r { padding: 4px; grid-template-columns: auto auto; grid-template-rows: auto auto; gap: 2px 4px; }
  .hud-r .wind { grid-column: 1 / 3; grid-row: auto; }
  .hbtns { flex-direction: column; gap: 2px; }
  .hbtns button { height: 12px; }
  .timer { font-size: 22px; min-width: 34px; }
  #wind-t { font-size: 13px; }
  .hbtns { flex-direction: row !important; }
  .hbtns button { width: 24px; height: 20px !important; font-size: 11px; }
  #plist { top: 6px; left: 6px; gap: 2px; }
  .pl { font-size: 11px; padding: 2px 6px; grid-template-columns: 8px auto 40px; }
  .pl .chip { width: 8px; height: 8px; }
  .pl .tk, .pl .ssb, .pl .nm small { display: none; }
  .tpad button { width: 48px; height: 48px; font-size: 18px; }
  .tpad .fire { width: 70px; height: 70px; font-size: 18px; }
  #banner .bs { font-size: 16px; }
}
</style>
